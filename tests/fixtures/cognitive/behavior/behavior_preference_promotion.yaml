description: >-
  A well-evidenced, established preference with sufficient confidence is
  promoted to STABLE (trusted) during behavior evaluation.
expected:
  result: ACT
  confidence_min: 0.0
  confidence_max: 1.0
  promoted_to_trusted: true
  policy_violation: false
