    <path d="m116 173 128-95" fill="none" stroke="url(#accent)" stroke-width="30" stroke-linecap="round"/>
    <path d="m117 181 132 93" fill="none" stroke="url(#accent)" stroke-width="30" stroke-linecap="round"/>
