  <text x="520" y="202" fill="#F8F7FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="108" font-weight="780" letter-spacing="16">KAREN</text>
  <text x="527" y="265" fill="#E7D8FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="1.5">Local by default. Governed by design.</text>
  <text x="529" y="322" fill="#A9A5B2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="500" letter-spacing="3">PROMPT-FIRST  •  DURABLE MEMORY  •  PROVIDER ORCHESTRATION  •  OBSERVABLE</text>
</svg>
