# Canonical production overlay for AI Karen.
#
# Usage:
#   docker compose \
#     --env-file .env.production \
#     -f docker-compose.yml \
#     -f deploy/compose/docker-compose.prod.yml \
#     up -d
#
# This file intentionally contains no secret defaults. Required production
# secrets must be supplied by the deployment environment.

services:
  redis:
    env_file: !reset []
    ports: !reset []
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required for production}

  api:
    env_file: !reset []
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AUTH_DEV_MODE: "false"
      AUTH_ALLOW_DEV_LOGIN: "false"
      KARI_AUTH_BYPASS: "false"
      AUTH_ENABLE_SESSION_VALIDATION: "true"
      KARI_FAST_STARTUP: "false"
      KARI_SKIP_STARTUP_CHECK: "false"
      KARI_SKIP_AUTO_INIT: "false"
      KARI_DEFER_ROUTER_WIRING: "false"
      EXTENSION_DEV_BYPASS_ENABLED: "false"
      EXTENSION_REQUIRE_HTTPS: "true"
      ALLOW_PUBLIC_COPILOT: "false"
      KAREN_BUILTIN_VLLM_ENABLED: "false"

      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required for production}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required for production}
      AUTH_JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY:?AUTH_JWT_SECRET_KEY is required for production}
      EXTENSION_SECRET_KEY: ${EXTENSION_SECRET_KEY:?EXTENSION_SECRET_KEY is required for production}
      EXTENSION_API_KEY: ${EXTENSION_API_KEY:?EXTENSION_API_KEY is required for production}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required for production}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for production}@redis:6379/0

      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production}
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required for production}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?AUTH_DATABASE_URL is required for production}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required for production}
      DB_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required for production}
      DB_HOST: ${DB_HOST:?DB_HOST is required for production}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?DB_USER is required for production}
      DB_NAME: ${DB_NAME:?DB_NAME is required for production}

    # The production image already contains source and canonical application
    # configuration. Never inherit development source/config bind mounts, which
    # would replace or mask the attested image with mutable host state.
    volumes: !override
      - ./models:/app/models:rw
      - logs_data:/app/logs
      - backup_data:/app/backups
      - ./models/transformers:/root/.cache/huggingface/hub:rw
      - ./models/transformers:/app/cache/transformers:rw

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8000/health/live || exit 1
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 45s

  web:
    build:
      context: ./src/ui_launchers/Karen-AI-Theme
      dockerfile: Dockerfile.production
    image: ai-karen-web:production
    env_file: !reset []
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      KAREN_BACKEND_URL: http://api:8000
      KAREN_DOCKER: "true"
      NEXT_PUBLIC_API_PROXY_TIMEOUT_MS: "30000"
      NEXT_PUBLIC_API_PROXY_LONG_TIMEOUT_MS: "120000"
    volumes: !reset []
    command: !reset null
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8010/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  prometheus:
    ports: !reset []

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required when observability is enabled}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: !reset []
