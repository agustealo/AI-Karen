services:
  # ──────────────────────────────────────────────────────────────────────
  # PostgreSQL (Primary Database with pgvector)
  # ──────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: ai-karen-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_karen}
      POSTGRES_USER: ${POSTGRES_USER:-karen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karen_secure_pass_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/database/init/postgres:/docker-entrypoint-initdb.d:ro
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karen_user} -d ${POSTGRES_DB:-ai_karen}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-karen-net

  # ──────────────────────────────────────────────────────────────────────
  # Redis (Caching & Session Storage)
  # ──────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-karen-redis
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-redis_secure_pass_change_me}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-karen-net

  # ──────────────────────────────────────────────────────────────────────
  # DuckDB (Analytics & Local Storage)
  # ──────────────────────────────────────────────────────────────────────
  duckdb-manager:
    image: alpine:latest
    container_name: ai-karen-duckdb-manager
    volumes:
      - duckdb_data:/data/duckdb
      - ./docker/database/init/duckdb:/init:ro
    command: /bin/sh -c "while true; do sleep 3600; done"
    restart: unless-stopped
    networks:
      - ai-karen-net

  

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  duckdb_data:
    driver: local

networks:
  ai-karen-net:
    driver: bridge