name: Production First-Boot Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "src/ai_karen_engine/**"
      - "src/ui_launchers/Karen-AI-Theme/Dockerfile.production"
      - "src/ui_launchers/Karen-AI-Theme/server.mjs"
      - "src/ui_launchers/Karen-AI-Theme/package.json"
      - "src/ui_launchers/Karen-AI-Theme/package-lock.json"
      - "src/ui_launchers/Karen-AI-Theme/next.config.*"
      - "supabase/migrations/**"
      - "scripts/ci/production-first-boot-smoke.sh"
      - "tests/architecture/test_first_run_system_contract.py"
      - "docs/architecture/FIRST_RUN_SYSTEM.md"
      - "README.md"
      - "PROJECT_DEV_MANIFEST.md"
      - ".github/workflows/production-first-boot-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "src/ai_karen_engine/**"
      - "src/ui_launchers/Karen-AI-Theme/Dockerfile.production"
      - "src/ui_launchers/Karen-AI-Theme/server.mjs"
      - "src/ui_launchers/Karen-AI-Theme/package.json"
      - "src/ui_launchers/Karen-AI-Theme/package-lock.json"
      - "src/ui_launchers/Karen-AI-Theme/next.config.*"
      - "supabase/migrations/**"
      - "scripts/ci/production-first-boot-smoke.sh"
      - "tests/architecture/test_first_run_system_contract.py"
      - "docs/architecture/FIRST_RUN_SYSTEM.md"
      - "README.md"
      - "PROJECT_DEV_MANIFEST.md"
      - ".github/workflows/production-first-boot-smoke.yml"

permissions:
  contents: read

jobs:
  first-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Attest exact worker SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run first-run architecture contract
        run: |
          python -m pip install --disable-pip-version-check pytest
          pytest tests/architecture/test_first_run_system_contract.py -q

      - name: Validate smoke harness
        run: bash -n scripts/ci/production-first-boot-smoke.sh

      - name: Build production API image
        run: docker build --target app --build-arg PROFILE=runtime -t ai-karen-api:beta .

      - name: Build production web image
        run: |
          docker build \
            -f src/ui_launchers/Karen-AI-Theme/Dockerfile.production \
            -t ai-karen-web:beta \
            src/ui_launchers/Karen-AI-Theme

      - name: Execute real production first boot
        env:
          KAREN_SMOKE_API_IMAGE: ai-karen-api:beta
        run: bash scripts/ci/production-first-boot-smoke.sh

      - name: Execute real production web boot
        shell: bash
        run: |
          set -euo pipefail
          container="ai-karen-web-first-boot-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container" \
            -p 127.0.0.1:18010:8010 \
            -e KAREN_BACKEND_URL=http://127.0.0.1:9 \
            ai-karen-web:beta >/dev/null

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18010/login >/dev/null; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != "true" ]; then
              docker logs "$container" >&2 || true
              exit 1
            fi
            sleep 1
          done

          docker logs "$container" >&2 || true
          exit 1
