name: Training Engine Proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-engine-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spacy-and-sklearn:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/*.txt
      - name: Install core and training dependencies
        run: |
          python -m pip install -r requirements/ci/runtime-contract.txt
          python -m pip install pytest pytest-asyncio scikit-learn joblib "spacy>=3.7,<4"
      - name: Compile training and evaluation modules
        run: python -m compileall -q src/ai_karen_engine/core/intelligence/ml
      - name: Prove durable jobs, real models, and registry integrity
        run: |
          pytest tests/core/intelligence/test_training_job_ledger.py tests/core/intelligence/test_training_job_worker.py -q
          pytest tests/core/intelligence/test_spacy_training_executor.py tests/core/intelligence/test_registry_spacy_predictor.py -q
          pytest tests/core/intelligence/test_registry_backed_classifier.py tests/core/intelligence/test_training_evidence_persistence.py -q
          pytest tests/unit/core/intelligence/ml/test_training.py tests/unit/core/intelligence/ml/test_evaluation.py tests/unit/core/intelligence/ml/test_promotion.py -q
