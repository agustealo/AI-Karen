name: Production Deployment Contract

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "deploy/compose/docker-compose.prod.yml"
      - ".env.production.example"
      - "src/ai_karen_engine/api_routes/monitoring/probes.py"
      - "src/ai_karen_engine/api_routes/monitoring/health.py"
      - "tests/architecture/test_production_deployment_contract.py"
      - "tests/architecture/test_docker_release_attestation.py"
      - "tests/architecture/test_docker_browser_acceptance_contract.py"
      - "scripts/ci/verify_docker_browser_host.sh"
      - ".github/workflows/karen-history-browser-acceptance.yml"
      - "src/ui_launchers/Karen-AI-Theme/e2e/fixtures/verified-search-deployment.ts"
      - "src/ui_launchers/Karen-AI-Theme/e2e/intelligent-search-replay.spec.ts"
      - "tests/architecture/test_signed_docker_release_provenance.py"
      - "tests/architecture/test_deployment_revision_acceptance.py"
      - "scripts/ci/verify_deployment_revision.py"
      - ".github/workflows/karen-consumer-image-provenance.yml"
      - "deploy/compose/docker-compose.signed-release.yml"
      - "scripts/ci/verify_docker_release.py"
      - "tests/architecture/test_operational_health_authority.py"
      - ".github/workflows/production-deployment-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "deploy/compose/docker-compose.prod.yml"
      - ".env.production.example"
      - "src/ai_karen_engine/api_routes/monitoring/probes.py"
      - "src/ai_karen_engine/api_routes/monitoring/health.py"
      - "tests/architecture/test_production_deployment_contract.py"
      - "tests/architecture/test_docker_release_attestation.py"
      - "tests/architecture/test_docker_browser_acceptance_contract.py"
      - "scripts/ci/verify_docker_browser_host.sh"
      - ".github/workflows/karen-history-browser-acceptance.yml"
      - "src/ui_launchers/Karen-AI-Theme/e2e/fixtures/verified-search-deployment.ts"
      - "src/ui_launchers/Karen-AI-Theme/e2e/intelligent-search-replay.spec.ts"
      - "tests/architecture/test_signed_docker_release_provenance.py"
      - "tests/architecture/test_deployment_revision_acceptance.py"
      - "scripts/ci/verify_deployment_revision.py"
      - ".github/workflows/karen-consumer-image-provenance.yml"
      - "deploy/compose/docker-compose.signed-release.yml"
      - "scripts/ci/verify_docker_release.py"
      - "tests/architecture/test_operational_health_authority.py"
      - ".github/workflows/production-deployment-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proof dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio

      - name: Prove production architecture contract
        env:
          PYTHONPATH: src
        run: |
          pytest tests/architecture/test_production_deployment_contract.py -q
          pytest tests/architecture/test_docker_release_attestation.py -q
          pytest tests/architecture/test_signed_docker_release_provenance.py -q
          pytest tests/architecture/test_docker_browser_acceptance_contract.py -q
          bash -n scripts/ci/verify_docker_browser_host.sh
          pytest tests/architecture/test_deployment_revision_acceptance.py -q
          pytest tests/architecture/test_operational_health_authority.py -q

      - name: Prove production compose renders
        run: |
          cp .env.production.example .env.production
          docker compose \
            --env-file .env.production \
            -f docker-compose.yml \
            -f deploy/compose/docker-compose.prod.yml \
            config >/tmp/ai-karen-production-compose.yml
          docker compose \
            --env-file .env.production \
            -f docker-compose.yml \
            -f deploy/compose/docker-compose.prod.yml \
            config --format json >/tmp/ai-karen-production-compose.json
          test -s /tmp/ai-karen-production-compose.yml
          test -s /tmp/ai-karen-production-compose.json


      - name: Prove signed images replace local builds without relaxing private ports
        shell: bash
        run: |
          set -euo pipefail
          export KAREN_SIGNED_API_IMAGE_REF="ghcr.io/test/release-api@sha256:$(printf 'a%.0s' {1..64})"
          export KAREN_SIGNED_WEB_IMAGE_REF="ghcr.io/test/release-web@sha256:$(printf 'b%.0s' {1..64})"
          docker compose \
            --env-file .env.production \
            -f docker-compose.yml \
            -f deploy/compose/docker-compose.prod.yml \
            -f deploy/compose/docker-compose.signed-release.yml \
            config --format json > /tmp/ai-karen-signed-release-compose.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          services = json.loads(
              Path("/tmp/ai-karen-signed-release-compose.json").read_text()
          )["services"]
          for service in ("api", "web"):
              entry = services[service]
              expected = os.environ[f"KAREN_SIGNED_{service.upper()}_IMAGE_REF"]
              assert entry["image"] == expected
              assert not entry.get("build"), f"{service} still permits local rebuild"
              assert entry["pull_policy"] == "always"
          assert not services["api"].get("ports")
          assert services["web"]["environment"]["KAREN_BACKEND_URL"] == "http://api:8000"
          PY

      - name: Prove development auth bypass is disabled in rendered config
        run: |
          grep -q 'AUTH_DEV_MODE: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'KARI_AUTH_BYPASS: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'AUTH_ALLOW_DEV_LOGIN: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'EXTENSION_DEV_BYPASS_ENABLED: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'KARI_DEFER_ROUTER_WIRING: "false"' /tmp/ai-karen-production-compose.yml

      - name: Prove public scheme reaches canonical web ingress
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('/tmp/ai-karen-production-compose.json').read_text())
          web = config['services']['web']
          assert web['environment']['WEB_PUBLIC_SCHEME'] == 'CHANGE_ME_HTTP_OR_HTTPS'
          PY

      - name: Prove production liveness probe is canonical
        run: grep -q 'http://localhost:8000/health/live' /tmp/ai-karen-production-compose.yml

      - name: Reject retired health authority paths
        shell: bash
        run: |
          set -euo pipefail
          retired='src/ai_karen_engine/server/health_endpoints.py'
          test ! -e server/health_endpoints.py
          refs=$(grep -R --line-number --include='*.yml' --include='*.yaml' \
            "$retired" .github/workflows || true)
          refs=$(printf '%s\n' "$refs" | grep -v -F \
            '.github/workflows/production-deployment-contract.yml:' || true)
          test -z "$refs" || { echo "$refs"; exit 1; }
