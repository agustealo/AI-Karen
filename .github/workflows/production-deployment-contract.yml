name: Production Deployment Contract

on:
  push:
    paths:
      - "docker-compose.yml"
      - "deploy/compose/docker-compose.prod.yml"
      - ".env.production.example"
      - "src/ai_karen_engine/api_routes/monitoring/probes.py"
      - "src/ai_karen_engine/api_routes/monitoring/health.py"
      - "tests/architecture/test_production_deployment_contract.py"
      - "tests/architecture/test_operational_health_authority.py"
      - ".github/workflows/production-deployment-contract.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "deploy/compose/docker-compose.prod.yml"
      - ".env.production.example"
      - "src/ai_karen_engine/api_routes/monitoring/probes.py"
      - "src/ai_karen_engine/api_routes/monitoring/health.py"
      - "tests/architecture/test_production_deployment_contract.py"
      - "tests/architecture/test_operational_health_authority.py"
      - ".github/workflows/production-deployment-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proof dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio

      - name: Prove production architecture contract
        env:
          PYTHONPATH: src
        run: |
          pytest tests/architecture/test_production_deployment_contract.py -q
          pytest tests/architecture/test_operational_health_authority.py -q

      - name: Prove request-size policy is required
        shell: bash
        run: |
          set -euo pipefail
          grep -v '^MAX_REQUEST_SIZE=' .env.production.example >/tmp/ai-karen-production-missing-request-size.env
          if env -u MAX_REQUEST_SIZE docker compose \
            --env-file /tmp/ai-karen-production-missing-request-size.env \
            -f docker-compose.yml \
            -f deploy/compose/docker-compose.prod.yml \
            config >/tmp/ai-karen-production-should-not-render.yml 2>&1; then
            echo "production compose rendered without MAX_REQUEST_SIZE" >&2
            exit 1
          fi

      - name: Prove production compose renders with request-size override
        run: |
          cp .env.production.example .env.production
          sed -i 's/^MAX_REQUEST_SIZE=.*/MAX_REQUEST_SIZE=1234567/' .env.production
          docker compose \
            --env-file .env.production \
            -f docker-compose.yml \
            -f deploy/compose/docker-compose.prod.yml \
            config >/tmp/ai-karen-production-compose.yml
          docker compose \
            --env-file .env.production \
            -f docker-compose.yml \
            -f deploy/compose/docker-compose.prod.yml \
            config --format json >/tmp/ai-karen-production-compose.json
          test -s /tmp/ai-karen-production-compose.yml
          test -s /tmp/ai-karen-production-compose.json

      - name: Prove development auth bypass is disabled in rendered config
        run: |
          grep -q 'AUTH_DEV_MODE: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'KARI_AUTH_BYPASS: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'AUTH_ALLOW_DEV_LOGIN: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'EXTENSION_DEV_BYPASS_ENABLED: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'KARI_DEFER_ROUTER_WIRING: "false"' /tmp/ai-karen-production-compose.yml

      - name: Prove deployment config reaches canonical runtime owners
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('/tmp/ai-karen-production-compose.json').read_text())
          api = config['services']['api']
          web = config['services']['web']
          assert str(api['environment']['MAX_REQUEST_SIZE']) == '1234567'
          assert web['environment']['WEB_PUBLIC_SCHEME'] == 'CHANGE_ME_HTTP_OR_HTTPS'
          PY

      - name: Prove production liveness probe is canonical
        run: grep -q 'http://localhost:8000/health/live' /tmp/ai-karen-production-compose.yml

      - name: Reject retired health authority paths
        shell: bash
        run: |
          set -euo pipefail
          retired='src/ai_karen_engine/server/health_endpoints.py'
          test ! -e server/health_endpoints.py
          refs=$(grep -R --line-number --include='*.yml' --include='*.yaml' \
            "$retired" .github/workflows || true)
          refs=$(printf '%s\n' "$refs" | grep -v -F \
            '.github/workflows/production-deployment-contract.yml:' || true)
          test -z "$refs" || { echo "$refs"; exit 1; }
