name: Classifier Burn

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heuristic-matrix:
    name: heuristic-${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - problem_solving
          - decision_making
          - creative_assistance
          - information_seeking
          - task_completion
          - social_interaction
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-asyncio numpy
      - run: pytest "tests/core/intelligence/test_intent_classifier_burn.py::test_heuristic_burn_routes_specific_intents_before_generic_request_cues[${{ matrix.case }}]" -q

  predictor-contracts:
    name: predictor-${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - noise
          - semantic
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-asyncio numpy
      - name: Noise rejection
        if: matrix.group == 'noise'
        run: pytest tests/core/intelligence/test_intent_classifier_burn.py -q -k unknown_noise
      - name: Semantic path
        if: matrix.group == 'semantic'
        run: pytest tests/core/intelligence/test_intent_classifier_burn.py -q -k "semantic_path or degraded_semantic or weak_semantic"

  runtime-contract:
    name: runtime-classify
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install \
            pytest pytest-asyncio numpy sqlalchemy asyncpg psycopg psycopg2-binary \
            PyJWT bcrypt argon2-cffi structlog cryptography PyYAML \
            pydantic pydantic-settings python-dotenv prometheus_client \
            fastapi httpx requests tenacity redis fakeredis
      - run: pytest tests/core/intelligence/test_intelligence_runtime_classify_burn.py -q
