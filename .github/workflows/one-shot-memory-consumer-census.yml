name: One-shot Memory Consumer Census

on:
  push:
    branches:
      - memory/migrate-remaining-consumers

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact memory consumer census
        shell: bash
        run: |
          set -euo pipefail
          echo '=== WebUIMemoryService references ==='
          grep -R --line-number --include='*.py' 'WebUIMemoryService' src tests || true
          echo '=== training learner factory call sites ==='
          grep -R --line-number --include='*.py' '_create_autonomous_learner' src tests || true
          echo '=== scheduler manager dependency call sites ==='
          grep -R --line-number --include='*.py' 'get_scheduler_manager' src tests || true
          echo '=== UnifiedMemoryService constructions ==='
          grep -R --line-number --include='*.py' 'UnifiedMemoryService(' src tests || true
