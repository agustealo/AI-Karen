name: Main Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classifier-burn:
    name: classifier-burn
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/*.txt

      - name: Install classifier proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci/runtime-contract.txt

      - name: Compile classifier surfaces
        run: |
          python -m compileall -q \
            src/ai_karen_engine/core/intelligence \
            src/ai_karen_engine/core/cortex

      - name: Run classifier architecture contract
        run: pytest tests/architecture/test_classifier_authority_contract.py -q

      - name: Run adversarial predictor burn
        run: pytest tests/core/intelligence/test_intent_classifier_burn.py -q

      - name: Run public runtime classify burn
        run: pytest tests/core/intelligence/test_intelligence_runtime_classify_burn.py -q

  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require canonical CopilotKit convergence ledger update
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(mktemp)"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$changed_files"
          ledger="docs/capabilities/copilotkit-execution-plan.md"
          # Enforce documentation on edits to this initiative's execution owners.
          # Do not require unrelated feature PRs to edit the Karen ledger.
          affected='^(src/ui_launchers/Karen-AI-Theme/src/components/chat/copilotkit/|src/ui_launchers/Karen-AI-Theme/src/app/api/copilotkit/|src/ui_launchers/Karen-AI-Theme/src/components/chat/(KarenPresentationRegistry|KarenPersonaSelector|SessionProvider|KarenComposerRuntimeCatalog)\.tsx$|src/ai_karen_engine/core/runtime/(chat_runtime|decision_pipeline|workflow_runtime|owned_history_projection|presentation_contract|ag_ui_event_projection|chat_run_lifecycle)\.py$|src/ai_karen_engine/core/runtime/prompt/|src/ai_karen_engine/agent_medusa/|src/ai_karen_engine/services/persona/|src/ai_karen_engine/core/persona/|src/ai_karen_engine/api_routes/users/persona\.py$)'
          if grep -Eq "$affected" "$changed_files"; then
            if ! grep -Fxq "$ledger" "$changed_files"; then
              echo "::error::CopilotKit/Persona/Agent changes must update $ledger with KCON task IDs, status, and proof. Do not add a parallel plan."
              exit 1
            fi
            if ! git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" -- "$ledger" |
                 awk '/^\+[^+]/ && /KCON-[0-9][0-9][0-9]/ {found=1} END {exit !found}'; then
              echo "::error::$ledger must update at least one affected KCON task or its progress evidence."
              exit 1
            fi
          fi
          python - <<'PY'
          import re
          from pathlib import Path

          ledger = Path("docs/capabilities/copilotkit-execution-plan.md").read_text()
          tasks = re.findall(r"^- \[[ x]\] \*\*(KCON-\d{3})\*\*", ledger, re.MULTILINE)
          if len(tasks) < 80 or len(tasks) != len(set(tasks)):
              raise SystemExit("Living convergence ledger has missing/duplicate task IDs")
          referenced = set(re.findall(r"\bKCON-\d{3}\b", ledger))
          unknown = sorted(referenced - set(tasks))
          if unknown:
              raise SystemExit(f"Living convergence ledger references undefined tasks: {unknown}")
          headers = [line for line in ledger.splitlines() if line.startswith("## ")]
          required = ("## 2. Feature-by-feature adoption, preservation and truth matrix",
                      "## 4. Dependency-ordered execution checklist",
                      "## 8. Progress change log")
          if not all(any(header.startswith(prefix) for header in headers) for prefix in required):
              raise SystemExit("Living convergence ledger is missing canonical sections")
          print(f"Validated {len(tasks)} stable convergence task IDs.")
          PY
          echo "Living convergence ledger contract satisfied."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/*.txt

      - name: Verify presentation activation contract
        run: python scripts/ci/verify_presentation_assets.py --require-assets

      - name: Install quality and runtime contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci/quality.txt

      - name: Compile Python sources
        run: python -m compileall -q src server scripts

      - name: Verify authentication and training route imports
        run: |
          python -m py_compile src/ai_karen_engine/auth/models.py src/ai_karen_engine/auth/rbac_middleware.py src/ai_karen_engine/auth/session.py src/ai_karen_engine/api_routes/admin/training.py
          python -c 'from ai_karen_engine.auth.rbac_middleware import RBACManager, Permission; from ai_karen_engine.api_routes.admin.training import router; assert any(route.path == "/admin/training/control-plane" for route in router.routes)'

      - name: Prove admin user route imports and canonical authorization enums
        run: pytest tests/unit/api_routes/test_admin_user_route_imports.py -q

      - name: Ruff correctness baseline
        run: |
          # Historical formatting/style debt is retired in contained slices.
          # Keep this gate fail-closed on syntax/control-flow correctness instead
          # of making Main Quality permanently red for unrelated legacy style.
          ruff check --select E9,F63,F7 src tests

      - name: Mypy canonical authority contracts
        run: |
          # Type-check the canonical contracts/decision boundary without pulling
          # the entire legacy runtime estate and optional ML/GPU dependencies
          # into a permanently-red gate.
          mypy --follow-imports=skip --ignore-missing-imports \
            src/ai_karen_engine/core/runtime/contracts.py \
            src/ai_karen_engine/core/runtime/chat_runtime_contract.py \
            src/ai_karen_engine/core/runtime/execution_decision.py \
            src/ai_karen_engine/core/runtime/decision_pipeline.py \
            src/ai_karen_engine/core/cortex/contracts.py \
            src/ai_karen_engine/core/model_runtime/provider_contracts.py \
            src/ai_karen_engine/core/model_runtime/inference_target.py \
            src/ai_karen_engine/core/model_runtime/runtime_contracts.py \
            src/ai_karen_engine/core/memory/contracts.py

      - name: Architecture authority contracts
        run: |
          pytest tests/architecture/test_ci_dependency_authority.py -q
          pytest tests/architecture/test_main_quality_presentation_contract.py -q
          pytest tests/architecture/test_core_ai_machine_isolation.py -q
          pytest tests/architecture/test_provider_chat_authority.py -q
          pytest tests/architecture/test_cortex_intelligence_authority.py -q
          pytest tests/architecture/test_classifier_authority_contract.py -q
          pytest tests/architecture/test_context_authority_convergence.py -q
          pytest tests/architecture/test_memory_consumer_domain_migration.py -q
          pytest tests/architecture/test_memory_stm_boundaries.py -q
          pytest tests/architecture/test_memory_formation_authority.py -q
          pytest tests/architecture/test_semantic_memory_formation_authority.py -q
          pytest tests/architecture/test_memory_temporal_evolution.py -q
          pytest tests/architecture/test_memory_temporal_graph_persistence.py -q
          pytest tests/architecture/test_memory_temporal_graph_projection.py -q
          pytest tests/architecture/test_beta_conversation_reload_contract.py -q
          pytest tests/architecture/test_authenticated_tenant_context_contract.py -q
          pytest tests/architecture/test_chat_transport_authority_closure.py -q
          python scripts/architecture/verify_capability_baseline.py
          pytest tests/architecture/test_capability_baseline_contract.py -q
          python scripts/architecture/audit_copilotkit_wiring.py
          pytest tests/architecture/test_copilotkit_migration_wiring.py -q
          pytest tests/architecture/test_browser_acceptance_dispatch_security.py -q
          pytest tests/architecture/test_deployment_revision_acceptance.py -q
          # Existing Render beta API is reconciled without provisioning or
          # implicit deployment; keep this exact owner and its secret-free
          # environment preflight in the required release architecture gate.
          pytest tests/architecture/test_render_beta_service_reconcile.py -q
          pytest tests/architecture/test_render_beta_environment_preflight.py -q
          # Read-only migration inspection must fail closed on unknown/duplicate history.
          pytest tests/services/database/test_migration_validator.py -q
          pytest tests/architecture/test_render_beta_blueprint_contract.py -q
          # Local startup must not inject credentials, tear down services,
          # or report readiness without canonical first-run ingress.
          pytest tests/architecture/test_local_compose_launcher.py -q
          pytest tests/architecture/test_local_supabase_config.py -q
          # Legacy platform keys remain usable while operators migrate their .env.
          pytest tests/integrations/test_supabase_current_environment.py -q
          # Startup must accurately report packaged spaCy recovery vs fallback.
          # These tests mock the optional spaCy dependency but exercise real
          # PEP 440 version constraints and the canonical analyzer itself.
          pytest tests/core/intelligence/test_spacy_model_load_fail_closed.py -q
          pytest tests/architecture/test_local_runtime_status.py -q
          pytest tests/architecture/test_local_chat_acceptance_contract.py -q
          # KCON-772 only accepts verified, non-duplicate real browser timing artifacts.
          pytest tests/architecture/test_kcon772_latency_evidence.py -q
          pytest tests/architecture/test_local_approved_login_contract.py -q
          # Production /ready must actively check canonical Redis connectivity,
          # accept only secured targets, and match the frontend health contract.
          pytest tests/architecture/test_operational_health_authority.py -q
          # Canonical ASGI lifespan owns Redis start/stop and must not claim
          # a healthy memory backend before connecting or after failed startup.
          pytest tests/architecture/test_application_redis_lifecycle.py -q
          # Full-runtime probe: uninitialized/stale Redis must not pass /ready.
          pytest tests/platform/memory/test_redis_connection_health.py -q
          pytest tests/architecture/test_vercel_deployment_attestation.py -q
          pytest tests/architecture/test_http_transport_authority.py -q
          pytest tests/architecture/test_rate_limit_identity_authority.py -q
          pytest tests/architecture/test_public_scheme_authority.py -q
          pytest tests/architecture/test_reward_progress_authority.py -q

      - name: Model orchestration and LLM ingress authority contracts
        run: |
          python -m compileall -q src/ai_karen_engine/api_routes/models src/ai_karen_engine/core/model_runtime/management/model_orchestrator_service.py src/ai_karen_engine/server/routers.py
          pytest tests/architecture/test_model_flow_route_authority.py -q
          pytest tests/architecture/test_model_orchestrator_route_authority.py -q
          pytest tests/core/model_runtime/test_model_orchestrator_remote_listing.py -q
          pytest tests/architecture/test_llm_control_plane_authority.py -q

      - name: Reject retired memory consumer implementations
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/ai_karen_engine/core/memory/memory_service.py
          refs=$(grep -R --line-number --include='*.py' 'WebUIMemoryService\|MemoryContextBuilder\|store_web_ui_memory' src/ai_karen_engine || true)
          test -z "$refs" || { echo "$refs"; exit 1; }
          ! grep -R --line-number --include='*.py' 'UnifiedMemoryService(' src/ai_karen_engine/agents

      - name: Runtime evidence authority proofs
        run: |
          pytest tests/core/runtime/test_context_evidence_contracts.py -q
          pytest tests/core/runtime/test_runtime_evidence_resolution.py -q
          pytest tests/core/runtime/test_persona_execution_snapshot.py -q
          pytest tests/core/runtime/test_conversation_runtime_gateway.py -q
          pytest src/ai_karen_engine/api_routes/chat/tests/test_execution_identity_principal.py -q
          pytest tests/core/runtime/test_authorized_semantic_context_handoff.py -q
          pytest tests/core/runtime/test_direct_live_capabilities.py -q
          # Source observations need an attested surface but must not invent
          # an LLM receipt. This invariant is part of release quality.
          pytest tests/core/runtime/test_direct_capability_provenance.py -q
          pytest tests/core/runtime/test_direct_stream_grounded_search_parity.py -q
          pytest tests/core/runtime/test_verified_search_presentation.py -q
          pytest tests/core/runtime/test_search_results_capability_routing.py -q
          pytest tests/core/runtime/test_verified_weather_presentation.py -q
          pytest tests/core/runtime/test_ag_ui_event_projection.py -q
          # KCON-770: execute existing fault matrix owners, not documentation alone.
          pytest tests/core/runtime/test_chat_runtime_stream_contract.py -k "test_empty_model_output_is_not_success or test_partial_content_then_error_never_persists_failed_assistant_turn or test_execute_stream_transcript_failure_is_separate_from_memory_truth" -q
          pytest tests/core/runtime/test_chat_sse_error_contract.py -q
          # Durable lease finality must reject malformed transcript receipts
          # without raising TypeError or fabricating RUN_FINISHED.
          pytest tests/api_routes/test_chat_run_lifecycle.py -q
          # Replayed observations must never claim a terminal without a
          # committed run marker; include the canonical scoped SQL owner.
          pytest tests/api_routes/test_chat_run_event_journal.py -q
          pytest tests/api_routes/test_chat_run_repository.py -q
          pytest tests/core/runtime/test_presentation_contract.py -q
          pytest tests/core/runtime/test_authorized_time_tool_fallback.py -q
          pytest tests/core/runtime/test_outcome_store_contract.py -q
          pytest tests/core/intelligence/test_reward_progress.py -q
          pytest tests/services/test_reward_progress.py -q

      - name: Governed history and explicit continuation proofs
        run: |
          pytest tests/api_routes/test_ag_ui_governed_history.py tests/api_routes/test_owned_history_projection.py tests/core/runtime/test_owned_history_duplicate_identity.py -q

      - name: Classifier burn contracts
        run: |
          pytest tests/core/intelligence/test_intent_classifier_burn.py -q
          pytest tests/core/intelligence/test_intelligence_runtime_classify_burn.py -q
          pytest tests/core/intelligence/test_intelligence_runtime.py -q
          pytest tests/core/intelligence/test_intelligence_runtime_linguistic_contract.py -q
          pytest tests/unit/core/intelligence/test_predictors.py -q

      - name: Chat runtime burn contracts
        run: |
          pytest src/ai_karen_engine/api_routes/chat/tests/test_chat_runtime_contract.py -q
          pytest src/ai_karen_engine/api_routes/chat/tests/test_chat_runtime_burn_contract.py -q
          pytest src/ai_karen_engine/api_routes/chat/tests/test_chat_runtime_concurrency_burn.py -q

      - name: Ollama live inventory and provider settings contracts
        run: |
          pytest tests/core/model_runtime/test_provider_registry_endpoints.py -q
          pytest tests/core/expression/test_gateway_selected_provider_precedence.py -q
          pytest tests/core/model_runtime/test_ollama_native_inventory.py -q
          pytest tests/core/model_runtime/test_ollama_inference_endpoint.py -q
          pytest tests/core/model_runtime/test_ollama_execution_mapping.py -q
          pytest tests/api_routes/test_model_settings_ollama_discovery.py -q
          pytest tests/api_routes/test_ollama_settings_live_proof.py -q
          pytest tests/api_routes/test_runtime_provider_catalog_ollama.py -q
          pytest tests/core/model_runtime/test_ollama_model_inventory_contract.py -q
          pytest tests/core/runtime/test_chat_runtime_settings_selection.py -q
          pytest tests/core/runtime/test_chat_runtime_graph_provenance.py -q
          pytest tests/core/reasoning/test_chat_runtime_reasoning_activation.py -q
          pytest tests/core/runtime/test_reasoning_model_attribution_truth.py -q

      - name: Personalization authority proofs
        run: |
          pytest tests/core/personalization/test_personalization.py -q
          pytest tests/unit/core/personalization/test_preference_resolution_scope_contract.py -q
          pytest tests/services/test_persona_style_analysis_contract.py -q
          pytest tests/services/test_persona_save_fail_closed.py -q

      - name: Memory recall, STM closure, and tenant security proofs
        run: |
          pytest tests/core/memory/test_neuro_recall_scope.py -q
          pytest tests/core/memory/test_general_user_fact_classifier.py -q
          pytest tests/core/memory/test_memory_formation_service.py -q
          pytest tests/platform/memory/test_semantic_user_state_projection.py -q
          pytest tests/memory/test_stm_closure_1b.py -q
          pytest tests/auth/test_tenant_scope_fail_closed.py -q

      - name: Reject retired provider authorities
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/ai_karen_engine/core/expression/engines/builtin_provider_engine.py
          test ! -e src/ai_karen_engine/core/model_runtime/providers/vllm_runtime.py
          refs=$(grep -R --line-number --include='*.py' \
            -E "preferred_provider=['\"]builtin_vllm['\"]|provider_id=['\"]builtin_vllm['\"]|from .*vllm_runtime import VLLMRuntime|import .*vllm_runtime" \
            tests src/ai_karen_engine/core/expression || true)
          test -z "$refs" || { echo "$refs"; exit 1; }

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install frontend dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Reject production mocks
        run: npm run ci:forbid-mocks

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Validate production web ingress
        run: node --check server.mjs

      - name: Run frontend unit tests
        run: npx vitest run --passWithNoTests

      - name: Prove local latency suite selects exactly sixty headless first-prompt cases
        shell: bash
        env:
          KAREN_LOCAL_LATENCY_BENCHMARK: "1"
          KAREN_LOCAL_CHAT_ACCEPTANCE: "1"
          KAREN_CHAT_BOOT_ACCEPTANCE: "0"
          KAREN_BASE_URL: http://127.0.0.1:8010
          # Listing collects zero browser or model responses; never use real
          # operator credentials or produce authenticated artifacts in CI.
          KAREN_UX_EMAIL: kcon776-list@example.invalid
          KAREN_UX_PASSWORD: not-a-real-credential
        run: |
          set -euo pipefail
          list_file="$(mktemp)"
          trap 'rm -f "$list_file"' EXIT
          npx playwright test e2e/copilotkit-consumer-boot.spec.ts \
            --config=e2e/playwright.config.ts --project=chromium \
            --grep="one first" --repeat-each=10 --workers=1 --list >"$list_file"
          node - "$list_file" <<'NODE'
          const fs = require("node:fs");
          const output = fs.readFileSync(process.argv[2], "utf8");
          const scenarios = [
            "time", "weather", "search", "news",
            "current movies", "current movie source table",
          ];
          const total = output.match(/Total:\s*(\d+)\s+tests?\s+in\s+(\d+)\s+files?/);
          if (!total || Number(total[1]) !== 60 || Number(total[2]) !== 1) {
            throw new Error("KCON-776 must select 60 first-prompt cases from one canonical spec");
          }
          for (const scenario of scenarios) {
            const title = `one first ${scenario} prompt renders backend-attested UI immediately and after reload`;
            const count = output.split(title).length - 1;
            if (count !== 10) {
              throw new Error(`KCON-776 ${scenario}: expected ten independent repeat-each cases, got ${count}`);
            }
          }
          NODE

      - name: Build production frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          KAREN_BACKEND_URL: http://127.0.0.1:8000
        run: npm run build

  deployment-contract:
    name: deployment-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose contract
        env:
          KARI_CORS_ORIGINS: https://consumer-ci.example.invalid
        shell: bash
        run: |
          set -euo pipefail
          cp .env.production.example .env.production
          docker compose \
            --env-file .env.production \
            -f docker-compose.yml \
            -f deploy/compose/docker-compose.prod.yml \
            config > /tmp/ai-karen-production-compose.yml
          docker compose \
            --env-file .env.production \
            -f docker-compose.yml \
            -f deploy/compose/docker-compose.prod.yml \
            config --format json > /tmp/ai-karen-production-compose.json
          test -s /tmp/ai-karen-production-compose.yml
          test -s /tmp/ai-karen-production-compose.json
          grep -q 'AUTH_DEV_MODE: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'KARI_AUTH_BYPASS: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'AUTH_ALLOW_DEV_LOGIN: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'AUTH_ENABLE_SESSION_VALIDATION: "true"' /tmp/ai-karen-production-compose.yml
          grep -q 'KAREN_BUILTIN_VLLM_ENABLED: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'NODE_ENV: production' /tmp/ai-karen-production-compose.yml
          ! grep -q 'npm run dev' /tmp/ai-karen-production-compose.yml
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('/tmp/ai-karen-production-compose.json').read_text())
          api = config['services']['api']
          web = config['services']['web']
          assert api.get('ports', []) == [], api.get('ports')
          assert api['environment']['HTTP_TRUSTED_PROXY_HOSTS'] == 'web'
          assert 'RATE_LIMIT_TRUSTED_PROXY_HOSTS' not in api['environment']
          assert web['environment']['WEB_PUBLIC_SCHEME'] == 'CHANGE_ME_HTTP_OR_HTTPS'
          assert web.get('ports'), 'production web ingress must remain published'
          PY

      - name: Verify development web Compose bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          # Compose's development web uses the root .env and the local
          # environment file; provide disposable CI copies, never secrets.
          cp .env.production.example .env
          touch .env.local
          docker compose --env-file .env.production \
            -f docker-compose.yml config --format json \
            > /tmp/ai-karen-development-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('/tmp/ai-karen-development-compose.json').read_text())
          web = config['services']['web']
          command = web['command']
          assert isinstance(command, list) or isinstance(command, str)
          script = ' '.join(command) if isinstance(command, list) else command
          assert 'sha256sum /app/package-lock.json' in script
          assert '/app/node_modules/.install_dependency_fingerprint' in script
          assert 'process.versions.node.split(/[.]/)[0]' in script
          assert 'process.versions.modules' in script
          assert 'install_fingerprint=' in script
          assert '.install_lock_sha256' not in script
          assert "require('@copilotkit/react-core/package.json')" in script
          assert 'npm ci --cache /root/.npm --prefer-offline --no-audit' in script
          assert "npm run dev -- --hostname 0.0.0.0 --port 8010" in script
          assert '.install_complete' not in script
          assert script.index('npm ci --cache') < script.index('npm run dev')
          assert web['working_dir'] == '/app'
          assert any(
              volume.get('target') == '/app/node_modules'
              for volume in web.get('volumes', [])
          )
          PY

  main-quality-gate:
    name: main-quality-gate
    runs-on: ubuntu-latest
    needs:
      - classifier-burn
      - backend-quality
      - frontend-quality
      - deployment-contract
    steps:
      - name: Publish merge decision
        run: |
          echo "MAIN QUALITY GATE PASSED"
          echo "sha=$GITHUB_SHA"
