name: One-time prune two branches already fully contained in main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-prune-ancestor-branch-refs.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reverify ancestry and safely remove redundant refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner=context.repo.owner,repo=context.repo.repo;
            const planned=[
              { name:'feat/koc05-governed-retirement-hold-20261114',sha:'8c60158688011398d5641113b4b33591e08f4fca' },
              { name:'test/kcon770-latency-evidence-analysis-20261107',sha:'49e2d26a195dada07418b20f9575680ada6aebe9' }
            ];
            const defaultName=(await github.rest.repos.get({owner,repo})).data.default_branch;
            const deleted=[],withheld=[],failed=[];
            for(const t of planned){
              try {
                if(t.name===defaultName||t.name.startsWith('release/')){withheld.push({name:t.name,reason:'reserved'});continue;}
                const [branch,comparison,pr]=await Promise.all([
                  github.rest.repos.getBranch({owner,repo,branch:t.name}),
                  github.rest.repos.compareCommits({owner,repo,base:defaultName,head:t.sha,per_page:1}),
                  github.rest.pulls.list({owner,repo,state:'open',head:owner+':'+t.name,per_page:100})
                ]);
                if(branch.data.protected||branch.data.commit.sha!==t.sha||pr.data.length){
                  withheld.push({name:t.name,reason:'protected_changed_or_open_pr'});continue;
                }
                if(comparison.data.ahead_by!==0 || comparison.data.status==='diverged'){
                  withheld.push({name:t.name,reason:'not_fully_contained_in_main'});continue;
                }
                const bases=await github.rest.pulls.list({owner,repo,state:'open',per_page:100});
                if(bases.data.some(x=>x.base?.ref===t.name)){
                  withheld.push({name:t.name,reason:'open_pr_uses_as_base'});continue;
                }
                await github.rest.git.deleteRef({owner,repo,ref:'heads/'+t.name});
                deleted.push({name:t.name,sha:t.sha,reason:'exact_head_is_ancestor_of_main',ahead_by:comparison.data.ahead_by});
              }catch(e){failed.push({name:t.name,status:e.status??null,message:e.message});}
            }
            const report={repo:owner+'/'+repo,deleted_count:deleted.length,
              withheld_count:withheld.length,failed_count:failed.length,deleted,withheld,failed};
            fs.writeFileSync('ancestor-ref-prune.json',JSON.stringify(report,null,2));
            core.info(JSON.stringify({deleted:deleted.length,withheld:withheld.length,failed:failed.length}));
            if(failed.length)core.setFailed('Some deletions failed');
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ancestor-ref-prune-evidence
          path: ancestor-ref-prune.json
          if-no-files-found: warn
          retention-days: 30
