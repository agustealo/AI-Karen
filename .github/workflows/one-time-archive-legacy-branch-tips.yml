name: One-time archive legacy branch tips

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-archive-legacy-branch-tips.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-archive-legacy-branch-tips
  cancel-in-progress: false

jobs:
  archive-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Fetch all live branch refs
        run: git -c protocol.version=2 fetch --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Archive and prune old unowned and moved-tip branches
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fullName = owner + '/' + repo;
            const oldDays = 21;
            const cutoff = Date.now() - oldDays * 24 * 60 * 60 * 1000;
            const tag = 'branch-archive/2026-11-14-legacy-no-pr-tip-moved';
            const manifestPath = '.branch-archives/2026-11-14-legacy-no-pr-tip-moved.json';
            const reserved = new Set(['main','master','develop','development','staging','production']);
            const reservePrefixes = ['release/','hotfix/','staging/','production/','archive/','branch-archive/'];
            const git = (args,extra={}) => execFileSync('git', args, {
              encoding:'utf8', maxBuffer: 16*1024*1024,
              stdio:['ignore','pipe','pipe'], ...extra
            }).trim();
            const [repoInfo, branches, prs] = await Promise.all([
              github.rest.repos.get({owner,repo}),
              github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100}),
              github.paginate(github.rest.pulls.list,{owner,repo,state:'all',per_page:100})
            ]);
            const main = repoInfo.data.default_branch;
            reserved.add(main);
            const mainSha = git(['rev-parse','refs/remotes/origin/'+main]);
            const byBranch = new Map();
            for (const p of prs) {
              if (p.head?.repo?.full_name !== fullName || !p.head?.ref) continue;
              const list = byBranch.get(p.head.ref) || [];
              list.push(p);
              byBranch.set(p.head.ref,list);
            }
            const activePrBases = new Set(prs
              .filter(p=>p.state==='open' && p.base?.repo?.full_name===fullName)
              .map(p=>p.base.ref));
            const eligible=[],withheld=[],failed=[],deleted=[];
            const hold=(name,reason,extra={})=>withheld.push({name,reason,...extra});
            for (const b of branches) {
              const name=b.name, sha=b.commit.sha, linked=byBranch.get(name)||[];
              if (b.protected || reserved.has(name) || reservePrefixes.some(p=>name.startsWith(p))) {
                hold(name,'protected_or_reserved');continue;
              }
              if (activePrBases.has(name) || linked.some(p=>p.state==='open')) {
                hold(name,'active_pr');continue;
              }
              let classification='no_pr_record';
              if (linked.length) {
                if (linked.some(p=>p.state!=='closed')) {
                  hold(name,'not_all_prs_closed');continue;
                }
                if (linked.some(p=>!p.merged_at)) {
                  hold(name,'closed_unmerged_pr_preserved');continue;
                }
                if (linked.some(p=>!p.updated_at || new Date(p.updated_at).getTime()>cutoff)) {
                  hold(name,'recent_historical_pr_activity');continue;
                }
                if (linked.some(p=>(p.labels||[]).some(l=>/^(keep|hold|do-not-delete|wip|in-progress)$/i.test(l.name)))) {
                  hold(name,'explicit_preservation_label');continue;
                }
                classification='merged_pr_tip_moved';
              }
              try {
                const when=git(['show','-s','--format=%cI',sha]);
                if (!when || new Date(when).getTime()>cutoff) {
                  hold(name,'recent_or_unknown_tip',{committed_at:when||null});continue;
                }
                let referenced=false;
                try {
                  referenced=Boolean(git(['grep','-F','-l','-e',name,'--','.github']));
                } catch(e) {
                  if (e.status!==1) {
                    hold(name,'reference_audit_unavailable',{exit_code:e.status||null});continue;
                  }
                }
                if(referenced){hold(name,'referenced_in_active_github_config');continue;}
                git(['cat-file','-e',sha+'^{commit}']);
                const mergeBase=git(['merge-base',mainSha,sha]);
                const uniqueCommits=Number(git(['rev-list','--count',mainSha+'..'+sha]));
                eligible.push({
                  name,sha,classification,committed_at:when,
                  unique_commits_vs_main:uniqueCommits,merge_base:mergeBase,
                  previous_prs:linked.map(p=>({number:p.number,merged_at:p.merged_at,pr_head_sha:p.head.sha}))
                });
              } catch(e) {
                hold(name,'unverifiable_git_history',{message:e.message});
              }
            }
            let archiveSha=null;
            if(eligible.length){
              try{
                try {
                  const previous=await github.rest.git.getRef({owner,repo,ref:'tags/'+tag});
                  throw new Error('Tag already exists: '+previous.data.object.sha);
                } catch(e){if(e.status!==404)throw e;}
                const manifest={
                  repository:fullName,
                  main_at_audit:mainSha,
                  archive_tag:tag,
                  created_at:new Date().toISOString(),
                  minimum_age_days:oldDays,
                  recovery_commands:{
                    fetch:'git fetch origin tag '+tag,
                    inspect:'git show '+tag+':'+manifestPath,
                    recover:'git branch RECOVERED_NAME COMMIT_SHA'
                  },
                  branches:eligible
                };
                fs.mkdirSync(path.dirname(manifestPath),{recursive:true});
                fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
                git(['add','--',manifestPath]);
                const tree=git(['write-tree']);
                let head=mainSha;
                const env={
                  ...process.env,
                  GIT_AUTHOR_NAME:'AI-Karen Branch Archive',
                  GIT_AUTHOR_EMAIL:'actions@users.noreply.github.com',
                  GIT_COMMITTER_NAME:'AI-Karen Branch Archive',
                  GIT_COMMITTER_EMAIL:'actions@users.noreply.github.com'
                };
                for(let i=0;i<eligible.length;i+=8){
                  const subset=eligible.slice(i,i+8);
                  head=git(['commit-tree',tree,'-p',head,
                    ...subset.flatMap(b=>['-p',b.sha]),
                    '-m','Archive legacy refs group '+(Math.floor(i/8)+1)],{env});
                }
                for(const b of eligible){
                  git(['merge-base','--is-ancestor',b.sha,head]);
                }
                git(['push','origin',head+':refs/tags/'+tag]);
                const ref=(await github.rest.git.getRef({owner,repo,ref:'tags/'+tag})).data;
                if(ref.object.sha!==head)throw new Error('Archive tag SHA mismatch');
                const remoteManifest=await github.rest.repos.getContent({owner,repo,path:manifestPath,ref:tag});
                if(Array.isArray(remoteManifest.data) || remoteManifest.data.type!=='file') {
                  throw new Error('Archive manifest missing remotely');
                }
                const remote=JSON.parse(Buffer.from(remoteManifest.data.content,'base64').toString('utf8'));
                if(remote.branches.length!==eligible.length ||
                   remote.branches.some((b,i)=>b.name!==eligible[i].name||b.sha!==eligible[i].sha)) {
                  throw new Error('Archive manifest differs from candidate branch tips');
                }
                archiveSha=head;
                core.info('Verified archival tag '+tag+' at '+head+' with '+eligible.length+' preserved tips');
              }catch(e){failed.push({stage:'archive',error:e.message});}
            }
            if(archiveSha && !failed.length) {
              for(const b of eligible){
                try {
                  const fresh=(await github.rest.repos.getBranch({owner,repo,branch:b.name})).data;
                  if(fresh.protected||fresh.commit.sha!==b.sha) {
                    hold(b.name,'head_changed_or_newly_protected');continue;
                  }
                  const active=await github.rest.pulls.list({
                    owner,repo,state:'open',head:owner+':'+b.name,per_page:100
                  });
                  if(active.data.length){hold(b.name,'new_open_pr');continue;}
                  git(['merge-base','--is-ancestor',b.sha,archiveSha]);
                  await github.rest.git.deleteRef({owner,repo,ref:'heads/'+b.name});
                  deleted.push(b);
                }catch(e){failed.push({stage:'delete',name:b.name,status:e.status||null,error:e.message});}
              }
            }
            const report={
              repository:fullName,main_at_audit:mainSha,archive_tag:archiveSha?tag:null,
              archive_commit:archiveSha,examined:branches.length,
              eligible_count:eligible.length,deleted_count:deleted.length,
              withheld_count:withheld.length,failed_count:failed.length,
              deleted,withheld,failed
            };
            fs.writeFileSync('legacy-branch-archive-audit.json',JSON.stringify(report,null,2));
            core.info(JSON.stringify({
              examined:report.examined,eligible:report.eligible_count,
              deleted:report.deleted_count,withheld:report.withheld_count,
              failed:report.failed_count,archive_tag:report.archive_tag
            }));
            await core.summary.addHeading('Legacy branch cleanup with archived histories')
              .addTable([
                [{data:'Metric',header:true},{data:'Count',header:true}],
                ['Branches inspected',String(report.examined)],
                ['Archived then deleted',String(report.deleted_count)],
                ['Preserved',String(report.withheld_count)],
                ['Failures',String(report.failed_count)]
              ]).write();
            if(failed.length)core.setFailed('Archive/delete failed; no unverified history deliberately removed.');

      - name: Upload archival evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-branch-archive-audit
          path: legacy-branch-archive-audit.json
          if-no-files-found: warn
          retention-days: 60
