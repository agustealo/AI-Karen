name: One-shot Auth Session Validation Patch

on:
  push:
    branches:
      - prod/auth-session-validation-closure
    paths:
      - .github/workflows/one-shot-auth-session-validation-patch.yml

permissions:
  contents: write

jobs:
  patch-auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/auth-session-validation-closure
          fetch-depth: 0

      - name: Apply exact source transformation
        run: python scripts/dev/apply_auth_session_validation_closure.py

      - name: Prove transformed files compile
        run: |
          python -m compileall -q \
            src/ai_karen_engine/services/auth/auth_service.py \
            src/ai_karen_engine/api_routes/auth/auth.py

      - name: Commit transformed source and remove patch scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-auth-session-validation-patch.yml
          git rm scripts/dev/apply_auth_session_validation_closure.py
          git add src/ai_karen_engine/services/auth/auth_service.py src/ai_karen_engine/api_routes/auth/auth.py
          git commit -m "fix(auth): close password and session validation authority"
          git push origin HEAD:prod/auth-session-validation-closure
