name: Live PostgreSQL Profile Memory Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/ai_karen_engine/core/memory/**"
      - "src/ai_karen_engine/platform/memory/**"
      - "src/ai_karen_engine/persistence/**"
      - "src/ai_karen_engine/core/runtime/**"
      - "src/ai_karen_engine/core/cortex/**"
      - "src/ai_karen_engine/api_routes/chat/**"
      - "src/ai_karen_engine/services/memory/**"
      - "supabase/migrations/**"
      - "scripts/ci/start-postgres-container.sh"
      - "tests/core/memory/**"
      - "tests/platform/memory/**"
      - "tests/memory/**"
      - "tests/architecture/test_*memory*.py"
      - "tests/integration/test_*memory*.py"
      - "tests/integration/test_live_profile_*.py"
      - "tests/integration/test_live_name_formation_path.py"
      - "tests/integration/test_live_automation_task_claims.py"
      - "tests/integration/test_persona_activation_postgres.py"
      - "src/ai_karen_engine/services/persona/**"
      - "src/ai_karen_engine/core/persona/**"
      - "src/ai_karen_engine/services/automation/**"
      - "tests/services/automation/**"
      - "requirements/ci/chat.txt"
      - ".github/workflows/live-postgres-memory-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-postgres-memory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-memory-postgres:
    name: profile-memory-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_karen
      KAREN_TEST_POSTGRES_MEMORY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Start authenticated canonical PostgreSQL service
        env:
          KAREN_CI_DOCKERHUB_USERNAME: ${{ secrets.KAREN_CI_DOCKERHUB_USERNAME }}
          KAREN_CI_DOCKERHUB_TOKEN: ${{ secrets.KAREN_CI_DOCKERHUB_TOKEN }}
          KAREN_CI_POSTGRES_IMAGE: ${{ vars.KAREN_CI_POSTGRES_IMAGE || 'pgvector/pgvector:pg16' }}
        run: bash scripts/ci/start-postgres-container.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/*.txt
      - name: Install canonical memory runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci/chat.txt
      - name: Initialize isolated memory ledger tables
        run: |
          python - <<'PY'
          import asyncio
          from ai_karen_engine.persistence.postgres import get_postgres_engine
          from ai_karen_engine.platform.memory.postgres.ledger_models import Base, MemoryEvent, MemoryAssertion, MemoryEpisode, ProfileFact, ProjectionStatus, ConsentScope, RetentionPolicy

          async def prepare():
              engine = get_postgres_engine().async_engine
              async with engine.begin() as conn:
                  await conn.run_sync(
                      Base.metadata.create_all,
                      tables=[model.__table__ for model in (MemoryEvent, MemoryAssertion, MemoryEpisode, ProfileFact, ProjectionStatus, ConsentScope, RetentionPolicy)],
                  )
          asyncio.run(prepare())
          PY
      - name: Apply and verify profile fact tenant RLS on isolated database
        run: |
          python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          import asyncpg

          async def prepare():
              connection = await asyncpg.connect(os.environ["DATABASE_URL"])
              try:
                  sql = Path("supabase/migrations/20261015020000_25_profile_fact_tenant_rls.sql").read_text()
                  await connection.execute(sql)
                  checks = await connection.fetchrow("""
                      SELECT relrowsecurity, relforcerowsecurity
                      FROM pg_class WHERE oid = 'public.profile_fact'::regclass
                  """)
                  assert checks["relrowsecurity"] and checks["relforcerowsecurity"]
                  policy = await connection.fetchval("""
                      SELECT count(*) FROM pg_policies
                      WHERE schemaname = 'public' AND tablename = 'profile_fact'
                        AND policyname = 'profile_fact_tenant_isolation'
                  """)
                  assert policy == 1
                  # CI-only least-privilege role for actual cross-tenant read proof.
                  await connection.execute("CREATE ROLE karen_ci_memory_reader NOLOGIN")
                  await connection.execute(
                      "GRANT USAGE ON SCHEMA public TO karen_ci_memory_reader"
                  )
                  await connection.execute(
                      "GRANT SELECT ON public.profile_fact TO karen_ci_memory_reader"
                  )
              finally:
                  await connection.close()

          asyncio.run(prepare())
          PY
      - name: Prove live name recall, tenant isolation, and consent revocation
        run: |
          pytest tests/integration/test_live_profile_memory_roundtrip.py -q -rs
          pytest tests/integration/test_live_name_formation_path.py -q -rs
          pytest tests/integration/test_live_profile_projection_identity.py -q -rs
          pytest tests/integration/test_live_profile_belief_projection.py -q -rs
          pytest tests/core/memory/test_profile_reconciliation_policy.py -q -rs
          pytest tests/integration/test_live_profile_reconciliation.py -q -rs
          pytest tests/integration/test_live_memory_consent_revocation.py -q -rs
          pytest tests/integration/test_live_automation_task_claims.py -q -rs

      - name: Prove persona activation/delete race against disposable PostgreSQL
        env:
          KAREN_TEST_DISPOSABLE_DATABASE: "1"
          KAREN_TEST_PERSONA_POSTGRES: "1"
          KAREN_TEST_PERSONA_USER_ID: "persona-ci-user"
          KAREN_TEST_PERSONA_TENANT_ID: "persona-ci-tenant"
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from sqlalchemy import text
          from ai_karen_engine.persistence.postgres import get_postgres_engine

          source = Path("supabase/migrations/20260827010000_01_core_persona_runtime.sql").read_text()
          start = source.index("CREATE TABLE IF NOT EXISTS custom_personas (")
          finish = source.index("-- BASELINE SOURCE: 20260823030000_chat_runtime_control_plane.sql")
          chunk = source[start:finish]
          # Execute the actual canonical baseline persona DDL segment.
          async def prepare():
              engine = get_postgres_engine().async_engine
              async with engine.begin() as conn:
                  for statement in chunk.split("DO $$"):
                      if statement == chunk.split("DO $$")[0]:
                          # Split normal SQL at statement delimiters.
                          for sql in statement.split(";"):
                              if sql.strip():
                                  await conn.execute(text(sql))
                          continue
                      # The remaining block is a PostgreSQL DO body followed
                      # by a baseline section header; run it as a single block.
                      body = "DO $$" + statement
                      body = body[:body.index("$$;") + 3]
                      await conn.execute(text(body))
          asyncio.run(prepare())
          PY
          python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          import asyncpg

          async def apply_selection_integrity():
              sql = Path("supabase/migrations/20261021010000_39_persona_selection_integrity.sql").read_text()
              connection = await asyncpg.connect(os.environ["DATABASE_URL"])
              try:
                  async with connection.transaction():
                      await connection.execute(sql)
              finally:
                  await connection.close()

          asyncio.run(apply_selection_integrity())
          PY
          python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          import asyncpg

          async def check():
              conn = await asyncpg.connect(os.environ["DATABASE_URL"])
              try:
                  await conn.execute(Path("supabase/migrations/20261021020000_40_persona_tenant_rls.sql").read_text())
                  for table in ("custom_personas", "user_persona_preferences", "persona_memory_entries"):
                      enabled = await conn.fetchrow(
                          "SELECT relrowsecurity, relforcerowsecurity FROM pg_class WHERE oid=$1::regclass",
                          "public." + table,
                      )
                      assert enabled["relrowsecurity"] and enabled["relforcerowsecurity"]
                      assert await conn.fetchval(
                          "SELECT count(*) FROM pg_policies WHERE schemaname='public' "
                          "AND tablename=$1 AND policyname='persona_tenant_isolation'", table
                      ) == 1
                  await conn.execute("CREATE ROLE karen_ci_persona_reader NOLOGIN")
                  await conn.execute("GRANT USAGE ON SCHEMA public TO karen_ci_persona_reader")
                  await conn.execute(
                      "GRANT SELECT ON public.custom_personas, public.user_persona_preferences, "
                      "public.persona_memory_entries TO karen_ci_persona_reader"
                  )
                  await conn.execute(
                      "INSERT INTO public.custom_personas "
                      "(id, tenant_id, user_id, name, system_prompt, default_tone, default_verbosity, default_language) "
                      "VALUES ('rls-proof-persona', 'rls-tenant-a', 'rls-user-a', 'RLS proof', 'RLS proof prompt', "
                      "'friendly', 'balanced', 'en_US')"
                  )
                  async with conn.transaction():
                      await conn.execute("SET LOCAL ROLE karen_ci_persona_reader")
                      await conn.execute("SELECT set_config('app.current_tenant_id', 'rls-tenant-b', true)")
                      assert await conn.fetchval(
                          "SELECT count(*) FROM public.custom_personas WHERE id='rls-proof-persona'"
                      ) == 0
                      await conn.execute("SELECT set_config('app.current_tenant_id', 'rls-tenant-a', true)")
                      assert await conn.fetchval(
                          "SELECT count(*) FROM public.custom_personas WHERE id='rls-proof-persona'"
                      ) == 1
              finally:
                  await conn.close()

          asyncio.run(check())
          PY
          pytest tests/integration/test_persona_activation_postgres.py -q -rs
