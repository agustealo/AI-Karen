name: Cognitive Proof CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/ai_karen_engine/core/intelligence/**'
      - 'src/ai_karen_engine/core/cognitive/**'
      - 'src/ai_karen_engine/core/contracts/**'
      - 'src/ai_karen_engine/core/cortex/**'
      - 'src/ai_karen_engine/core/reasoning/**'
      - 'src/ai_karen_engine/core/model_runtime/**'
      - 'src/ai_karen_engine/core/langgraph_orchestrator/**'
      - 'src/ai_karen_engine/core/runtime/workflow_runtime.py'
      - 'src/ai_karen_engine/core/runtime/workflow_generation.py'
      - 'src/ai_karen_engine/agent_medusa/**'
      - 'src/ai_karen_engine/core/adaptive/**'
      - 'src/ai_karen_engine/core/personalization/**'
      - 'src/ai_karen_engine/core/context/**'
      - 'src/ai_karen_engine/core/memory/**'
      - 'tests/core/reasoning/**'
      - 'tests/benchmarks/cognitive/**'
      - 'tests/fixtures/cognitive/**'
      - 'tests/architecture/cognitive_contracts/**'
      - 'tests/architecture/test_cognitive_execution_authority.py'
      - '.github/workflows/cognitive-proof-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/ai_karen_engine/core/intelligence/**'
      - 'src/ai_karen_engine/core/cognitive/**'
      - 'src/ai_karen_engine/core/contracts/**'
      - 'src/ai_karen_engine/core/cortex/**'
      - 'src/ai_karen_engine/core/reasoning/**'
      - 'src/ai_karen_engine/core/model_runtime/**'
      - 'src/ai_karen_engine/core/langgraph_orchestrator/**'
      - 'src/ai_karen_engine/core/runtime/workflow_runtime.py'
      - 'src/ai_karen_engine/core/runtime/workflow_generation.py'
      - 'src/ai_karen_engine/agent_medusa/**'
      - 'src/ai_karen_engine/core/adaptive/**'
      - 'src/ai_karen_engine/core/personalization/**'
      - 'src/ai_karen_engine/core/context/**'
      - 'src/ai_karen_engine/core/memory/**'
      - 'tests/core/reasoning/**'
      - 'tests/benchmarks/cognitive/**'
      - 'tests/fixtures/cognitive/**'
      - 'tests/architecture/cognitive_contracts/**'
      - 'tests/architecture/test_cognitive_execution_authority.py'
      - '.github/workflows/cognitive-proof-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: 'src:tests'

jobs:
  cognitive-proof:
    name: Cognitive Benchmark + Execution Authority
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install cognitive proof dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout pyyaml python-dotenv numpy scikit-learn

      - name: Compile cognitive contract surface
        run: |
          python -m compileall \
            src/ai_karen_engine/core/intelligence \
            src/ai_karen_engine/core/cognitive \
            src/ai_karen_engine/core/contracts \
            src/ai_karen_engine/core/cortex \
            src/ai_karen_engine/core/reasoning \
            src/ai_karen_engine/core/model_runtime \
            src/ai_karen_engine/core/langgraph_orchestrator \
            src/ai_karen_engine/core/runtime/workflow_runtime.py \
            src/ai_karen_engine/core/runtime/workflow_generation.py \
            src/ai_karen_engine/agent_medusa \
            src/ai_karen_engine/core/adaptive \
            src/ai_karen_engine/core/personalization \
            src/ai_karen_engine/core/context \
            src/ai_karen_engine/core/memory

      - name: Run cognitive contract architecture gates
        run: |
          pytest tests/architecture/cognitive_contracts -q --timeout=300 --tb=short

      - name: Run cognitive execution authority gates
        run: |
          pytest tests/architecture/test_cognitive_execution_authority.py \
            -q --timeout=300 --tb=short

      - name: Run reasoning capability unit proof
        if: ${{ always() }}
        run: |
          pytest tests/core/reasoning -q --timeout=300 --tb=short

      - name: Run full cognitive benchmark proof
        if: ${{ always() }}
        run: |
          pytest tests/benchmarks/cognitive/test_proof_gates.py -q --timeout=300 --tb=short

      - name: Run policy dominance proof explicitly
        if: ${{ always() }}
        run: |
          pytest tests/benchmarks/cognitive/test_proof_gates.py \
            -q --timeout=300 --tb=short \
            -k 'policy_dominance'
