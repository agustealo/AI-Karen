name: Cognitive Proof CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/ai_karen_engine/core/intelligence/**'
      - 'src/ai_karen_engine/core/cognitive/**'
      - 'src/ai_karen_engine/core/contracts/**'
      - 'src/ai_karen_engine/core/cortex/**'
      - 'src/ai_karen_engine/core/reasoning/**'
      - 'src/ai_karen_engine/core/model_runtime/**'
      - 'src/ai_karen_engine/core/langgraph_orchestrator/**'
      - 'src/ai_karen_engine/core/runtime/prompt/**'
      - 'src/ai_karen_engine/core/runtime/soft_reasoning_runtime.py'
      - 'src/ai_karen_engine/core/runtime/soft_reasoning_verifier.py'
      - 'src/ai_karen_engine/core/runtime/workflow_runtime.py'
      - 'src/ai_karen_engine/core/runtime/workflow_generation.py'
      - 'src/ai_karen_engine/agent_medusa/**'
      - 'src/ai_karen_engine/core/adaptive/**'
      - 'src/ai_karen_engine/core/personalization/**'
      - 'src/ai_karen_engine/core/context/**'
      - 'src/ai_karen_engine/core/memory/**'
      - 'tests/agent_medusa/test_distributed_run_authority.py'
      - 'tests/architecture/test_medusa_distributed_run_authority.py'
      - 'tests/core/reasoning/**'
      - 'tests/benchmarks/cognitive/**'
      - 'tests/fixtures/cognitive/**'
      - 'tests/architecture/cognitive_contracts/**'
      - 'tests/architecture/test_cognitive_execution_authority.py'
      - 'tests/core/test_cognitive_state_conflict_handoff.py'
      - 'tests/core/test_runtime_decision_pipeline.py'
      - 'requirements/ci/base.txt'
      - 'requirements/ci/cognitive.txt'
      - '.github/workflows/cognitive-proof-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/ai_karen_engine/core/intelligence/**'
      - 'src/ai_karen_engine/core/cognitive/**'
      - 'src/ai_karen_engine/core/contracts/**'
      - 'src/ai_karen_engine/core/cortex/**'
      - 'src/ai_karen_engine/core/reasoning/**'
      - 'src/ai_karen_engine/core/model_runtime/**'
      - 'src/ai_karen_engine/core/langgraph_orchestrator/**'
      - 'src/ai_karen_engine/core/runtime/prompt/**'
      - 'src/ai_karen_engine/core/runtime/soft_reasoning_runtime.py'
      - 'src/ai_karen_engine/core/runtime/soft_reasoning_verifier.py'
      - 'src/ai_karen_engine/core/runtime/workflow_runtime.py'
      - 'src/ai_karen_engine/core/runtime/workflow_generation.py'
      - 'src/ai_karen_engine/agent_medusa/**'
      - 'src/ai_karen_engine/core/adaptive/**'
      - 'src/ai_karen_engine/core/personalization/**'
      - 'src/ai_karen_engine/core/context/**'
      - 'src/ai_karen_engine/core/memory/**'
      - 'tests/agent_medusa/test_distributed_run_authority.py'
      - 'tests/architecture/test_medusa_distributed_run_authority.py'
      - 'tests/core/reasoning/**'
      - 'tests/benchmarks/cognitive/**'
      - 'tests/fixtures/cognitive/**'
      - 'tests/architecture/cognitive_contracts/**'
      - 'tests/architecture/test_cognitive_execution_authority.py'
      - 'tests/core/test_cognitive_state_conflict_handoff.py'
      - 'tests/core/test_runtime_decision_pipeline.py'
      - 'requirements/ci/base.txt'
      - 'requirements/ci/cognitive.txt'
      - '.github/workflows/cognitive-proof-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PYTHONPATH: 'src:tests'

jobs:
  cognitive-proof:
    name: Cognitive Benchmark + Execution Authority
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/ci/*.txt

      - name: Install cognitive proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci/cognitive.txt

      - name: Compile cognitive contract surface
        run: |
          python -m compileall \
            src/ai_karen_engine/core/intelligence \
            src/ai_karen_engine/core/cognitive \
            src/ai_karen_engine/core/contracts \
            src/ai_karen_engine/core/cortex \
            src/ai_karen_engine/core/reasoning \
            src/ai_karen_engine/core/model_runtime \
            src/ai_karen_engine/core/langgraph_orchestrator \
            src/ai_karen_engine/core/runtime/prompt \
            src/ai_karen_engine/core/runtime/soft_reasoning_runtime.py \
            src/ai_karen_engine/core/runtime/soft_reasoning_verifier.py \
            src/ai_karen_engine/core/runtime/workflow_runtime.py \
            src/ai_karen_engine/core/runtime/workflow_generation.py \
            src/ai_karen_engine/agent_medusa \
            src/ai_karen_engine/core/adaptive \
            src/ai_karen_engine/core/personalization \
            src/ai_karen_engine/core/memory

      - name: Run Medusa distributed execution authority gates
        run: |
          pytest \
            tests/agent_medusa/test_distributed_run_authority.py \
            tests/architecture/test_medusa_distributed_run_authority.py \
            -q --timeout=300 --tb=short

      - name: Run cognitive contract architecture gates
        run: |
          pytest tests/architecture/cognitive_contracts -q --timeout=300 --tb=short

      - name: Run cognitive execution authority gates
        if: ${{ always() }}
        run: |
          pytest tests/architecture/test_cognitive_execution_authority.py \
            -q --timeout=300 --tb=short

      - name: Run reasoning capability unit proof
        if: ${{ always() }}
        run: |
          pytest tests/core/reasoning -q --timeout=300 --tb=short

      - name: Prove KCOG-01A2 governed confidence evaluation
        if: ${{ always() }}
        run: |
          pytest tests/core/intelligence/ml/test_governed_confidence_evaluation.py \
            -q --timeout=300 --tb=short

      - name: Prove KCOG-01B1 verification effort OPE and model-policy regression
        if: ${{ always() }}
        run: |
          pytest \
            tests/core/intelligence/ml/test_verification_policy_evaluation.py \
            tests/core/intelligence/ml/test_model_policy_evaluation.py \
            -q --timeout=300 --tb=short

      - name: Prove KCOG-01B2 estimator integrity and promotion safety
        if: ${{ always() }}
        run: |
          pytest \
            tests/core/intelligence/ml/test_ope_estimator_integrity.py \
            -q --timeout=300 --tb=short

      - name: Prove KCOG-01B3 offline policy reporting provenance
        if: ${{ always() }}
        run: |
          pytest \
            tests/core/intelligence/ml/test_ope_reporting_provenance.py \
            tests/core/adaptive/test_learning.py \
            -q --timeout=300 --tb=short

      - name: Prove KCOG-01B4 baseline-relative promotion and logged baseline evidence
        if: ${{ always() }}
        run: |
          pytest \
            tests/core/intelligence/ml/test_ope_baseline_relative_promotion.py \
            tests/core/intelligence/ml/test_ope_reporting_provenance.py \
            tests/core/intelligence/ml/test_ope_estimator_integrity.py \
            -q --timeout=300 --tb=short

      - name: Prove KCOG-01B5 deterministic policy and overlap correctness
        if: ${{ always() }}
        run: |
          pytest \
            tests/core/intelligence/ml/test_ope_zero_target_support.py \
            tests/core/intelligence/ml/test_ope_baseline_relative_promotion.py \
            tests/core/intelligence/ml/test_ope_estimator_integrity.py \
            tests/core/intelligence/ml/test_verification_policy_evaluation.py \
            -q --timeout=300 --tb=short

      - name: Compile KCOG cognitive-state and policy boundary
        if: ${{ always() }}
        run: |
          python -m py_compile \
            src/ai_karen_engine/core/cortex/context_stages.py \
            src/ai_karen_engine/core/runtime/decision_pipeline.py \
            src/ai_karen_engine/core/runtime/execution_decision.py \
            tests/core/test_cognitive_state_conflict_handoff.py

      - name: Run full cognitive benchmark proof
        if: ${{ always() }}
        run: |
          pytest tests/benchmarks/cognitive/test_proof_gates.py -q --timeout=300 --tb=short
