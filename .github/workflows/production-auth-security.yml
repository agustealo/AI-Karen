name: Production Auth Security

on:
  push:
    paths:
      - "src/ai_karen_engine/api_routes/auth/**"
      - "src/ai_karen_engine/services/auth/**"
      - "src/ai_karen_engine/core/services/base.py"
      - "src/ai_karen_engine/database/models/session_security.py"
      - "src/ai_karen_engine/monitoring/**"
      - "supabase/migrations/*.sql"
      - "tests/auth/**"
      - "tests/security/**"
      - "tests/integration/test_auth_refresh_concurrency_postgres.py"
      - "tests/architecture/test_auth_production_security_contract.py"
      - "tests/architecture/test_auth_session_security_contract.py"
      - "tests/architecture/test_auth_session_validation_contract.py"
      - "tests/architecture/test_auth_readiness_contract.py"
      - "tests/architecture/test_authenticated_tenant_context_contract.py"
      - ".github/workflows/production-auth-security.yml"
  pull_request:
    paths:
      - "src/ai_karen_engine/api_routes/auth/**"
      - "src/ai_karen_engine/services/auth/**"
      - "src/ai_karen_engine/core/services/base.py"
      - "src/ai_karen_engine/database/models/session_security.py"
      - "src/ai_karen_engine/monitoring/**"
      - "supabase/migrations/*.sql"
      - "tests/auth/**"
      - "tests/security/**"
      - "tests/integration/test_auth_refresh_concurrency_postgres.py"
      - "tests/architecture/test_auth_production_security_contract.py"
      - "tests/architecture/test_auth_session_security_contract.py"
      - "tests/architecture/test_auth_session_validation_contract.py"
      - "tests/architecture/test_auth_readiness_contract.py"
      - "tests/architecture/test_authenticated_tenant_context_contract.py"
      - ".github/workflows/production-auth-security.yml"
  workflow_dispatch:

jobs:
  production-auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karen_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d karen_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio sqlalchemy asyncpg PyJWT bcrypt structlog cryptography PyYAML pydantic pydantic-settings python-dotenv prometheus_client

      - name: Prove auth files compile
        run: |
          python -m compileall -q \
            src/ai_karen_engine/services/auth/auth_service.py \
            src/ai_karen_engine/core/services/base.py \
            src/ai_karen_engine/database/models/session_security.py \
            src/ai_karen_engine/api_routes/auth/auth.py \
            src/ai_karen_engine/monitoring

      - name: Prove first-run authority boundary
        run: pytest tests/architecture/test_auth_production_security_contract.py -q

      - name: Prove durable auth readiness
        run: pytest tests/architecture/test_auth_readiness_contract.py -q

      - name: Prove session rotation security contract
        run: pytest tests/architecture/test_auth_session_security_contract.py -q

      - name: Prove password and session-validation authority
        run: pytest tests/architecture/test_auth_session_validation_contract.py -q

      - name: Prove authenticated tenant route boundary
        run: pytest tests/architecture/test_authenticated_tenant_context_contract.py -q

      - name: Prove tenant isolation gauntlet
        env:
          PYTHONPATH: src
        run: pytest tests/security/test_tenant_isolation_gauntlet.py -q

      - name: Prove real PostgreSQL concurrent refresh behavior
        env:
          PYTHONPATH: src
          AUTH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/karen_auth_test
        run: pytest tests/integration/test_auth_refresh_concurrency_postgres.py -q

      - name: Prove refresh history migration never stores historical raw tokens
        shell: bash
        run: |
          set -euo pipefail
          matches=()
          while IFS= read -r -d '' migration; do
            if grep -q "CREATE TABLE IF NOT EXISTS public.auth_refresh_token_history" "$migration"; then
              matches+=("$migration")
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0)

          if [ "${#matches[@]}" -ne 1 ]; then
            printf 'Expected exactly one auth_refresh_token_history schema owner, found %s: %s\n' "${#matches[@]}" "${matches[*]:-none}" >&2
            exit 1
          fi

          migration="${matches[0]}"
          grep -q "token_hash" "$migration"
          grep -qi "raw historical refresh tokens" "$migration"
          if grep -Eq "(^|[[:space:]])refresh_token[[:space:]]+(text|varchar|character varying)" "$migration"; then
            echo "Historical raw refresh token column detected in $migration" >&2
            exit 1
          fi
