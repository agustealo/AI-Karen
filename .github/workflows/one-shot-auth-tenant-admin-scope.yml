name: One-shot Auth Tenant Admin Scope

on:
  push:
    branches:
      - prod/api-rbac-tenant-gauntlet
    paths:
      - .github/workflows/one-shot-auth-tenant-admin-scope.yml

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/api-rbac-tenant-gauntlet
          fetch-depth: 0

      - name: Apply tenant-admin scope transformation
        run: python scripts/dev/apply_auth_tenant_admin_scope.py

      - name: Compile transformed auth files
        run: |
          python -m compileall -q \
            src/ai_karen_engine/api_routes/auth/auth.py \
            src/ai_karen_engine/services/auth/auth_service.py

      - name: Commit transformed source and remove scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-auth-tenant-admin-scope.yml
          git rm scripts/dev/apply_auth_tenant_admin_scope.py
          git add src/ai_karen_engine/api_routes/auth/auth.py src/ai_karen_engine/services/auth/auth_service.py
          git commit -m "fix(auth): enforce tenant scope on admin operations"
          git push origin HEAD:prod/api-rbac-tenant-gauntlet
