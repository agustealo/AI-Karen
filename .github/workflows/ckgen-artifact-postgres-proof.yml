name: CK-GEN Artifact PostgreSQL Owner and Archive Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ai_karen_engine/services/database/repositories/supabase_artifact_store.py"
      - "supabase/migrations/*artifact_archive_state.sql"
      - "tests/integration/test_live_code_artifact_revocation_postgres.py"
      - ".github/workflows/ckgen-artifact-postgres-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/ai_karen_engine/services/database/repositories/supabase_artifact_store.py"
      - "supabase/migrations/*artifact_archive_state.sql"
      - "tests/integration/test_live_code_artifact_revocation_postgres.py"
      - ".github/workflows/ckgen-artifact-postgres-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ckgen-artifact-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-postgres:
    name: artifact-postgres-owner-revocation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      KAREN_TEST_DISPOSABLE_DATABASE: "1"
      KAREN_TEST_CODE_ARTIFACT_POSTGRES: "1"
      KAREN_TEST_CODE_ARTIFACT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/karen_code_artifact_test
      KAREN_TEST_ARTIFACT_TENANT_ID: 10000000-0000-4000-8000-000000000001
      KAREN_TEST_ARTIFACT_OWNER_ID: 10000000-0000-4000-8000-000000000002
      KAREN_TEST_ARTIFACT_OTHER_USER_ID: 10000000-0000-4000-8000-000000000003
    steps:
      - uses: actions/checkout@v4

      - name: Assert exact checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Start existing isolated PostgreSQL container
        env:
          KAREN_CI_DOCKERHUB_USERNAME: ${{ secrets.KAREN_CI_DOCKERHUB_USERNAME }}
          KAREN_CI_DOCKERHUB_TOKEN: ${{ secrets.KAREN_CI_DOCKERHUB_TOKEN }}
          KAREN_CI_POSTGRES_IMAGE: ${{ vars.KAREN_CI_POSTGRES_IMAGE || 'pgvector/pgvector:pg16' }}
        run: bash scripts/ci/start-postgres-container.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/*.txt

      - name: Install canonical runtime and PostgreSQL dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements/ci/chat.txt

      - name: Create fresh disposable database and apply canonical artifact schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os
          import re
          from pathlib import Path

          import asyncpg

          BASELINE = Path("supabase/migrations/20260827010000_01_core_persona_runtime.sql")
          ARCHIVE = Path("supabase/migrations/20261121010000_66_artifact_archive_state.sql")
          DB_NAME = "karen_code_artifact_test"
          ROOT_DSN = "postgresql://postgres:postgres@127.0.0.1:5432/ai_karen"
          DB_DSN = "postgresql://postgres:postgres@127.0.0.1:5432/" + DB_NAME

          def source_table(sql: str, name: str) -> str:
              match = re.search(
                  rf"^CREATE TABLE {re.escape(name)} \\([\\s\\S]*?^\\);",
                  sql,
                  flags=re.MULTILINE,
              )
              if match is None:
                  raise RuntimeError(f"Canonical migration no longer defines {name}")
              return match.group(0)

          async def prove_schema() -> None:
              root = await asyncpg.connect(ROOT_DSN)
              try:
                  exists = await root.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1", DB_NAME
                  )
                  if exists:
                      raise RuntimeError("Refusing to reuse existing artifact proof database")
                  await root.execute("CREATE DATABASE karen_code_artifact_test")
              finally:
                  await root.close()

              db = await asyncpg.connect(DB_DSN)
              try:
                  baseline = BASELINE.read_text(encoding="utf-8")
                  # Use the exact checked-in table DDL, not a hand-written
                  # lookalike. These two source tables are the dependencies
                  # for the canonical files repository contract.
                  await db.execute(source_table(baseline, "auth_users"))
                  await db.execute(source_table(baseline, "files"))
                  await db.execute(ARCHIVE.read_text(encoding="utf-8"))
                  for key, email in (
                      ("KAREN_TEST_ARTIFACT_OWNER_ID", "artifact-owner@ci.invalid"),
                      ("KAREN_TEST_ARTIFACT_OTHER_USER_ID", "artifact-other@ci.invalid"),
                  ):
                      await db.execute(
                          "INSERT INTO auth_users (user_id, tenant_id, email, roles) "
                          "VALUES ($1::uuid, $2::text, $3::text, '[\"user\"]'::jsonb)",
                          os.environ[key],
                          os.environ["KAREN_TEST_ARTIFACT_TENANT_ID"],
                          email,
                      )
              finally:
                  await db.close()

          asyncio.run(prove_schema())
          PY

      - name: Prove actual PostgreSQL owner denial and committed archive revocation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/ai_karen_engine/services/database/repositories/supabase_artifact_store.py \
            tests/integration/test_live_code_artifact_revocation_postgres.py
          pytest tests/integration/test_live_code_artifact_revocation_postgres.py \
            -q -rs --junitxml=ckgen-artifact-postgres-junit.xml

      - name: Preserve PostgreSQL proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckgen-artifact-postgres-exact-head
          path: ckgen-artifact-postgres-junit.xml
          if-no-files-found: warn
          retention-days: 14
