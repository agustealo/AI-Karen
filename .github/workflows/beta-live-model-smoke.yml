name: Beta Live Model Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/beta_live_model_smoke.py"
      - "scripts/ci/production-first-boot-smoke.sh"
      - "src/ai_karen_engine/api_routes/chat/**"
      - "src/ai_karen_engine/core/model_runtime/provider_execution.py"
      - "src/ai_karen_engine/core/runtime/**"
      - ".github/workflows/beta-live-model-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/beta_live_model_smoke.py"
      - "scripts/setup_beta_actions_runner.ps1"
      - "src/ai_karen_engine/core/expression/**"
      - "src/ai_karen_engine/core/model_runtime/**"
      - ".github/workflows/beta-live-model-smoke.yml"
      - ".github/workflows/beta-release-gate.yml"

permissions:
  contents: read

jobs:
  live-model-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - Windows
      - X64
      - karen-beta-model
    timeout-minutes: 25
    environment: beta-release
    env:
      BETA_MODEL_BASE_URL: ${{ vars.BETA_MODEL_BASE_URL }}
      BETA_MODEL_API_KEY: ${{ secrets.BETA_MODEL_API_KEY }}
      BETA_MODEL_NAME: ${{ vars.BETA_MODEL_NAME }}
      BETA_MODEL_PROVIDER: ${{ vars.BETA_MODEL_PROVIDER }}
      BETA_MODEL_TIMEOUT_SECONDS: "90"

    steps:
      - uses: actions/checkout@v4

      - name: Verify exact checkout
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Runner checkout $actual does not match expected $env:GITHUB_SHA"
          }
          Write-Host "beta_live_model_sha=$actual"

      - name: Compile live-model smoke harness
        run: python -m py_compile scripts/beta_live_model_smoke.py

      - name: Prove real local model inference
        run: python scripts/beta_live_model_smoke.py

      - name: Verify production proof prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker version
          bash -n scripts/ci/production-first-boot-smoke.sh

      - name: Build exact production API image
        run: docker build --target app --build-arg PROFILE=runtime -t ai-karen-api:beta-live .

      - name: Prove production-backed two-turn KAREN chat
        shell: bash
        env:
          KAREN_SMOKE_API_IMAGE: ai-karen-api:beta-live
          KAREN_SMOKE_LIVE_MODEL_BASE_URL: ${{ vars.BETA_MODEL_BASE_URL }}
          KAREN_SMOKE_LIVE_MODEL_PROVIDER: ${{ vars.BETA_MODEL_PROVIDER || 'lmstudio-desktop' }}
          KAREN_SMOKE_LIVE_MODEL_NAME: ${{ vars.BETA_MODEL_NAME }}
          KAREN_SMOKE_LIVE_MODEL_TIMEOUT_SECONDS: "90"
        run: bash scripts/ci/production-first-boot-smoke.sh
