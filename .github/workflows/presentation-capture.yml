name: KAREN Presentation Capture

on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: "Full 40-character git SHA deployed at the approved demo target"
        required: true
        type: string
      destination_branch:
        description: "Existing non-default branch that will receive validated gallery assets"
        required: true
        default: "docs/premium-brand-showcase"
        type: string
      commit_assets:
        description: "Commit validated screenshots to the destination branch"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: karen-presentation-capture-${{ inputs.destination_branch }}
  cancel-in-progress: false

jobs:
  capture:
    name: trusted-real-product-capture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - name: Enforce default-branch workflow authority
        shell: bash
        working-directory: .
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "KAREN Presentation Capture must be dispatched from the default branch so secret-bearing code is repository-trusted." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Attest exact trusted checkout
        shell: bash
        working-directory: .
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

      - name: Validate capture target and destination
        shell: bash
        working-directory: .
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch }}
          CAPTURE_URL: ${{ secrets.KAREN_PRESENTATION_BASE_URL }}
          CAPTURE_EMAIL: ${{ secrets.KAREN_PRESENTATION_EMAIL }}
          CAPTURE_PASSWORD: ${{ secrets.KAREN_PRESENTATION_PASSWORD }}
          TARGET_REVISION: ${{ inputs.target_revision }}
        run: |
          set -euo pipefail

          if [[ -z "$CAPTURE_URL" || -z "$CAPTURE_EMAIL" || -z "$CAPTURE_PASSWORD" ]]; then
            echo "KAREN_PRESENTATION_BASE_URL, KAREN_PRESENTATION_EMAIL, and KAREN_PRESENTATION_PASSWORD repository secrets are required" >&2
            exit 1
          fi

          case "$CAPTURE_URL" in
            https://*) ;;
            *)
              echo "KAREN_PRESENTATION_BASE_URL must use HTTPS so capture credentials are never sent over plaintext" >&2
              exit 1
              ;;
          esac

          if [[ "$CAPTURE_URL" == *"@"* ]]; then
            echo "KAREN_PRESENTATION_BASE_URL must not contain embedded credentials" >&2
            exit 1
          fi

          if [[ ! "$TARGET_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_revision must be a full 40-character git SHA" >&2
            exit 1
          fi

          if ! git cat-file -e "${TARGET_REVISION}^{commit}" 2>/dev/null; then
            echo "target_revision is not a known commit in this repository checkout" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$TARGET_REVISION"; then
            echo "target_revision must include the exact trusted main capture baseline $GITHUB_SHA" >&2
            exit 1
          fi

          if [[ -z "$DESTINATION_BRANCH" || "$DESTINATION_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo "destination_branch must be an existing non-default branch" >&2
            exit 1
          fi

          if [[ ! "$DESTINATION_BRANCH" =~ ^[A-Za-z0-9._/-]+$ || "$DESTINATION_BRANCH" == -* || "$DESTINATION_BRANCH" == */..* || "$DESTINATION_BRANCH" == *..* ]]; then
            echo "destination_branch contains unsafe ref syntax" >&2
            exit 1
          fi

          if ! git ls-remote --exit-code --heads origin "refs/heads/$DESTINATION_BRANCH" >/dev/null; then
            echo "destination_branch does not exist: $DESTINATION_BRANCH" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install frontend dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify approved demo deployment is reachable
        shell: bash
        env:
          CAPTURE_URL: ${{ secrets.KAREN_PRESENTATION_BASE_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            "${CAPTURE_URL%/}/login" >/dev/null

      - name: Capture real KAREN product surfaces with trusted harness
        env:
          KAREN_SHOWCASE_ALLOW_CAPTURE: "true"
          KAREN_SHOWCASE_ACCOUNT_KIND: sanitized-demo
          KAREN_SHOWCASE_BASE_URL: ${{ secrets.KAREN_PRESENTATION_BASE_URL }}
          KAREN_SHOWCASE_EMAIL: ${{ secrets.KAREN_PRESENTATION_EMAIL }}
          KAREN_SHOWCASE_PASSWORD: ${{ secrets.KAREN_PRESENTATION_PASSWORD }}
          KAREN_SHOWCASE_TARGET_REVISION: ${{ inputs.target_revision }}
        run: npx playwright test --config=e2e/playwright.showcase.config.ts

      - name: Verify screenshot provenance with trusted gallery contract
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          python scripts/ci/presentation_gallery_contract.py \
            --require-assets \
            --expected-harness-sha "$GITHUB_SHA" \
            --require-target-descendant-of-harness

      - name: Upload immutable presentation evidence
        uses: actions/upload-artifact@v7
        with:
          name: karen-presentation-${{ github.sha }}-${{ inputs.target_revision }}
          path: |
            docs/assets/screenshots/01-chat-runtime.png
            docs/assets/screenshots/02-agents-overview.png
            docs/assets/screenshots/03-plugin-ecosystem.png
            docs/assets/screenshots/04-comms-center.png
            docs/assets/screenshots/05-settings-and-models.png
            docs/assets/screenshots/capture-manifest.json
          if-no-files-found: error
          retention-days: 30

  commit-gallery:
    name: commit-validated-gallery
    if: ${{ inputs.commit_assets }}
    needs: capture
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.destination_branch }}
          fetch-depth: 0

      - name: Attest destination branch without capture secrets
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch }}
        run: |
          set -euo pipefail
          if [[ -z "$DESTINATION_BRANCH" || "$DESTINATION_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo "destination_branch must be an existing non-default branch" >&2
            exit 1
          fi
          test "$(git rev-parse --abbrev-ref HEAD)" = "$DESTINATION_BRANCH"

      - name: Download validated presentation evidence
        uses: actions/download-artifact@v8
        with:
          name: karen-presentation-${{ github.sha }}-${{ inputs.target_revision }}
          path: docs/assets/screenshots

      - name: Re-verify downloaded gallery before repository write
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/presentation_gallery_contract.py \
            --require-assets \
            --expected-harness-sha "$GITHUB_SHA" \
            --require-target-descendant-of-harness

      - name: Commit validated gallery to destination branch
        shell: bash
        env:
          DESTINATION_BRANCH: ${{ inputs.destination_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/assets/screenshots/01-chat-runtime.png \
            docs/assets/screenshots/02-agents-overview.png \
            docs/assets/screenshots/03-plugin-ecosystem.png \
            docs/assets/screenshots/04-comms-center.png \
            docs/assets/screenshots/05-settings-and-models.png \
            docs/assets/screenshots/capture-manifest.json

          if git diff --cached --quiet; then
            echo "Capture matches the committed gallery; nothing to commit."
            exit 0
          fi

          git commit -m "docs: refresh real KAREN product screenshots"
          git push origin "HEAD:$DESTINATION_BRANCH"
