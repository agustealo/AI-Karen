name: KAREN Presentation Capture

on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: "Full 40-character git SHA deployed at the approved demo target"
        required: true
        type: string
      commit_assets:
        description: "Commit validated screenshots back to this non-default branch"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: karen-presentation-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: real-product-capture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attest exact checkout
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate approved capture target
        shell: bash
        working-directory: .
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CAPTURE_URL: ${{ secrets.KAREN_PRESENTATION_BASE_URL }}
          CAPTURE_EMAIL: ${{ secrets.KAREN_PRESENTATION_EMAIL }}
          CAPTURE_PASSWORD: ${{ secrets.KAREN_PRESENTATION_PASSWORD }}
          TARGET_REVISION: ${{ inputs.target_revision }}
        run: |
          set -euo pipefail

          if [[ -z "$CAPTURE_URL" || -z "$CAPTURE_EMAIL" || -z "$CAPTURE_PASSWORD" ]]; then
            echo "KAREN_PRESENTATION_BASE_URL, KAREN_PRESENTATION_EMAIL, and KAREN_PRESENTATION_PASSWORD repository secrets are required" >&2
            exit 1
          fi

          case "$CAPTURE_URL" in
            https://*) ;;
            *)
              echo "KAREN_PRESENTATION_BASE_URL must use HTTPS so capture credentials are never sent over plaintext" >&2
              exit 1
              ;;
          esac

          if [[ "$CAPTURE_URL" == *"@"* ]]; then
            echo "KAREN_PRESENTATION_BASE_URL must not contain embedded credentials" >&2
            exit 1
          fi

          if [[ ! "$TARGET_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_revision must be a full 40-character git SHA" >&2
            exit 1
          fi

          if ! git cat-file -e "${TARGET_REVISION}^{commit}" 2>/dev/null; then
            echo "target_revision is not a known commit in this repository checkout" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TARGET_REVISION" HEAD; then
            echo "target_revision must belong to the current repository line" >&2
            exit 1
          fi

          if [[ "${{ inputs.commit_assets }}" == "true" && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            echo "Presentation assets may not be committed directly to the default branch" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install frontend dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify approved demo deployment is reachable
        shell: bash
        env:
          CAPTURE_URL: ${{ secrets.KAREN_PRESENTATION_BASE_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            "${CAPTURE_URL%/}/login" >/dev/null

      - name: Capture real KAREN product surfaces
        env:
          KAREN_SHOWCASE_ALLOW_CAPTURE: "true"
          KAREN_SHOWCASE_ACCOUNT_KIND: sanitized-demo
          KAREN_SHOWCASE_BASE_URL: ${{ secrets.KAREN_PRESENTATION_BASE_URL }}
          KAREN_SHOWCASE_EMAIL: ${{ secrets.KAREN_PRESENTATION_EMAIL }}
          KAREN_SHOWCASE_PASSWORD: ${{ secrets.KAREN_PRESENTATION_PASSWORD }}
          KAREN_SHOWCASE_TARGET_REVISION: ${{ inputs.target_revision }}
        run: npm run showcase:capture

      - name: Verify screenshot provenance and premium media contract
        shell: bash
        working-directory: .
        run: python scripts/ci/verify_presentation_assets.py --require-assets

      - name: Upload immutable presentation evidence
        uses: actions/upload-artifact@v4
        with:
          name: karen-presentation-${{ github.sha }}
          path: |
            docs/assets/screenshots/01-chat-runtime.png
            docs/assets/screenshots/02-agents-overview.png
            docs/assets/screenshots/03-plugin-ecosystem.png
            docs/assets/screenshots/04-comms-center.png
            docs/assets/screenshots/05-settings-and-models.png
            docs/assets/screenshots/capture-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated gallery to selected branch
        if: ${{ inputs.commit_assets }}
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/assets/screenshots/01-chat-runtime.png \
            docs/assets/screenshots/02-agents-overview.png \
            docs/assets/screenshots/03-plugin-ecosystem.png \
            docs/assets/screenshots/04-comms-center.png \
            docs/assets/screenshots/05-settings-and-models.png \
            docs/assets/screenshots/capture-manifest.json

          if git diff --cached --quiet; then
            echo "Capture matches the committed gallery; nothing to commit."
            exit 0
          fi

          git commit -m "docs: refresh real KAREN product screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
