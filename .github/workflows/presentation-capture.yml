name: KAREN Presentation Capture

on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: "Full 40-character git SHA to build and capture"
        required: true
        type: string
      destination_branch:
        description: "Existing non-default branch that will receive validated gallery assets"
        required: true
        default: "docs/premium-brand-showcase"
        type: string
      commit_assets:
        description: "Commit validated screenshots to the destination branch"
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: karen-presentation-capture-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare-trusted-capture-request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.actor == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       startsWith(github.event.comment.body, '/capture-presentation '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      target_revision: ${{ steps.request.outputs.target_revision }}
      destination_branch: ${{ steps.bind.outputs.destination_branch || steps.request.outputs.destination_branch }}
      commit_assets: ${{ steps.request.outputs.commit_assets }}

    steps:
      - name: Enforce default-branch workflow authority
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "KAREN Presentation Capture must execute from the default branch so orchestration code is repository-trusted." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Attest exact trusted checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Resolve trusted capture request
        id: request
        shell: bash
        env:
          DISPATCH_TARGET_REVISION: ${{ inputs.target_revision }}
          DISPATCH_DESTINATION_BRANCH: ${{ inputs.destination_branch }}
          DISPATCH_COMMIT_ASSETS: ${{ inputs.commit_assets }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          event_name = os.environ["GITHUB_EVENT_NAME"]

          if event_name == "workflow_dispatch":
              target = os.environ.get("DISPATCH_TARGET_REVISION", "").strip()
              destination = os.environ.get("DISPATCH_DESTINATION_BRANCH", "").strip()
              commit_assets = os.environ.get("DISPATCH_COMMIT_ASSETS", "false").strip().lower()
          elif event_name == "issue_comment":
              body = str(event.get("comment", {}).get("body", "")).strip()
              match = re.fullmatch(r"/capture-presentation\s+([0-9a-fA-F]{40})", body)
              if match is None:
                  raise SystemExit("owner capture command must be exactly: /capture-presentation <full-40-character-sha>")
              target = match.group(1)
              destination = ""
              commit_assets = "true"
          else:
              raise SystemExit(f"unsupported presentation capture event: {event_name}")

          if re.fullmatch(r"[0-9a-fA-F]{40}", target) is None:
              raise SystemExit("target_revision must be a full 40-character git SHA")
          if event_name == "workflow_dispatch" and not destination:
              raise SystemExit("destination_branch is required for workflow_dispatch")
          if commit_assets not in {"true", "false"}:
              raise SystemExit("commit_assets must resolve to true or false")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"target_revision={target.lower()}\n")
              handle.write(f"destination_branch={destination}\n")
              handle.write(f"commit_assets={commit_assets}\n")
          PY

      - name: Bind owner comment to current pull-request head
        id: bind
        if: ${{ github.event_name == 'issue_comment' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          TARGET_REVISION: ${{ steps.request.outputs.target_revision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          readarray -t PR_BINDING < <(
            PR_JSON="$PR_JSON" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["PR_JSON"])
          print(payload["head"]["sha"])
          print(payload["head"]["ref"])
          print(payload["head"]["repo"]["full_name"])
          PY
          )

          CURRENT_PR_HEAD="${PR_BINDING[0]:-}"
          DESTINATION_BRANCH="${PR_BINDING[1]:-}"
          HEAD_REPOSITORY="${PR_BINDING[2]:-}"

          if [[ "$CURRENT_PR_HEAD" != "$TARGET_REVISION" ]]; then
            echo "owner capture command SHA must equal the current pull-request head" >&2
            echo "requested: $TARGET_REVISION" >&2
            echo "current:   $CURRENT_PR_HEAD" >&2
            exit 1
          fi
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "owner-comment capture write-back is restricted to same-repository pull requests" >&2
            exit 1
          fi
          if [[ -z "$DESTINATION_BRANCH" || "$DESTINATION_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo "current pull-request head must resolve to a non-default destination branch" >&2
            exit 1
          fi

          printf 'destination_branch=%s\n' "$DESTINATION_BRANCH" >> "$GITHUB_OUTPUT"

  capture:
    name: trusted-self-contained-real-product-capture
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout trusted capture authority
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Attest exact trusted checkout and target ancestry
        shell: bash
        env:
          TARGET_REVISION: ${{ needs.prepare.outputs.target_revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "$TARGET_REVISION"
          git cat-file -e "${TARGET_REVISION}^{commit}"
          git merge-base --is-ancestor "$GITHUB_SHA" "$TARGET_REVISION"

      - name: Checkout exact candidate application without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.target_revision }}
          path: .presentation-target
          fetch-depth: 0
          persist-credentials: false

      - name: Attest exact candidate checkout
        shell: bash
        env:
          TARGET_REVISION: ${{ needs.prepare.outputs.target_revision }}
        run: |
          set -euo pipefail
          test "$(git -C .presentation-target rev-parse HEAD)" = "$TARGET_REVISION"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Validate trusted self-contained capture runner
        shell: bash
        run: bash -n scripts/ci/presentation-self-contained-capture.sh

      - name: Install trusted showcase dependencies reproducibly
        working-directory: src/ui_launchers/Karen-AI-Theme
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for trusted showcase harness
        working-directory: src/ui_launchers/Karen-AI-Theme
        run: npx playwright install --with-deps chromium

      - name: Build exact candidate production API image
        working-directory: .presentation-target
        run: docker build --target app --build-arg PROFILE=runtime -t ai-karen-presentation-api:candidate .

      - name: Build exact candidate production web image
        working-directory: .presentation-target
        run: |
          docker build \
            -f src/ui_launchers/Karen-AI-Theme/Dockerfile.production \
            -t ai-karen-presentation-web:candidate \
            src/ui_launchers/Karen-AI-Theme

      - name: Capture exact candidate from disposable production stack
        shell: bash
        env:
          KAREN_PRESENTATION_TARGET_ROOT: ${{ github.workspace }}/.presentation-target
          KAREN_PRESENTATION_TRUSTED_ROOT: ${{ github.workspace }}
          KAREN_SHOWCASE_TARGET_REVISION: ${{ needs.prepare.outputs.target_revision }}
        run: bash scripts/ci/presentation-self-contained-capture.sh

      - name: Verify screenshot provenance with trusted gallery contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/presentation_gallery_contract.py \
            --require-assets \
            --expected-harness-sha "$GITHUB_SHA" \
            --require-target-descendant-of-harness

      - name: Upload immutable presentation evidence and verifier
        uses: actions/upload-artifact@v7
        with:
          name: karen-presentation-${{ github.sha }}-${{ needs.prepare.outputs.target_revision }}
          path: |
            docs/assets/screenshots/01-chat-runtime.png
            docs/assets/screenshots/02-agents-overview.png
            docs/assets/screenshots/03-plugin-ecosystem.png
            docs/assets/screenshots/04-comms-center.png
            docs/assets/screenshots/05-settings-and-models.png
            docs/assets/screenshots/capture-manifest.json
            scripts/ci/presentation_gallery_contract.py
          if-no-files-found: error
          retention-days: 30

  commit-gallery:
    name: commit-validated-gallery
    if: ${{ needs.prepare.outputs.commit_assets == 'true' }}
    needs:
      - prepare
      - capture
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.destination_branch }}
          fetch-depth: 0

      - name: Attest destination branch without runtime credentials
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DESTINATION_BRANCH: ${{ needs.prepare.outputs.destination_branch }}
        run: |
          set -euo pipefail
          if [[ -z "$DESTINATION_BRANCH" || "$DESTINATION_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo "destination_branch must be an existing non-default branch" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$DESTINATION_BRANCH)"

      - name: Download trusted presentation evidence bundle
        uses: actions/download-artifact@v8
        with:
          name: karen-presentation-${{ github.sha }}-${{ needs.prepare.outputs.target_revision }}
          path: ${{ runner.temp }}/karen-presentation-evidence

      - name: Stage only canonical gallery files
        shell: bash
        run: |
          set -euo pipefail
          for path in docs docs/assets docs/assets/screenshots; do
            if [[ -L "$path" ]]; then
              echo "Refusing gallery write through symlinked destination path: $path" >&2
              exit 1
            fi
          done
          mkdir -p docs/assets/screenshots
          for file in \
            01-chat-runtime.png \
            02-agents-overview.png \
            03-plugin-ecosystem.png \
            04-comms-center.png \
            05-settings-and-models.png \
            capture-manifest.json
          do
            install -m 0644 \
              "$RUNNER_TEMP/karen-presentation-evidence/docs/assets/screenshots/$file" \
              "docs/assets/screenshots/$file"
          done

      - name: Re-verify with trusted artifact code before repository write
        shell: bash
        env:
          KAREN_PRESENTATION_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/karen-presentation-evidence/scripts/ci/presentation_gallery_contract.py" \
            --require-assets \
            --expected-harness-sha "$GITHUB_SHA" \
            --require-target-descendant-of-harness

      - name: Commit validated gallery to destination branch
        shell: bash
        env:
          DESTINATION_BRANCH: ${{ needs.prepare.outputs.destination_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/assets/screenshots/01-chat-runtime.png \
            docs/assets/screenshots/02-agents-overview.png \
            docs/assets/screenshots/03-plugin-ecosystem.png \
            docs/assets/screenshots/04-comms-center.png \
            docs/assets/screenshots/05-settings-and-models.png \
            docs/assets/screenshots/capture-manifest.json

          if git diff --cached --quiet; then
            echo "Capture matches the committed gallery; nothing to commit."
            exit 0
          fi

          git commit -m "docs: refresh real KAREN product screenshots"
          git push origin "HEAD:$DESTINATION_BRANCH"
