name: KAREN Presentation Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/presentation/**"
      - "docs/assets/screenshots/**"
      - "scripts/ci/presentation_gallery_contract.py"
      - "scripts/ci/verify_presentation_assets.py"
      - "src/ai_karen_engine/api_routes/automation/stats.py"
      - "src/ui_launchers/Karen-AI-Theme/package.json"
      - "src/ui_launchers/Karen-AI-Theme/e2e/playwright.showcase.config.ts"
      - "src/ui_launchers/Karen-AI-Theme/e2e/showcase/**"
      - "src/ui_launchers/Karen-AI-Theme/public/brand/**"
      - "src/ui_launchers/Karen-AI-Theme/src/app/dashboard/page.tsx"
      - "src/ui_launchers/Karen-AI-Theme/src/app/layout.tsx"
      - "src/ui_launchers/Karen-AI-Theme/src/app/login/page.tsx"
      - "src/ui_launchers/Karen-AI-Theme/src/app/manifest.ts"
      - "src/ui_launchers/Karen-AI-Theme/src/components/automation/AgentsOverviewPage.tsx"
      - "src/ui_launchers/Karen-AI-Theme/src/components/automation/automationStats.ts"
      - "src/ui_launchers/Karen-AI-Theme/src/components/automation/automationStats.test.ts"
      - "src/ui_launchers/Karen-AI-Theme/src/components/comms/CommsCenterPage.tsx"
      - "src/ui_launchers/Karen-AI-Theme/src/components/plugins/PluginOverviewPage.tsx"
      - "tests/architecture/test_main_quality_presentation_contract.py"
      - ".github/workflows/presentation-contract.yml"
      - ".github/workflows/presentation-capture.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/presentation/**"
      - "docs/assets/screenshots/**"
      - "scripts/ci/presentation_gallery_contract.py"
      - "scripts/ci/verify_presentation_assets.py"
      - "src/ai_karen_engine/api_routes/automation/stats.py"
      - "src/ui_launchers/Karen-AI-Theme/package.json"
      - "src/ui_launchers/Karen-AI-Theme/e2e/playwright.showcase.config.ts"
      - "src/ui_launchers/Karen-AI-Theme/e2e/showcase/**"
      - "src/ui_launchers/Karen-AI-Theme/public/brand/**"
      - "src/ui_launchers/Karen-AI-Theme/src/app/dashboard/page.tsx"
      - "src/ui_launchers/Karen-AI-Theme/src/app/layout.tsx"
      - "src/ui_launchers/Karen-AI-Theme/src/app/login/page.tsx"
      - "src/ui_launchers/Karen-AI-Theme/src/app/manifest.ts"
      - "src/ui_launchers/Karen-AI-Theme/src/components/automation/AgentsOverviewPage.tsx"
      - "src/ui_launchers/Karen-AI-Theme/src/components/automation/automationStats.ts"
      - "src/ui_launchers/Karen-AI-Theme/src/components/automation/automationStats.test.ts"
      - "src/ui_launchers/Karen-AI-Theme/src/components/comms/CommsCenterPage.tsx"
      - "src/ui_launchers/Karen-AI-Theme/src/components/plugins/PluginOverviewPage.tsx"
      - "tests/architecture/test_main_quality_presentation_contract.py"
      - ".github/workflows/presentation-contract.yml"
      - ".github/workflows/presentation-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: karen-presentation-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presentation-contract:
    name: presentation-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Attest exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prove lightweight presentation authority contracts
        run: |
          python -m py_compile src/ai_karen_engine/api_routes/automation/stats.py
          python - <<'PY'
          import runpy

          namespace = runpy.run_path(
              "tests/architecture/test_main_quality_presentation_contract.py"
          )
          for name, value in sorted(namespace.items()):
              if name.startswith("test_") and callable(value):
                  value()
          PY

      - name: Verify canonical brand and required real-product screenshot provenance
        run: python scripts/ci/verify_presentation_assets.py --require-assets
