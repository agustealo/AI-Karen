name: Ollama Settings Live E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/ci/ollama_settings_live_proof.py"
      - "scripts/ci/ollama_live_cancellation_probe.py"
      - "scripts/ci/verification_strategy_pair_live_proof.py"
      - "scripts/ci/verification_strategy_durable_live_proof.py"
      - "tests/core/runtime/test_verification_strategy_durable_live_proof.py"
      - "scripts/ci/production-first-boot-smoke.sh"
      - "src/ai_karen_engine/api_routes/models/settings.py"
      - "src/ai_karen_engine/api_routes/models/runtime_api.py"
      - "src/ai_karen_engine/core/model_runtime/**"
      - "src/ai_karen_engine/core/runtime/**"
      - "src/ai_karen_engine/core/memory/signals/memory_signal_extractor.py"
      - "tests/core/memory/test_signal_pipeline_async.py"
      - "src/ai_karen_engine/platform/memory/postgres/graph_repository.py"
      - "tests/core/memory/graph/test_postgres_graph_timestamp_contract.py"
      - ".github/workflows/ollama-settings-live-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/ci/ollama_settings_live_proof.py"
      - "scripts/ci/ollama_live_cancellation_probe.py"
      - "scripts/ci/verification_strategy_pair_live_proof.py"
      - "scripts/ci/verification_strategy_durable_live_proof.py"
      - "tests/core/runtime/test_verification_strategy_durable_live_proof.py"
      - "scripts/ci/production-first-boot-smoke.sh"
      - "src/ai_karen_engine/api_routes/models/settings.py"
      - "src/ai_karen_engine/api_routes/models/runtime_api.py"
      - "src/ai_karen_engine/core/model_runtime/**"
      - "src/ai_karen_engine/core/runtime/**"
      - "src/ai_karen_engine/core/memory/signals/memory_signal_extractor.py"
      - "tests/core/memory/test_signal_pipeline_async.py"
      - "src/ai_karen_engine/platform/memory/postgres/graph_repository.py"
      - "tests/core/memory/graph/test_postgres_graph_timestamp_contract.py"
      - ".github/workflows/ollama-settings-live-e2e.yml"

permissions:
  contents: read

concurrency:
  group: ollama-settings-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ollama-settings-live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Instruction-following fixture for full verifier + synthesis; the former
      # 135M model never terminated at 256, 512 or 1024 output tokens.
      # Keep C3D truncation rejection strict instead of inflating budgets.
      OLLAMA_CI_MODEL: qwen2.5:0.5b-instruct-q4_K_M
      OLLAMA_CI_IMAGE: ollama/ollama:latest

    steps:
      - uses: actions/checkout@v4

      - name: Attest exact checkout and compile smoke proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile scripts/ci/ollama_settings_live_proof.py
          python -m py_compile scripts/ci/verification_strategy_pair_live_proof.py
          python -m py_compile scripts/ci/verification_strategy_durable_live_proof.py
          bash -n scripts/ci/production-first-boot-smoke.sh

      # This job builds the full API image *and* runs a model daemon on a
      # temporary GitHub-hosted runner. Preinstalled unrelated SDKs can exhaust
      # the runner during Docker's image export/unpack even when compilation
      # succeeds. Reclaim those disposable runner assets before either stage.
      - name: Reclaim unused hosted runner disk for real-model proof
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          for sdk_path in \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell; do
            if [[ -d "$sdk_path" ]]; then
              sudo rm -rf -- "$sdk_path"
            fi
          done
          docker system prune --all --force --volumes
          df -h /

      - name: Start a real Ollama daemon and install a small model
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name karen-ci-ollama \
            -e OLLAMA_NUM_PARALLEL=2 \
            -p 11434:11434 \
            "$OLLAMA_CI_IMAGE" > /dev/null

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' karen-ci-ollama | grep -q true; then
              docker logs karen-ci-ollama >&2
              exit 1
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs karen-ci-ollama >&2
              exit 1
            fi
            sleep 2
          done

          docker exec karen-ci-ollama ollama pull "$OLLAMA_CI_MODEL"

          curl --fail --silent http://127.0.0.1:11434/api/tags | \
            python -c 'import json,os,sys; models=json.load(sys.stdin)["models"]; wanted=os.environ["OLLAMA_CI_MODEL"]; assert wanted in {m.get("name") for m in models}, "Ollama model pull not visible in native inventory"'

      - name: Install canonical stream probe transport dependency
        run: python -m pip install 'httpx>=0.27,<1'

      - name: KCHAT-SEC-04 prove installed Ollama cancellation, survival and residency recovery
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          mkdir -p build
          python -m py_compile scripts/ci/ollama_live_cancellation_probe.py
          python scripts/ci/ollama_live_cancellation_probe.py \
            --base-url http://127.0.0.1:11434/v1 \
            --model "$OLLAMA_CI_MODEL" \
            --timeout-seconds 120 \
            --report build/kchat-sec-04-real-ollama-cancellation.json

          python - <<'PY'
          import json
          from pathlib import Path

          proof = json.loads(Path("build/kchat-sec-04-real-ollama-cancellation.json").read_text())
          assert proof["scope"] == "actual_local_ollama_model_in_temporary_ci_host"
          assert proof["source"] == "canonical_core_provider_endpoint_and_stream_transport"
          assert proof["installed_model_verified"] is True
          assert proof["warm_terminal_verified"] is True
          assert proof["cancelled_generation_first_delta_observed"] is True
          assert proof["cancelled_stream_terminal_observed"] is False
          assert proof["cancel_to_transport_close_ms"] >= 0
          assert proof["survivor_started_before_cancel"] is True
          assert proof["survivor_terminal_verified"] is True
          assert proof["explicit_native_unload_verified"] is True
          assert proof["cold_reload_terminal_verified"] is True
          assert proof["host_internal_compute_preemption_verified"] is False
          assert proof["release_cause"] == "explicit_native_ollama_unload"
          print("Real Ollama cancellation/recovery evidence validated.")
          PY

      - name: Preserve sanitized Ollama model cancellation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kchat-sec-04-real-ollama-host
          path: build/kchat-sec-04-real-ollama-cancellation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build production API image
        run: |
          docker build --target app --build-arg PROFILE=runtime \
            --build-arg KAREN_DEPLOYED_COMMIT_SHA=${{ github.sha }} \
            -t ai-karen-api:ollama-live .

      - name: Prove production Settings discovery, save and unforced inference
        shell: bash
        env:
          KAREN_SMOKE_API_IMAGE: ai-karen-api:ollama-live
          KAREN_SMOKE_LIVE_MODEL_BASE_URL: http://127.0.0.1:11434/v1
          KAREN_SMOKE_LIVE_MODEL_PROVIDER: ollama-local
          KAREN_SMOKE_LIVE_MODEL_TIMEOUT_SECONDS: "120"
          KAREN_SMOKE_ONLY_OLLAMA_SETTINGS: "true"
          KAREN_SMOKE_DUAL_STRATEGY_LIVE_PROOF: "true"
          KAREN_SMOKE_DURABLE_STRATEGY_LIVE_PROOF: "true"
          KAREN_SMOKE_VERIFIED_DURABLE_STRATEGY_LIVE_PROOF: "true"
        run: |
          set -euo pipefail
          export KAREN_SMOKE_LIVE_MODEL_NAME="$OLLAMA_CI_MODEL"
          bash scripts/ci/production-first-boot-smoke.sh
