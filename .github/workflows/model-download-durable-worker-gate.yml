name: Model Download Durable Worker Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/ai_karen_engine/core/model_runtime/**"
      - "src/ai_karen_engine/persistence/repositories/model_download_repository.py"
      - "src/ai_karen_engine/config/model_download.py"
      - "src/ai_karen_engine/api_routes/models/model_orchestrator.py"
      - "src/ai_karen_engine/server/application_runtime.py"
      - "supabase/migrations/**"
      - "tests/core/model_runtime/test_model_download_control_locking.py"
      - "tests/architecture/test_model_download_durable_worker_authority.py"
      - ".github/workflows/model-download-durable-worker-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-download-durable-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-worker-gate:
    name: durable-worker-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/*.txt

      - name: Install backend quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci/quality.txt

      - name: Compile durable worker surfaces
        run: |
          python -m compileall -q \
            src/ai_karen_engine/config/model_download.py \
            src/ai_karen_engine/persistence/repositories/model_download_repository.py \
            src/ai_karen_engine/core/model_runtime/model_download_control_service.py \
            src/ai_karen_engine/core/model_runtime/model_download_worker.py \
            src/ai_karen_engine/api_routes/models/model_orchestrator.py \
            src/ai_karen_engine/server/application_runtime.py

      - name: Ruff durable worker correctness
        run: |
          ruff check --select E9,F63,F7 \
            src/ai_karen_engine/config/model_download.py \
            src/ai_karen_engine/persistence/repositories/model_download_repository.py \
            src/ai_karen_engine/core/model_runtime/model_download_control_service.py \
            src/ai_karen_engine/core/model_runtime/model_download_worker.py \
            src/ai_karen_engine/api_routes/models/model_orchestrator.py \
            src/ai_karen_engine/server/application_runtime.py \
            tests/core/model_runtime/test_model_download_control_locking.py \
            tests/architecture/test_model_download_durable_worker_authority.py

      - name: Durable ownership architecture proof
        run: pytest tests/architecture/test_model_download_durable_worker_authority.py -q

      - name: Durable lifecycle and promotion behavior proof
        run: pytest tests/core/model_runtime/test_model_download_control_locking.py -q
