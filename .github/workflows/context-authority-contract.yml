name: Context Authority Contract

on:
  pull_request:
    paths:
      - 'server/app.py'
      - 'src/ai_karen_engine/server/application_runtime.py'
      - 'src/ai_karen_engine/core/runtime/**'
      - 'src/ai_karen_engine/core/expression/gateway.py'
      - 'src/ai_karen_engine/core/memory/**'
      - 'src/ai_karen_engine/core/model_runtime/routing/llm_router_service.py'
      - 'src/ai_karen_engine/core/langgraph_orchestrator/**'
      - 'src/ai_karen_engine/utils/chat_helpers.py'
      - 'docs/CONTEXT_RUNTIME_ARCHITECTURE.md'
      - 'tests/architecture/test_application_runtime_composition.py'
      - 'tests/architecture/test_runtime_composition_authority.py'
      - 'tests/architecture/test_context_authority_convergence.py'
      - 'tests/architecture/test_context_langgraph_consumption.py'
      - 'tests/architecture/test_context_memory_boundary_convergence.py'
      - 'tests/architecture/test_context_memory_recall_authority.py'
      - 'tests/architecture/test_context_memory_recall_config.py'
      - '.github/workflows/context-authority-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'server/app.py'
      - 'src/ai_karen_engine/server/application_runtime.py'
      - 'src/ai_karen_engine/core/runtime/**'
      - 'src/ai_karen_engine/core/expression/gateway.py'
      - 'src/ai_karen_engine/core/memory/**'
      - 'src/ai_karen_engine/core/model_runtime/routing/llm_router_service.py'
      - 'src/ai_karen_engine/core/langgraph_orchestrator/**'
      - 'src/ai_karen_engine/utils/chat_helpers.py'
      - 'docs/CONTEXT_RUNTIME_ARCHITECTURE.md'
      - 'tests/architecture/test_application_runtime_composition.py'
      - 'tests/architecture/test_runtime_composition_authority.py'
      - 'tests/architecture/test_context_authority_convergence.py'
      - 'tests/architecture/test_context_langgraph_consumption.py'
      - 'tests/architecture/test_context_memory_boundary_convergence.py'
      - 'tests/architecture/test_context_memory_recall_authority.py'
      - 'tests/architecture/test_context_memory_recall_config.py'
      - '.github/workflows/context-authority-contract.yml'

permissions:
  contents: read

jobs:
  context-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio pydantic pydantic-settings
      - name: Compile context runtime boundary
        run: |
          python -m py_compile \
            src/ai_karen_engine/server/application_runtime.py \
            src/ai_karen_engine/core/runtime/composition.py \
            src/ai_karen_engine/core/runtime/chat_runtime.py \
            src/ai_karen_engine/core/runtime/chat_runtime_control_plane.py \
            src/ai_karen_engine/core/expression/gateway.py \
            src/ai_karen_engine/core/runtime/provider_runtime.py \
            src/ai_karen_engine/core/runtime/prompt/prompt_service.py \
            src/ai_karen_engine/core/runtime/prompt/prompt_assembler.py \
            src/ai_karen_engine/core/runtime/prompt/prompt_registry.py \
            src/ai_karen_engine/core/runtime/prompt/truncation_policy.py \
            src/ai_karen_engine/core/memory/memory_runtime_manager.py \
            src/ai_karen_engine/core/model_runtime/routing/llm_router_service.py \
            src/ai_karen_engine/core/langgraph_orchestrator/contracts/orchestration_config.py \
            src/ai_karen_engine/core/langgraph_orchestrator/context/context_manager_adapter.py \
            src/ai_karen_engine/core/langgraph_orchestrator/context/file_context_store.py \
            src/ai_karen_engine/core/langgraph_orchestrator/context/file_upload_service.py \
            src/ai_karen_engine/core/langgraph_orchestrator/diagnostics.py \
            src/ai_karen_engine/core/langgraph_orchestrator/langgraph_orchestrator.py \
            src/ai_karen_engine/core/langgraph_orchestrator/nodes/memory_fetch.py \
            src/ai_karen_engine/core/langgraph_orchestrator/nodes/response_synth.py \
            server/app.py
      - name: Import file/context boundary
        env:
          PYTHONPATH: src
        run: |
          python -c "from ai_karen_engine.core.langgraph_orchestrator.context.file_upload_service import FileUploadService; from ai_karen_engine.core.langgraph_orchestrator.context.file_context_store import FileContextStore; print(FileUploadService, FileContextStore)"
      - name: Reference audit
        run: |
          test ! -e src/ai_karen_engine/core/langgraph_orchestrator/context/context_manager.py
          test ! -e src/ai_karen_engine/core/memory/memory_service.py
          ! grep -R --line-number --include='*.py' 'ContextManager\|ensure_context_manager' src/ai_karen_engine/core/langgraph_orchestrator
          ! grep -R --line-number --include='*.py' 'WebUIMemoryService\|_resolve_memory_service' src/ai_karen_engine/core/langgraph_orchestrator
          ! grep -R --line-number --include='*.py' 'get_memory_service' src/ai_karen_engine/core/langgraph_orchestrator
          grep -q 'memory_runtime_manager import recall_context' src/ai_karen_engine/core/langgraph_orchestrator/langgraph_orchestrator.py
          grep -q 'memory_recall_top_k=self.config.memory_recall_top_k' src/ai_karen_engine/core/langgraph_orchestrator/langgraph_orchestrator.py
          ! grep -q 'SessionStateManager(' src/ai_karen_engine/core/langgraph_orchestrator/langgraph_orchestrator.py
      - name: Run application runtime lifecycle proof
        env:
          PYTHONPATH: src
        run: pytest tests/architecture/test_application_runtime_composition.py -q
      - name: Run runtime composition authority proof
        env:
          PYTHONPATH: src
        run: pytest tests/architecture/test_runtime_composition_authority.py -q
      - name: Run context authority convergence proof
        env:
          PYTHONPATH: src
        run: |
          pytest \
            tests/architecture/test_context_authority_convergence.py \
            tests/architecture/test_context_langgraph_consumption.py \
            tests/architecture/test_context_memory_boundary_convergence.py \
            tests/architecture/test_context_memory_recall_authority.py \
            tests/architecture/test_context_memory_recall_config.py \
            -q
