name: LoRA Real Worker Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-lora-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/runtime-contract.txt
      - name: Install governed training dependencies
        run: |
          python -m pip install -r requirements/ci/runtime-contract.txt
          python -m pip install -r requirements/training-peft.txt
          python -m pip install pytest pytest-asyncio scikit-learn joblib tokenizers
          python -m pip check
          python -c "import torch, transformers, peft, accelerate, safetensors, tokenizers"
      - name: Train real locally constructed LoRA adapter
        run: pytest tests/core/intelligence/test_lora_real_worker_acceptance.py -q -rs
