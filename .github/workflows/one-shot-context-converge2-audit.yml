name: One-shot Context Converge-2 Audit

on:
  push:
    branches:
      - context/converge-2-memory-boundary

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run context converge-2 census
        run: python scripts/audit_context_converge2.py
