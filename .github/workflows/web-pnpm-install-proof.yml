name: Web pnpm 11 Build Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ui_launchers/Karen-AI-Theme/package.json'
      - 'src/ui_launchers/Karen-AI-Theme/next.config.ts'
      - 'src/ui_launchers/Karen-AI-Theme/src/lib/chat-response.ts'
      - 'src/ui_launchers/Karen-AI-Theme/tests/chat-response.test.ts'
      - 'src/ui_launchers/Karen-AI-Theme/package-lock.json'
      - 'src/ui_launchers/Karen-AI-Theme/pnpm-workspace.yaml'
      - '.github/workflows/web-pnpm-install-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-native-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activate user-reported pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm --version
      - name: Import committed npm lock into ephemeral pnpm workspace
        run: pnpm import
      - name: Install dependencies with strict native build approval
        run: pnpm install --frozen-lockfile
      - name: Verify pnpm install completed without ignored build failures
        run: |
          pnpm exec next --version
          pnpm exec tsc --version
      - name: Verify real chat recovery presentation tests
        run: pnpm exec vitest run tests/chat-response.test.ts
      - name: Build actual Next.js application with pnpm
        run: pnpm exec next build
