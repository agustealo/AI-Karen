name: One-time stale contained-branch prune

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-stale-contained-branch-prune.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-stale-contained-branch-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Audit and delete only proven redundant branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fullName = owner + '/' + repo;
            const graceDays = 7;
            const threshold = Date.now() - graceDays * 24 * 60 * 60 * 1000;
            const reserved = new Set(['main', 'master', 'develop', 'development', 'staging', 'production']);
            const reservedPrefixes = ['release/', 'hotfix/', 'staging/', 'production/'];
            const defaultBranch = (await github.rest.repos.get({ owner, repo })).data.default_branch;
            reserved.add(defaultBranch);
            const [branches, allPrs] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 }),
              github.paginate(github.rest.pulls.list, { owner, repo, state: 'all', per_page: 100 }),
            ]);
            const branchPrs = new Map();
            for (const pr of allPrs) {
              if (pr.head?.repo?.full_name !== fullName || !pr.head.ref) continue;
              const associated = branchPrs.get(pr.head.ref) ?? [];
              associated.push(pr);
              branchPrs.set(pr.head.ref, associated);
            }
            const deleted = [], withheld = [], failed = [];
            for (const candidate of branches) {
              const name = candidate.name;
              if (candidate.protected || reserved.has(name) || reservedPrefixes.some(p => name.startsWith(p))) {
                withheld.push({ branch: name, reason: 'protected_or_reserved' });
                continue;
              }
              const associated = branchPrs.get(name) ?? [];
              if (associated.some(pr => pr.state === 'open')) {
                withheld.push({ branch: name, reason: 'open_pull_request' });
                continue;
              }
              let reason = null, audit = {};
              const exactMerged = associated.find(pr =>
                pr.merged_at &&
                pr.head.sha === candidate.commit.sha &&
                pr.base?.repo?.full_name === fullName);
              if (exactMerged) {
                reason = 'exact_head_merged_pr';
                audit = { merged_pr: exactMerged.number };
              } else {
                try {
                  const comparison = (await github.rest.repos.compareCommits({
                    owner, repo, base: defaultBranch, head: candidate.commit.sha, per_page: 1,
                  })).data;
                  audit = { ahead_by: comparison.ahead_by, behind_by: comparison.behind_by, status: comparison.status };
                  if (comparison.ahead_by !== 0) {
                    withheld.push({ branch: name, reason: 'unique_commit_history', ...audit });
                    continue;
                  }
                  if (comparison.behind_by < 20) {
                    withheld.push({ branch: name, reason: 'possibly_active_recent_base', ...audit });
                    continue;
                  }
                  const commit = (await github.rest.repos.getCommit({ owner, repo, ref: candidate.commit.sha })).data;
                  const committedAt = commit.commit?.committer?.date || commit.commit?.author?.date;
                  if (!committedAt || new Date(committedAt).getTime() > threshold) {
                    withheld.push({ branch: name, reason: 'young_or_unverifiable_tip', committed_at: committedAt ?? null, ...audit });
                    continue;
                  }
                  reason = 'stale_fully_ancestor_of_main';
                  audit.committed_at = committedAt;
                } catch (error) {
                  failed.push({ branch: name, stage: 'history_check', status: error.status ?? null, message: error.message });
                  continue;
                }
              }
              try {
                const fresh = (await github.rest.repos.getBranch({ owner, repo, branch: name })).data;
                if (fresh.protected || fresh.commit.sha !== candidate.commit.sha) {
                  withheld.push({ branch: name, reason: 'head_changed_or_newly_protected' });
                  continue;
                }
                const freshOpen = await github.rest.pulls.list({
                  owner, repo, state: 'open', head: owner + ':' + name, per_page: 100,
                });
                if (freshOpen.data.length) {
                  withheld.push({ branch: name, reason: 'newly_open_pull_request' });
                  continue;
                }
                await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + name });
                deleted.push({ branch: name, head_sha: candidate.commit.sha, reason, ...audit });
              } catch (error) {
                failed.push({ branch: name, stage: 'delete', status: error.status ?? null, message: error.message });
              }
            }
            const report = {
              repository: fullName, default_branch: defaultBranch, grace_days: graceDays,
              examined_branches: branches.length, examined_prs: allPrs.length,
              deleted_count: deleted.length, withheld_count: withheld.length, failed_count: failed.length,
              deleted, withheld, failed,
            };
            require('fs').writeFileSync('stale-contained-branch-prune-report.json', JSON.stringify(report, null, 2));
            core.info(JSON.stringify({ examined: branches.length, deleted: deleted.length, withheld: withheld.length, failed: failed.length }));
            await core.summary.addHeading('Stale contained-branch pruning')
              .addTable([
                [{ data: 'Measure', header: true }, { data: 'Count', header: true }],
                ['Branches examined', String(branches.length)],
                ['Deleted with proof', String(deleted.length)],
                ['Preserved or uncertain', String(withheld.length)],
                ['Failures', String(failed.length)]
              ]).write();
            if (failed.length) core.setFailed('One or more branches could not be verified or deleted. See audit artifact.');
      - name: Upload full branch audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-contained-branch-prune-audit
          path: stale-contained-branch-prune-report.json
          if-no-files-found: warn
          retention-days: 30
