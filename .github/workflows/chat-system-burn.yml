name: Chat System Burn

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-system-burn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-system-burn:
    name: chat-system-burn
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      CHAT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ai_karen

    steps:
      - uses: actions/checkout@v4
      - name: Start authenticated canonical PostgreSQL service
        env:
          KAREN_CI_DOCKERHUB_USERNAME: ${{ secrets.KAREN_CI_DOCKERHUB_USERNAME }}
          KAREN_CI_DOCKERHUB_TOKEN: ${{ secrets.KAREN_CI_DOCKERHUB_TOKEN }}
          KAREN_CI_POSTGRES_IMAGE: ${{ vars.KAREN_CI_POSTGRES_IMAGE || 'pgvector/pgvector:pg16' }}
        run: bash scripts/ci/start-postgres-container.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/*.txt

      - name: Install chat burn dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci/chat.txt

      - name: Compile chat authority surfaces
        run: |
          python -m compileall -q \
            src/ai_karen_engine/core/runtime \
            src/ai_karen_engine/core/cortex \
            src/ai_karen_engine/core/expression \
            src/ai_karen_engine/api_routes/chat

      - name: Verify conversational name and output hygiene contracts
        run: pytest tests/core/runtime/test_name_response_prompt_contract.py tests/core/runtime/test_conversational_output_hygiene.py -q

      - name: Prove personal recall intent invariance under emotional phrasing
        run: pytest tests/core/cortex/test_personal_recall_nuance_normalization.py tests/core/cortex/test_personal_recall_degraded_routing.py -q

      - name: Verify volunteered personal fact acknowledgment contract
        run: pytest tests/core/runtime/test_volunteered_fact_acknowledgment.py -q

      - name: Prove personal recall search query invariance
        run: pytest tests/core/runtime/test_personal_memory_retrieval_query.py -q

      - name: Verify conversation reference resolution
        run: pytest tests/core/runtime/test_discourse_profile_reference.py -q

      - name: Run chat architecture contract
        run: pytest src/ai_karen_engine/api_routes/chat/tests/test_chat_runtime_contract.py -q

      - name: Run chat runtime adversarial burn
        run: |
          set -o pipefail
          pytest src/ai_karen_engine/api_routes/chat/tests/test_chat_runtime_burn_contract.py -vv 2>&1 | tee chat-runtime-adversarial-burn.log

      - name: Upload adversarial burn diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-runtime-adversarial-burn
          path: chat-runtime-adversarial-burn.log
          if-no-files-found: ignore

      - name: Run chat concurrency burn
        run: pytest src/ai_karen_engine/api_routes/chat/tests/test_chat_runtime_concurrency_burn.py -q

      - name: Run durable transcript continuity and tenant isolation proof
        run: pytest tests/integration/test_chat_transcript_continuity.py -q

      - name: Burn canonical transcript isolation against real PostgreSQL
        run: pytest tests/integration/test_chat_transcript_postgres_isolation.py -q

      - name: Run provider authority contract
        run: pytest tests/architecture/test_provider_chat_authority.py -q

      - name: Run CORTEX authority contract
        run: pytest tests/architecture/test_cortex_intelligence_authority.py -q

      - name: Run authenticated tenant contract
        run: |
          set -o pipefail
          pytest tests/architecture/test_authenticated_tenant_context_contract.py -vv 2>&1 | tee authenticated-tenant-contract.log

      - name: Upload tenant contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-tenant-contract
          path: authenticated-tenant-contract.log
          if-no-files-found: ignore
