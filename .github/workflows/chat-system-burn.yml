name: Chat System Burn

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/ai_karen_engine/api_routes/chat/**"
      - "src/ai_karen_engine/core/runtime/**"
      - "src/ai_karen_engine/core/cortex/**"
      - "src/ai_karen_engine/core/memory/**"
      - "src/ai_karen_engine/core/intelligence/**"
      - "src/ai_karen_engine/core/model_runtime/**"
      - "src/ai_karen_engine/core/langgraph_orchestrator/**"
      - "src/ai_karen_engine/platform/memory/**"
      - "src/ai_karen_engine/persistence/**"
      - "src/ai_karen_engine/auth/**"
      - "src/ai_karen_engine/services/auth/**"
      - "src/ai_karen_engine/api_routes/auth/**"
      - "src/ui_launchers/Karen-AI-Theme/src/components/chat/**"
      - "src/ui_launchers/Karen-AI-Theme/src/lib/chat-response.ts"
      - "tests/core/runtime/**"
      - "tests/core/cortex/**"
      - "tests/core/memory/**"
      - "tests/core/intelligence/**"
      - "tests/platform/memory/**"
      - "tests/api_routes/test_profile_correction_ingress.py"
      - "tests/architecture/test_*chat*.py"
      - "tests/architecture/test_*stream*.py"
      - "tests/architecture/test_*response*.py"
      - "tests/architecture/test_*tenant*.py"
      - "tests/architecture/test_*langgraph*.py"
      - "tests/integration/test_chat_*.py"
      - "scripts/ci/start-postgres-container.sh"
      - "requirements/ci/chat.txt"
      - ".github/workflows/chat-system-burn.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-system-burn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-system-burn:
    name: chat-system-burn
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      CHAT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ai_karen

    steps:
      - uses: actions/checkout@v4
      - name: Start authenticated canonical PostgreSQL service
        env:
          KAREN_CI_DOCKERHUB_USERNAME: ${{ secrets.KAREN_CI_DOCKERHUB_USERNAME }}
          KAREN_CI_DOCKERHUB_TOKEN: ${{ secrets.KAREN_CI_DOCKERHUB_TOKEN }}
          KAREN_CI_POSTGRES_IMAGE: ${{ vars.KAREN_CI_POSTGRES_IMAGE || 'pgvector/pgvector:pg16' }}
        run: bash scripts/ci/start-postgres-container.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/*.txt

      - name: Install chat burn dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci/chat.txt

      - name: Compile chat authority surfaces
        run: |
          python -m compileall -q \
            src/ai_karen_engine/core/runtime \
            src/ai_karen_engine/core/cortex \
            src/ai_karen_engine/core/expression \
            src/ai_karen_engine/api_routes/chat

      - name: Verify conversational name and output hygiene contracts
        run: pytest tests/core/runtime/test_name_response_prompt_contract.py tests/core/runtime/test_conversational_output_hygiene.py -q

      - name: Prove personal recall intent invariance under emotional phrasing
        run: pytest tests/core/cortex/test_personal_recall_nuance_normalization.py tests/core/cortex/test_personal_recall_degraded_routing.py -q

      - name: Verify volunteered personal fact acknowledgment contract
        run: pytest tests/core/runtime/test_volunteered_fact_acknowledgment.py -q

      - name: Prove personal recall search query invariance
        run: pytest tests/core/runtime/test_personal_memory_retrieval_query.py -q

      - name: Verify conversation reference resolution
        run: pytest tests/core/runtime/test_discourse_profile_reference.py -q

      - name: Burn generic personal preference formation and queries
        run: pytest tests/core/memory/test_generic_favorite_semantics.py tests/core/memory/test_favorite_color_memory_classification.py tests/core/intelligence/test_profile_attribute_interpretation.py tests/core/memory/test_semantic_memory_classifier.py tests/core/memory/test_open_personal_relation_semantics.py -q

      - name: Prove model-generated memory candidate evidence boundary
        run: pytest tests/core/intelligence/test_model_memory_candidate_evidence.py -q

      - name: Burn governed belief-state projection contract
        run: pytest tests/core/memory/test_belief_resolution.py tests/core/memory/test_profile_belief_projection.py tests/core/memory/test_profile_projection_identity.py -q

      - name: Prove authenticated correction ingress preserves user evidence
        run: pytest tests/api_routes/test_profile_correction_ingress.py tests/platform/memory/test_semantic_user_state_projection.py -q

      - name: Burn authorized conversation personal-fact grounding
        run: pytest tests/core/runtime/test_conversation_personal_sufficiency.py -q

      - name: Burn durable memory write-read truth and scope binding
        run: pytest tests/core/runtime/test_memory_write_recall_truth.py -q

      - name: Burn trusted SET cardinality and scoped personal recall
        run: pytest tests/core/runtime/test_personal_evidence_cardinality.py tests/core/runtime/test_runtime_evidence_resolution.py -q

      - name: Prove CORTEX governed contextual personal query semantics
        run: pytest tests/core/runtime/test_governed_profile_query_scope.py tests/core/intelligence/test_profile_attribute_interpretation.py -q

      - name: Verify upbringing and inverted name recall
        run: pytest tests/core/runtime/test_upbringing_and_inverted_name_recall.py -q

      - name: Verify profile summaries and upbringing intent
        run: pytest tests/core/runtime/test_profile_summary_and_upbringing_intent.py -q

      - name: Verify upbringing routing and no fabricated biography
        run: pytest tests/core/cortex/test_personal_recall_degraded_routing.py tests/core/runtime/test_evidence_sufficiency.py -q

      - name: Verify canonical chat ingress and grounded response parity
        run: pytest tests/architecture/test_chat_stream_route_contract.py -q

      - name: Burn empty and prematurely terminated chat SSE failures
        run: |
          # These targeted stream regressions have isolated runtime doubles.
          # Legacy tests in the same file require a separate DB-backed gate.
          pytest tests/core/runtime/test_chat_runtime_stream_contract.py -k "status_only_stream or upstream_stream_error or whitespace_only_assistant_stream or partial_content_then_error" -q
          pytest tests/core/runtime/test_chat_sse_error_contract.py tests/architecture/test_stream_error_diagnostic_contract.py -q

      - name: Verify personal recall execution provenance
        run: pytest tests/core/runtime/test_personal_recall_provenance_metadata.py -q

      - name: Verify consumer recall provenance visibility
        run: pytest tests/architecture/test_chat_ui_recall_provenance.py -q

      - name: Verify response lifecycle ownership boundaries
        run: pytest tests/architecture/test_response_lifecycle_ownership_contract.py -q

      - name: Verify authorized identity summary synthesis
        run: pytest tests/core/runtime/test_grounded_response_composer.py -q

      - name: Verify LangGraph response policy ownership
        run: pytest tests/architecture/test_langgraph_response_policy_authority.py -q

      - name: Run chat architecture contract
        run: pytest src/ai_karen_engine/api_routes/chat/tests/test_chat_runtime_contract.py -q

      - name: Run chat runtime adversarial burn
        run: |
          set -o pipefail
          pytest src/ai_karen_engine/api_routes/chat/tests/test_chat_runtime_burn_contract.py -vv 2>&1 | tee chat-runtime-adversarial-burn.log

      - name: Upload adversarial burn diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-runtime-adversarial-burn
          path: chat-runtime-adversarial-burn.log
          if-no-files-found: ignore

      - name: Run chat concurrency burn
        run: pytest src/ai_karen_engine/api_routes/chat/tests/test_chat_runtime_concurrency_burn.py -q

      - name: Run durable transcript continuity and tenant isolation proof
        run: pytest tests/integration/test_chat_transcript_continuity.py -q

      - name: Burn canonical transcript isolation against real PostgreSQL
        run: pytest tests/integration/test_chat_transcript_postgres_isolation.py -q

      - name: Run provider authority contract
        run: pytest tests/architecture/test_provider_chat_authority.py -q

      - name: Run CORTEX authority contract
        run: pytest tests/architecture/test_cortex_intelligence_authority.py -q

      - name: Run authenticated tenant contract
        run: |
          set -o pipefail
          pytest tests/architecture/test_authenticated_tenant_context_contract.py -vv 2>&1 | tee authenticated-tenant-contract.log

      - name: Upload tenant contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-tenant-contract
          path: authenticated-tenant-contract.log
          if-no-files-found: ignore
