name: One-shot Monitoring Metrics Import Closure

on:
  push:
    branches:
      - prod/auth-session-validation-closure
    paths:
      - .github/workflows/one-shot-monitoring-metrics-import-closure.yml

permissions:
  contents: write

jobs:
  restore-and-repoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/auth-session-validation-closure
          fetch-depth: 0

      - name: Restore collector behavior and repoint canonical metrics owner
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import subprocess

          paths = [
              "src/ai_karen_engine/monitoring/validation_metrics.py",
              "src/ai_karen_engine/monitoring/model_orchestrator_metrics.py",
          ]
          old = "from ai_karen_engine.core.observability.metrics import get_metrics_manager"
          new = "from ai_karen_engine.monitoring.prometheus_registry import get_metrics_manager"

          for item in paths:
              source = subprocess.check_output(
                  ["git", "show", f"origin/main:{item}"],
                  text=True,
              )
              if old not in source:
                  raise SystemExit(f"retired metrics import not found in {item}")
              Path(item).write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Compile restored monitoring collectors
        run: |
          python -m compileall -q \
            src/ai_karen_engine/monitoring/prometheus_registry.py \
            src/ai_karen_engine/monitoring/validation_metrics.py \
            src/ai_karen_engine/monitoring/model_orchestrator_metrics.py

      - name: Commit exact import closure and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-monitoring-metrics-import-closure.yml
          git add src/ai_karen_engine/monitoring/validation_metrics.py src/ai_karen_engine/monitoring/model_orchestrator_metrics.py
          git commit -m "cleanup(monitoring): repoint retired metrics manager imports"
          git push origin HEAD:prod/auth-session-validation-closure
