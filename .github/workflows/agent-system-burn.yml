name: Agent System Burn

on:
  push:
    branches: [main]
    paths:
      - 'src/ai_karen_engine/agent_medusa/**'
      - 'src/ai_karen_engine/core/runtime/**'
      - 'tests/agent_medusa/**'
      - '.github/workflows/agent-system-burn.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/ai_karen_engine/agent_medusa/**'
      - 'src/ai_karen_engine/core/runtime/**'
      - 'tests/agent_medusa/**'
      - '.github/workflows/agent-system-burn.yml'

permissions:
  contents: read

jobs:
  burn:
    name: Burn canonical agent boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Compile agent runtime
        run: |
          python -m compileall src/ai_karen_engine/agent_medusa src/ai_karen_engine/core/runtime

      - name: Burn LangGraph to Medusa boundary
        run: |
          pytest tests/agent_medusa/test_langgraph_medusa_boundary.py -q --timeout=60

      - name: Burn Medusa execution authority
        run: |
          pytest \
            tests/agent_medusa/test_execution_consistency.py \
            tests/agent_medusa/test_run_manager.py \
            tests/agent_medusa/test_distributed_run_authority.py \
            -q --timeout=120

      - name: Burn durable history authority
        run: |
          pytest tests/agent_medusa/test_durable_run_ledger.py -q --timeout=120

      - name: Reject legacy tenant sentinels at the LangGraph boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          node = Path('src/ai_karen_engine/agent_medusa/agent_medusa_node.py').read_text()
          forbidden = [
              'tenant_id=state.get("tenant_id", "default")',
              'tenant_id=state.get("tenant_id", \'default\')',
          ]
          hits = [pattern for pattern in forbidden if pattern in node]
          if hits:
              raise SystemExit(f'legacy tenant fallback returned: {hits}')
          print('explicit tenant boundary verified')
          PY
