name: Temporary AG-UI Lockfile Repair
on:
  workflow_dispatch:
  push:
    branches:
      - feat/kchat-agui-native-event-bridge-20261018
    paths:
      - .github/workflows/temporary-agui-lockfile-repair.yml
permissions:
  contents: write
jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kchat-agui-native-event-bridge-20261018
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update only the frontend dependency lockfile
        working-directory: src/ui_launchers/Karen-AI-Theme
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Commit lockfile repair on existing PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui_launchers/Karen-AI-Theme/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already synchronized"
          else
            git commit -m "fix(chat): synchronize AG-UI dependencies with reproducible lockfile"
            git push origin HEAD:feat/kchat-agui-native-event-bridge-20261018
          fi
