name: Personal Planner PostgreSQL Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ai_karen_engine/core/planner/**"
      - "src/ai_karen_engine/persistence/repositories/personal_planner_repository.py"
      - "src/ai_karen_engine/persistence/postgres/**"
      - "tests/core/planner/**"
      - "tests/integration/test_live_personal_planner_postgres.py"
      - "supabase/migrations/20261020010000_38_personal_planner_commitments.sql"
      - ".github/workflows/personal-planner-postgres-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planner-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_karen
      KAREN_TEST_PLANNER_POSTGRES: "1"
      KAREN_TEST_DISPOSABLE_DATABASE: "1"
      KAREN_TEST_PLANNER_TENANT_ID: "a0000000-0000-4000-8000-000000000001"
      KAREN_TEST_PLANNER_USER_ID: "b0000000-0000-4000-8000-000000000001"
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostgreSQL
        env:
          KAREN_CI_DOCKERHUB_USERNAME: ${{ secrets.KAREN_CI_DOCKERHUB_USERNAME }}
          KAREN_CI_DOCKERHUB_TOKEN: ${{ secrets.KAREN_CI_DOCKERHUB_TOKEN }}
          KAREN_CI_POSTGRES_IMAGE: ${{ vars.KAREN_CI_POSTGRES_IMAGE || 'pgvector/pgvector:pg16' }}
        run: bash scripts/ci/start-postgres-container.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/*.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci/chat.txt
      - name: Apply planner migration on disposable database
        run: |
          python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          import asyncpg

          async def main():
              db = await asyncpg.connect(os.environ["DATABASE_URL"])
              try:
                  if await db.fetchval("SELECT to_regclass('public.personal_planner_commitments') IS NOT NULL"):
                      raise RuntimeError("Planner tables already exist: refusing to run destructive fixture")
                  # Minimal external foreign-key targets only in this disposable
                  # database. Application databases must use baseline migrations.
                  await db.execute("CREATE TABLE public.tenants (id uuid PRIMARY KEY)")
                  await db.execute("CREATE TABLE public.auth_users (user_id uuid PRIMARY KEY)")
                  await db.execute("INSERT INTO public.tenants VALUES ($1::uuid)", os.environ["KAREN_TEST_PLANNER_TENANT_ID"])
                  await db.execute("INSERT INTO public.auth_users VALUES ($1::uuid)", os.environ["KAREN_TEST_PLANNER_USER_ID"])
                  await db.execute(Path("supabase/migrations/20261020010000_38_personal_planner_commitments.sql").read_text())
                  policies = await db.fetch("""
                      SELECT tablename, policyname FROM pg_policies
                      WHERE schemaname='public' AND tablename LIKE 'personal_planner_%'
                  """)
                  assert len(policies) == 2, policies
              finally:
                  await db.close()

          asyncio.run(main())
          PY
      - name: Verify real PostgreSQL planner behavior
        run: pytest tests/core/planner tests/integration/test_live_personal_planner_postgres.py -q -rs
