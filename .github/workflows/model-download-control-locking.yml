name: Model Download Durable Worker Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/ai_karen_engine/core/model_runtime/**"
      - "src/ai_karen_engine/core/intelligence/**"
      - "src/ai_karen_engine/api_routes/models/**"
      - "src/ai_karen_engine/services/model_download/**"
      - "src/ai_karen_engine/services/model_management/**"
      - "src/ai_karen_engine/persistence/**"
      - "scripts/ci/start-postgres-container.sh"
      - "tests/integration/test_model_download_*.py"
      - "tests/integration/test_recommended_model_live_source.py"
      - "tests/core/model_runtime/**"
      - "requirements/ci/**"
      - ".github/workflows/model-download-control-locking.yml"
  push:
    branches:
      - main
    paths:
      - "src/ai_karen_engine/core/model_runtime/**"
      - "src/ai_karen_engine/core/intelligence/**"
      - "src/ai_karen_engine/api_routes/models/**"
      - "src/ai_karen_engine/services/model_download/**"
      - "src/ai_karen_engine/services/model_management/**"
      - "src/ai_karen_engine/persistence/**"
      - "scripts/ci/start-postgres-container.sh"
      - "tests/integration/test_model_download_*.py"
      - "tests/integration/test_recommended_model_live_source.py"
      - "tests/core/model_runtime/**"
      - "requirements/ci/**"
      - ".github/workflows/model-download-control-locking.yml"
  workflow_dispatch:
    inputs:
      verify_recommended_model_sources:
        description: "Contact Hugging Face for real recommended-model license and revision metadata"
        type: boolean
        required: true
        default: false
      verify_spacy_artifacts:
        description: "Download and execute real spaCy linguistic pipeline (network required)"
        type: boolean
        required: true
        default: false
      verify_distilbert_artifacts:
        description: "Download DistilBERT and execute real local embeddings (network, disk and RAM required)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: model-download-durable-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-download-durable-worker:
    name: model-download-durable-worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_karen
      MODEL_DOWNLOAD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_karen

    steps:
      - uses: actions/checkout@v4
      - name: Start authenticated canonical PostgreSQL service
        env:
          KAREN_CI_DOCKERHUB_USERNAME: ${{ secrets.KAREN_CI_DOCKERHUB_USERNAME }}
          KAREN_CI_DOCKERHUB_TOKEN: ${{ secrets.KAREN_CI_DOCKERHUB_TOKEN }}
          KAREN_CI_POSTGRES_IMAGE: ${{ vars.KAREN_CI_POSTGRES_IMAGE || 'pgvector/pgvector:pg16' }}
        run: bash scripts/ci/start-postgres-container.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/*.txt

      - name: Install runtime proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci/quality.txt

      - name: Verify real recommended model sources when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_recommended_model_sources }}
        env:
          KAREN_LIVE_MODEL_SOURCE_PROOF: "1"
        run: |
          python -m pip install huggingface_hub
          pytest tests/integration/test_recommended_model_live_source.py -q

      - name: Prove real spaCy download and linguistic analysis when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_spacy_artifacts }}
        timeout-minutes: 10
        env:
          KAREN_LIVE_MODEL_SOURCE_PROOF: "1"
          KAREN_LIVE_SPACY_ARTIFACT_PROOF: "1"
        run: |
          python -m pip install huggingface_hub spacy
          pytest tests/integration/test_recommended_model_live_source.py -q -k spacy_live_download_registry_and_linguistic_inference

      - name: Prove real DistilBERT download and embeddings when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_distilbert_artifacts }}
        timeout-minutes: 15
        env:
          KAREN_LIVE_MODEL_SOURCE_PROOF: "1"
          KAREN_LIVE_DISTILBERT_ARTIFACT_PROOF: "1"
        run: |
          python -m pip install huggingface_hub torch transformers numpy
          pytest tests/integration/test_recommended_model_live_source.py -q -k distilbert_live_pinned_download_and_nonfallback_encoding

      - name: Compile durable model download authority
        run: |
          python -m compileall -q \
            src/ai_karen_engine/config/model_download.py \
            src/ai_karen_engine/persistence/repositories/model_download_repository.py \
            src/ai_karen_engine/core/model_runtime/management/model_orchestrator_service.py \
            src/ai_karen_engine/core/model_runtime/model_download_publication_recovery.py \
            src/ai_karen_engine/core/model_runtime/model_download_control_service.py \
            src/ai_karen_engine/core/model_runtime/model_download_worker.py \
            src/ai_karen_engine/api_routes/models/model_orchestrator.py \
            src/ai_karen_engine/server/application_runtime.py \
            tests/core/model_runtime/test_model_orchestrator_registry_durability.py \
            tests/core/model_runtime/test_model_download_publication_recovery.py \
            tests/core/model_runtime/test_model_download_recovery_fail_closed.py \
            tests/integration/test_model_download_requested_state_leases.py \
            tests/integration/test_model_download_target_exclusivity.py \
            tests/integration/test_model_download_publication_recovery.py \
            tests/architecture/test_model_download_publication_recovery_authority.py

      - name: Ruff durable worker correctness
        run: |
          ruff check --select E9,F63,F7 \
            src/ai_karen_engine/config/model_download.py \
            src/ai_karen_engine/persistence/repositories/model_download_repository.py \
            src/ai_karen_engine/core/model_runtime/management/model_orchestrator_service.py \
            src/ai_karen_engine/core/model_runtime/model_download_publication_recovery.py \
            src/ai_karen_engine/core/model_runtime/model_download_control_service.py \
            src/ai_karen_engine/core/model_runtime/model_download_worker.py \
            src/ai_karen_engine/api_routes/models/model_orchestrator.py \
            src/ai_karen_engine/server/application_runtime.py \
            tests/core/model_runtime/test_model_orchestrator_registry_durability.py \
            tests/core/model_runtime/test_model_download_durable_worker.py \
            tests/core/model_runtime/test_model_download_worker_cancellation.py \
            tests/core/model_runtime/test_model_download_publication_recovery.py \
            tests/core/model_runtime/test_model_download_recovery_fail_closed.py \
            tests/integration/test_model_download_requested_state_leases.py \
            tests/integration/test_model_download_target_exclusivity.py \
            tests/integration/test_model_download_publication_recovery.py \
            tests/architecture/test_model_download_durable_worker_authority.py \
            tests/architecture/test_model_download_publication_recovery_authority.py

      - name: Prove durable authority boundaries
        run: |
          pytest \
            tests/architecture/test_model_download_durable_worker_authority.py \
            tests/architecture/test_model_download_publication_recovery_authority.py \
            -q

      - name: Prove durable lifecycle staged publication recovery and registry persistence
        run: |
          pytest \
            tests/core/model_runtime/test_model_orchestrator_registry_durability.py \
            tests/core/model_runtime/test_model_download_durable_worker.py \
            tests/core/model_runtime/test_model_download_worker_cancellation.py \
            tests/core/model_runtime/test_model_download_publication_recovery.py \
            tests/core/model_runtime/test_model_download_recovery_fail_closed.py \
            -q

      - name: Apply model download authority migrations
        run: |
          psql "$MODEL_DOWNLOAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260924010000_17_model_download_job_authority.sql
          psql "$MODEL_DOWNLOAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260924195000_18_model_download_requested_state_leases.sql
          psql "$MODEL_DOWNLOAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260925013000_19_model_download_publication_recovery_identity.sql

      - name: Prove requested-state lease accounting in PostgreSQL
        run: pytest tests/integration/test_model_download_requested_state_leases.py -q

      - name: Prove install-target exclusivity in PostgreSQL
        run: pytest tests/integration/test_model_download_target_exclusivity.py -q

      - name: Prove interrupted publication recovery in PostgreSQL
        run: pytest tests/integration/test_model_download_publication_recovery.py -q
