name: One-shot DB Baseline Runtime Closure

on:
  push:
    branches: [db/baseline-1-production-schema]
    paths:
      - "scripts/dev/remove_extension_schema_helpers.py"
      - ".github/workflows/one-shot-db-baseline-runtime-closure.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove extension schema mutation helpers
        run: python scripts/dev/remove_extension_schema_helpers.py
      - name: Compile extension models
        run: python -m py_compile src/ai_karen_engine/extensions/platform/core/integration/models.py
      - name: Prove runtime DDL is absent
        run: |
          ! grep -R "metadata.create_all\|metadata.drop_all" -n src/ai_karen_engine/database src/ai_karen_engine/services/auth src/ai_karen_engine/services/identity_vault src/ai_karen_engine/extensions/platform/core/integration --include='*.py'
          ! grep -R "create_extension_tables\|drop_extension_tables" -n src tests server --include='*.py'
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_karen_engine/extensions/platform/core/integration/models.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(db): remove extension runtime schema helpers"
          git push origin HEAD:db/baseline-1-production-schema
