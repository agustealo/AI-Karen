name: Beta Provider Wiring Contract

on:
  push:
    paths:
      - "src/ai_karen_engine/core/expression/**"
      - "src/ai_karen_engine/core/model_runtime/provider_endpoint.py"
      - "src/ai_karen_engine/core/model_runtime/provider_execution.py"
      - "src/ai_karen_engine/core/model_runtime/provider_policy.py"
      - "src/ai_karen_engine/core/model_runtime/provider_registry_service.py"
      - "tests/beta/**"
      - "tests/architecture/test_core_ai_machine_isolation.py"
      - ".github/workflows/beta-real-model-proof.yml"
  pull_request:
    paths:
      - "src/ai_karen_engine/core/expression/**"
      - "src/ai_karen_engine/core/model_runtime/provider_endpoint.py"
      - "src/ai_karen_engine/core/model_runtime/provider_execution.py"
      - "src/ai_karen_engine/core/model_runtime/provider_policy.py"
      - "src/ai_karen_engine/core/model_runtime/provider_registry_service.py"
      - "tests/beta/**"
      - "tests/architecture/test_core_ai_machine_isolation.py"
      - ".github/workflows/beta-real-model-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-provider-wiring-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install proof dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio

      - name: Compile canonical provider spine
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile \
            src/ai_karen_engine/core/expression/contracts.py \
            src/ai_karen_engine/core/expression/errors.py \
            src/ai_karen_engine/core/expression/engines/openai_compatible_engine.py \
            src/ai_karen_engine/core/model_runtime/provider_contracts.py \
            src/ai_karen_engine/core/model_runtime/provider_endpoint.py \
            src/ai_karen_engine/core/model_runtime/provider_execution.py \
            src/ai_karen_engine/core/model_runtime/provider_policy.py \
            src/ai_karen_engine/core/model_runtime/openai_compatible_client.py \
            src/ai_karen_engine/core/model_runtime/inference_port.py \
            src/ai_karen_engine/core/model_runtime/model_manager.py \
            src/ai_karen_engine/core/runtime/session_state_port.py \
            src/ai_karen_engine/core/runtime/degraded_mode.py

      - name: Prove Core AI Machine isolation
        env:
          PYTHONPATH: src
        run: pytest tests/architecture/test_core_ai_machine_isolation.py -q

      - name: Run beta provider wiring contract
        env:
          PYTHONPATH: src
        run: pytest tests/beta/test_real_model_wiring.py -q

      - name: Reject retired builtin vLLM authority in Python runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          refs=$(grep -R --line-number --include='*.py' \
            -E 'preferred_provider=["'"']builtin_vllm["'"']|provider_id=["'"']builtin_vllm["'"']|from .*vllm_runtime import VLLMRuntime|import .*vllm_runtime' \
            tests src/ai_karen_engine/core/expression || true)
          test -z "$refs" || { echo "$refs"; exit 1; }
