name: One-shot Context Converge-3 Patch

on:
  push:
    branches:
      - context/converge-3-memory-budget-classification

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[context-converge3-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: context/converge-3-memory-budget-classification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply convergence patch
        run: python scripts/dev/apply_context_converge3_memory_recall.py
      - name: Compile touched runtime boundary
        run: |
          python -m py_compile \
            src/ai_karen_engine/core/langgraph_orchestrator/langgraph_orchestrator.py \
            src/ai_karen_engine/core/langgraph_orchestrator/nodes/memory_fetch.py \
            src/ai_karen_engine/core/runtime/session_state_manager_compat.py
      - name: Install focused proof dependencies
        run: python -m pip install --disable-pip-version-check pytest pydantic
      - name: Run context memory authority proofs
        env:
          PYTHONPATH: src
        run: |
          pytest \
            tests/architecture/test_context_authority_convergence.py \
            tests/architecture/test_context_langgraph_consumption.py \
            tests/architecture/test_context_memory_boundary_convergence.py \
            tests/architecture/test_context_memory_recall_authority.py \
            -q
      - name: Reference audit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --include='*.py' 'WebUIMemoryService\|_resolve_memory_service' src/ai_karen_engine/core/langgraph_orchestrator
          ! grep -R --line-number --include='*.py' 'memory_service=' src/ai_karen_engine/core/langgraph_orchestrator/nodes/memory_fetch.py
          grep -q 'memory_runtime_manager import recall_context' src/ai_karen_engine/core/langgraph_orchestrator/langgraph_orchestrator.py
          grep -q 'memory_recall=memory_recall' src/ai_karen_engine/core/langgraph_orchestrator/langgraph_orchestrator.py
          ! grep -q 'SessionStateManager(' src/ai_karen_engine/core/langgraph_orchestrator/langgraph_orchestrator.py
      - name: Remove one-shot scaffolding and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/one-shot-context-converge3-patch.yml \
            .github/workflows/one-shot-memory-authority-census.yml \
            .github/workflows/one-shot-memory-service-runtime-audit.yml \
            .github/workflows/one-shot-memory-symbol-locator.yml \
            scripts/dev/apply_context_converge3_memory_recall.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ai_karen_engine/core/langgraph_orchestrator/langgraph_orchestrator.py \
            src/ai_karen_engine/core/langgraph_orchestrator/nodes/memory_fetch.py \
            docs/CONTEXT_RUNTIME_ARCHITECTURE.md \
            tests/architecture/test_context_memory_recall_authority.py
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(context): converge LangGraph on Core memory recall [context-converge3-applied]'
          git push origin HEAD:context/converge-3-memory-budget-classification
