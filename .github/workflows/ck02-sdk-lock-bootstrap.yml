name: CK-02 AG-UI Alias Lockfile (temporary)
on:
  push:
    branches:
      - feat/ck02-copilotkit-v2-sdk-bootstrap-20261025
    paths:
      - 'src/ui_launchers/Karen-AI-Theme/package.json'
permissions:
  contents: write
concurrency:
  group: ck02-alias-lock-bootstrap
  cancel-in-progress: false
jobs:
  update-lock:
    if: github.repository == 'agustealo/AI-Karen' && github.ref == 'refs/heads/feat/ck02-copilotkit-v2-sdk-bootstrap-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate npm lock from declared pinned dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --strict-peer-deps
      - name: Commit resolved lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(copilotkit): lock isolated AG-UI 1.0.2 agent'
            git push origin HEAD:feat/ck02-copilotkit-v2-sdk-bootstrap-20261025
          fi
