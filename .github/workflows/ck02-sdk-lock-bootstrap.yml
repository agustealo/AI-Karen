name: CK-02 SDK Lockfile Bootstrap (temporary)

on:
  push:
    branches:
      - feat/ck02-copilotkit-v2-sdk-bootstrap-20261025
    paths:
      - 'src/ui_launchers/Karen-AI-Theme/package.json'

permissions:
  contents: write

concurrency:
  group: ck02-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  pin-sdk:
    if: github.repository == 'agustealo/AI-Karen' && github.ref == 'refs/heads/feat/ck02-copilotkit-v2-sdk-bootstrap-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Generate real lockfile from pinned SDK dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --strict-peer-deps
          npm ls @copilotkit/react-core @copilotkit/runtime @ag-ui/client --all || true
      - name: Commit generated lockfile to the same isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo 'Existing package lock already matches declared dependencies'
          else
            git commit -m 'build(copilotkit): resolve SDK lockfile from npm registry'
            git push origin HEAD:feat/ck02-copilotkit-v2-sdk-bootstrap-20261025
          fi
