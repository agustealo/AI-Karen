name: One-shot Auth Route Dependency Closure

on:
  push:
    branches:
      - prod/api-rbac-tenant-gauntlet
    paths:
      - .github/workflows/one-shot-auth-route-dependency-closure.yml

permissions:
  contents: write

jobs:
  patch-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/api-rbac-tenant-gauntlet
          fetch-depth: 0

      - name: Apply exact auth-route dependency transformation
        run: python scripts/dev/apply_auth_route_dependency_closure.py

      - name: Compile transformed route
        run: python -m compileall -q src/ai_karen_engine/api_routes/auth/auth.py

      - name: Commit transformed route and remove patch scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-auth-route-dependency-closure.yml
          git rm scripts/dev/apply_auth_route_dependency_closure.py
          git add src/ai_karen_engine/api_routes/auth/auth.py
          git commit -m "refactor(auth): keep route service dependencies injected"
          git push origin HEAD:prod/api-rbac-tenant-gauntlet
