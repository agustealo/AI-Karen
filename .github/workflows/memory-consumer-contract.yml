name: Memory Consumer Contract

on:
  pull_request:
    paths:
      - 'src/ai_karen_engine/core/memory/**'
      - 'src/ai_karen_engine/core/runtime/lazy_loading.py'
      - 'src/ai_karen_engine/core/services/dependencies.py'
      - 'src/ai_karen_engine/api_routes/training/data.py'
      - 'src/ai_karen_engine/api_routes/automation/scheduler.py'
      - 'src/ai_karen_engine/api_routes/admin/admin.py'
      - 'src/ai_karen_engine/services/scheduling/scheduler_manager.py'
      - 'src/ai_karen_engine/learning/autonomous_learner.py'
      - 'src/ai_karen_engine/agents/agent_registry.py'
      - 'src/ai_karen_engine/agents/agent_orchestrator.py'
      - 'src/ai_karen_engine/utils/bootstrap.py'
      - 'tests/architecture/test_memory_consumer_domain_migration.py'
      - '.github/workflows/memory-consumer-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'src/ai_karen_engine/core/memory/**'
      - 'src/ai_karen_engine/core/runtime/lazy_loading.py'
      - 'src/ai_karen_engine/core/services/dependencies.py'
      - 'src/ai_karen_engine/api_routes/training/data.py'
      - 'src/ai_karen_engine/api_routes/automation/scheduler.py'
      - 'src/ai_karen_engine/api_routes/admin/admin.py'
      - 'src/ai_karen_engine/services/scheduling/scheduler_manager.py'
      - 'src/ai_karen_engine/learning/autonomous_learner.py'
      - 'src/ai_karen_engine/agents/agent_registry.py'
      - 'src/ai_karen_engine/agents/agent_orchestrator.py'
      - 'src/ai_karen_engine/utils/bootstrap.py'
      - 'tests/architecture/test_memory_consumer_domain_migration.py'
      - '.github/workflows/memory-consumer-contract.yml'

permissions:
  contents: read

jobs:
  memory-consumer-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused proof dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile migrated memory consumer boundaries
        run: |
          python -m py_compile \
            src/ai_karen_engine/core/memory/service_factory.py \
            src/ai_karen_engine/core/memory/runtime_gateway.py \
            src/ai_karen_engine/core/runtime/lazy_loading.py \
            src/ai_karen_engine/core/services/dependencies.py \
            src/ai_karen_engine/api_routes/training/data.py \
            src/ai_karen_engine/api_routes/automation/scheduler.py \
            src/ai_karen_engine/api_routes/admin/admin.py \
            src/ai_karen_engine/services/scheduling/scheduler_manager.py \
            src/ai_karen_engine/learning/autonomous_learner.py \
            src/ai_karen_engine/agents/agent_registry.py \
            src/ai_karen_engine/agents/agent_orchestrator.py \
            src/ai_karen_engine/utils/bootstrap.py
      - name: Run domain ownership proof
        run: pytest tests/architecture/test_memory_consumer_domain_migration.py -q
      - name: Exact legacy consumer audit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(grep -R --line-number --include='*.py' 'WebUIMemoryService' src/ai_karen_engine | grep -v 'core/memory/memory_service.py' || true)
          test -z "$refs" || { echo "$refs"; exit 1; }
          ! grep -R --line-number --include='*.py' 'store_web_ui_memory' src/ai_karen_engine/services/scheduling
          ! grep -R --line-number --include='*.py' 'UnifiedMemoryService(' src/ai_karen_engine/agents
