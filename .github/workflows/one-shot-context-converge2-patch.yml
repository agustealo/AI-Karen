name: One-shot Context Converge-2 Patch

on:
  push:
    branches:
      - context/converge-2-memory-boundary

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[context-converge2-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: context/converge-2-memory-boundary
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply converge-2 patch
        run: python scripts/run_context_converge2_fixed.py
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest pydantic
      - name: Compile touched boundaries
        run: |
          python -m py_compile \
            src/ai_karen_engine/core/langgraph_orchestrator/context/context_manager_adapter.py \
            src/ai_karen_engine/core/langgraph_orchestrator/nodes/memory_fetch.py \
            src/ai_karen_engine/core/langgraph_orchestrator/diagnostics.py \
            src/ai_karen_engine/core/langgraph_orchestrator/langgraph_orchestrator.py \
            src/ai_karen_engine/core/memory/memory_service.py \
            tests/architecture/test_context_memory_boundary_convergence.py
      - name: Run context convergence proof
        env:
          PYTHONPATH: src
        run: |
          pytest \
            tests/architecture/test_context_authority_convergence.py \
            tests/architecture/test_context_langgraph_consumption.py \
            tests/architecture/test_context_memory_boundary_convergence.py \
            -q
      - name: Reference audit
        run: |
          ! grep -R --line-number --include='*.py' 'ContextManager\|ensure_context_manager' src/ai_karen_engine/core/langgraph_orchestrator
          ! grep -R --line-number --include='*.py' 'core.services.service_registry.*get_memory_service\|get_memory_service' src/ai_karen_engine/core/langgraph_orchestrator
          test "$(grep -c '^class MemoryContextBuilder:' src/ai_karen_engine/core/memory/memory_service.py)" -eq 1
      - name: Remove one-shot scaffolding and commit
        run: |
          rm -f scripts/audit_context_converge2.py scripts/apply_context_converge2.py scripts/run_context_converge2_fixed.py
          rm -f .github/workflows/one-shot-context-converge2-audit.yml .github/workflows/one-shot-context-converge2-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(context): retire ContextManager boundary [context-converge2-applied]'
          git push origin HEAD:context/converge-2-memory-boundary
