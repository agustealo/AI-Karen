      - "tests/services/test_artifact_storage_platform_client.py"
      - "src/ai_karen_engine/services/database/repositories/artifact_store.py"
      - "src/ai_karen_engine/services/artifact_writing_style_source_authority.py"
      - "tests/extensions/test_artifact_writing_style_source_authority.py"
