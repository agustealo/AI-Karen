      - "tests/core/runtime/test_karisignature_contract.py"
      - ".github/workflows/karisignature-postgres-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: karisignature-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  writing-style-owner-postgres:
    name: writing-style-owner-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      WRITING_STYLE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/karen_writing_style_test
    steps:
      - uses: actions/checkout@v4
      - name: Start canonical isolated PostgreSQL service
        env:
          KAREN_CI_DOCKERHUB_USERNAME: ${{ secrets.KAREN_CI_DOCKERHUB_USERNAME }}
          KAREN_CI_DOCKERHUB_TOKEN: ${{ secrets.KAREN_CI_DOCKERHUB_TOKEN }}
          KAREN_CI_POSTGRES_IMAGE: ${{ vars.KAREN_CI_POSTGRES_IMAGE || 'pgvector/pgvector:pg16' }}
        run: bash scripts/ci/start-postgres-container.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci/*.txt
      - name: Install canonical PostgreSQL proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci/chat.txt
          # Artifact HTTP ingress declares UploadFile; FastAPI requires multipart
          # at route-import time even when this test exercises metadata only.
          python -m pip install 'python-multipart>=0.0.9,<1'
      - name: Create new dedicated disposable style test database
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def create():
              root = await asyncpg.connect(
                  "postgresql://postgres:postgres@127.0.0.1:5432/ai_karen"
              )
              try:
                  exists = await root.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname='karen_writing_style_test'"
                  )
                  assert not exists, "Refuse to reuse a pre-existing test database"
                  await root.execute("CREATE DATABASE karen_writing_style_test")
              finally:
                  await root.close()

          asyncio.run(create())
          PY
      - name: Verify compiled WS-01 and WS-02 source
        run: |
          python -m py_compile             src/ai_karen_engine/core/runtime/prompt/karisignature_contract.py             src/ai_karen_engine/services/artifact_writing_style_source_authority.py             src/ai_karen_engine/services/database/repositories/artifact_store.py             src/ai_karen_engine/services/writing_style_profile_repository.py             src/ai_karen_engine/services/writing_style_sample_provenance.py             src/ai_karen_engine/services/formatting/karisignature_persisted_sample_authority.py             src/ai_karen_engine/services/formatting/karisignature_sample_analysis.py             tests/services/test_karisignature_sample_analysis.py             tests/services/test_karisignature_persisted_sample_authority.py             tests/services/test_karisignature_bounded_document_composition.py             tests/extensions/test_writing_style_source_consent.py             tests/integration/test_writing_style_sample_postgres.py             tests/core/runtime/test_karisignature_contract.py             tests/integration/test_writing_style_identity_postgres.py             tests/integration/test_writing_style_document_consent_postgres.py             src/ai_karen_engine/services/postgres_document_style_consent_issuer.py             tests/services/test_postgres_document_style_consent_issuer.py             tests/services/test_artifact_storage_platform_client.py
      - name: Prove authenticated owner, purpose, revocation and immutable erasure on PostgreSQL
        run: |
          pytest tests/services/test_artifact_storage_platform_client.py tests/architecture/test_writing_style_document_consent_contract.py tests/core/runtime/test_karisignature_contract.py tests/services/test_karisignature_sample_analysis.py tests/extensions/test_writing_style_source_consent.py tests/extensions/test_artifact_writing_style_source_authority.py tests/services/test_karisignature_persisted_sample_authority.py tests/services/test_karisignature_bounded_document_composition.py tests/services/test_postgres_document_style_consent_issuer.py tests/core/runtime/test_writing_style_document_consent_policy.py tests/core/runtime/test_document_consent_runtime_policy.py tests/services/test_writing_style_consent_approval_gate.py tests/core/runtime/test_document_consent_approval_scope.py tests/services/test_document_consent_atomic_approval.py tests/auth/test_document_style_consent_session.py tests/auth/test_plugin_lifecycle_session.py tests/services/test_document_consent_admission.py tests/api_routes/test_document_author_consent_http.py tests/api_routes/test_document_author_owned_artifacts_http.py -q -rs
          pytest tests/integration/test_writing_style_identity_postgres.py tests/integration/test_writing_style_sample_postgres.py tests/integration/test_writing_style_document_consent_postgres.py -q -rs --junitxml=karisignature-postgres-junit.xml
      - name: Preserve PostgreSQL proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karisignature-postgres-exact-head-proof
          path: karisignature-postgres-junit.xml
          if-no-files-found: warn
          retention-days: 14
