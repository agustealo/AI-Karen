      - "tests/services/test_karisignature_bounded_document_composition.py"
      - "src/ai_karen_engine/core/runtime/prompt/karisignature_contract.py"
      - "supabase/migrations/*writing_style*.sql"
      - "tests/integration/test_writing_style_identity_postgres.py"
      - "tests/integration/test_writing_style_sample_postgres.py"
      - "tests/integration/test_writing_style_document_consent_postgres.py"
