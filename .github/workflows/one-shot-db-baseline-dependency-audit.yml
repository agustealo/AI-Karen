name: One-shot DB Baseline Dependency Audit

on:
  push:
    branches: [db/baseline-1-production-schema]
    paths:
      - "scripts/dev/audit_db_baseline_dependencies.py"
      - ".github/workflows/one-shot-db-baseline-dependency-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Trace database baseline dependencies
        run: python scripts/dev/audit_db_baseline_dependencies.py
