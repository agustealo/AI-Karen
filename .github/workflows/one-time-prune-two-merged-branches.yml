name: One-time prune two verified merged PR heads

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-prune-two-merged-branches.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify merge evidence and remove unchanged stale branches
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            const targets = [
              { pr: 805, name:'fix/plugin-store-details-modal-20261114', sha:'72c3ef1dd04f371d6edcd0d21a032cd218cdc56d' },
              { pr: 806, name:'fix/plugins-reload-cached-adapter-revival-20261114', sha:'70232d68931530aff67cddbbf8e8b41b375a702b' }
            ];
            const deleted=[],withheld=[],failed=[];
            const defaultBranch=(await github.rest.repos.get({owner,repo})).data.default_branch;
            for(const t of targets) {
              try {
                if(t.name===defaultBranch) {withheld.push({name:t.name,reason:'default_branch'});continue;}
                const [p,b,openHeads] = await Promise.all([
                  github.rest.pulls.get({owner,repo,pull_number:t.pr}),
                  github.rest.repos.getBranch({owner,repo,branch:t.name}),
                  github.rest.pulls.list({owner,repo,state:'open',head:owner+':'+t.name,per_page:100})
                ]);
                const pr=p.data,branch=b.data;
                if(pr.state!=='closed'||!pr.merged_at||pr.base?.repo?.full_name!==owner+'/'+repo ||
                   pr.head?.repo?.full_name!==owner+'/'+repo ||
                   pr.head.ref!==t.name||pr.head.sha!==t.sha) {
                  withheld.push({name:t.name,reason:'merged_pr_head_validation_failed'});continue;
                }
                if(branch.protected||branch.commit.sha!==t.sha||openHeads.data.length) {
                  withheld.push({name:t.name,reason:'protected_changed_or_open_pr'});continue;
                }
                await github.rest.git.deleteRef({owner,repo,ref:'heads/'+t.name});
                deleted.push({name:t.name,pr:t.pr,sha:t.sha,merged_at:pr.merged_at});
              }catch(e){failed.push({name:t.name,status:e.status??null,error:e.message});}
            }
            const report={repository:owner+'/'+repo,deleted_count:deleted.length,
              withheld_count:withheld.length,failed_count:failed.length,deleted,withheld,failed};
            fs.writeFileSync('merged-head-followup-audit.json',JSON.stringify(report,null,2));
            core.info(JSON.stringify({deleted:deleted.length,withheld:withheld.length,failed:failed.length}));
            if(failed.length)core.setFailed('Merged branch ref cleanup had failures.');
      - name: Upload deletion audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-head-followup-audit
          path: merged-head-followup-audit.json
          if-no-files-found: warn
          retention-days: 30
