name: LLM Control Plane Authority

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-control-plane-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llm-control-plane-authority:
    name: llm-control-plane-authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install authority proof dependency
        run: python -m pip install pytest

      - name: Compile canonical model ingress
        run: |
          python -m compileall -q \
            src/ai_karen_engine/server/routers.py \
            src/ai_karen_engine/api_routes/models

      - name: Prove LLM control-plane authority
        run: pytest tests/architecture/test_llm_control_plane_authority.py -q
