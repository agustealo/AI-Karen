  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint Plugin Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install static-analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit

      - name: Run Ruff correctness baseline
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/ai_karen_engine/extensions/ \
            src/ai_karen_engine/api_routes/plugins/ \
            src/ai_karen_engine/persistence/repositories/plugin_lifecycle_repository.py \
            src/ai_karen_engine/services/identity_vault/credential_vault_service.py \
            src/ai_karen_engine/database/identity_vault_schema.py \
            src/ai_karen_engine/api_routes/extensions/extensions.py

      - name: Enforce MyPy on canonical plugin authorities
        run: |
          mypy --ignore-missing-imports --follow-imports=skip --no-error-summary \
            src/ai_karen_engine/extensions/contracts.py \
            src/ai_karen_engine/extensions/executor.py \
            src/ai_karen_engine/extensions/plugin_kernel.py \
            src/ai_karen_engine/services/plugin_service.py \
            src/ai_karen_engine/services/plugin_settings_repository.py \
            src/ai_karen_engine/persistence/repositories/plugin_lifecycle_repository.py \
            src/ai_karen_engine/services/identity_vault/credential_vault_service.py

      - name: Enforce high-severity plugin security checks
        run: |
          bandit -q -lll -iii \
            src/ai_karen_engine/extensions/executor.py \
            src/ai_karen_engine/extensions/plugin_kernel.py \
            src/ai_karen_engine/services/plugin_service.py \
            src/ai_karen_engine/services/plugin_settings_repository.py \
            src/ai_karen_engine/persistence/repositories/plugin_lifecycle_repository.py \
            src/ai_karen_engine/services/identity_vault/credential_vault_service.py

      - name: Generate Bandit report
        run: bandit -r src/ai_karen_engine/extensions/ -f json -o bandit-report.json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  test-backend:
    name: Test Plugin Backend
    # Playwright 1.58.0 Chromium does not support ubuntu26.04; use
    # a supported and explicit GitHub runner for real-browser proof.
    runs-on: ubuntu-24.04
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: karen_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karen_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout

      - name: Install Chromium for browser egress acceptance
        run: python -m playwright install --with-deps chromium

      - name: Run plugin runtime contracts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karen_test
          REDIS_URL: redis://localhost:6379/0
          PLUGIN_ENV: test
        run: |
          pytest \
            tests/extensions/ \
            tests/api/test_content_owner_sources_api.py \
            tests/api_routes/chat/test_conversation_structured_content_response.py \
            tests/core/runtime/test_conversation_runtime_gateway.py \
            tests/core/runtime/test_conversational_plugin_inspection.py \
            tests/core/runtime/test_conversational_plugin_action.py \
            tests/core/runtime/test_plugin_management_preflight_projection.py \
            tests/core/runtime/test_plugin_lifecycle_policy_gate.py \
            tests/services/test_approval_service.py \
            tests/auth/test_plugin_lifecycle_session.py \
            tests/services/test_plugin_lifecycle_resume.py \
            tests/core/runtime/test_grounded_article_reference_execution.py \
            tests/core/runtime/test_search_answer_composition_status.py \
            tests/services/test_search_article_chat_reference.py \
            tests/services/test_search_article_document_service.py \
            tests/services/test_search_plugin_option_contract.py \
            tests/services/test_search_crawl_execution_contract.py \
            tests/services/test_search_readable_evidence_contract.py \
            tests/services/test_search_chat_injection_contract.py \
            tests/services/test_search_evidence_summary_contract.py \
            tests/services/test_search_consumer_readiness_contract.py \
            tests/services/test_search_ui_empty_evidence_contract.py \
            tests/services/test_crawl4ai_browser_egress_policy.py \
            tests/integration/test_crawl4ai_browser_egress_real.py \
            tests/services/test_runtime_search_citation_validator.py \
            tests/architecture/test_grounded_article_reference_boundary.py \
            tests/architecture/test_extension_lifecycle_authority.py \
            tests/architecture/test_extension_route_authority.py \
            tests/architecture/test_shared_file_explorer_ui_boundary.py \
            tests/architecture/test_plugin_lifecycle_ingress_fence.py \
            tests/architecture/test_plugin_runtime_authority.py \
            tests/architecture/test_first_party_plugin_live_acceptance_contract.py \
            tests/architecture/test_plugin_store_api_shape_guards.py \
            -v \
            --cov=src/ai_karen_engine/extensions \
            --cov-report=xml \
            --cov-report=html \
            --timeout=300 \
            --tb=short

      - name: Live PostgreSQL channel claim concurrency
        env:
          PGPASSWORD: postgres
          CHANNEL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karen_channel_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          # Dedicated disposable DB: the live proof recreates its own schema.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE karen_channel_test'
          pytest tests/integration/test_channel_claim_concurrency_postgres.py -q --timeout=120 --tb=short

      - name: Measure bounded channel status PostgreSQL batch latency
        env:
          CHANNEL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karen_channel_test
          KAREN_CHANNEL_STATUS_BENCHMARK_REPETITIONS: '6'
        run: |
          # Reuse ONLY the disposable DB initialized by the preceding channel
          # migration/claim test. No production accounts, credentials or data.
          pytest tests/integration/test_channel_status_batch_benchmark_postgres.py -q --timeout=180 --tb=short

      - name: Upload bounded status benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-status-postgres-benchmark
          path: artifacts/ci/channel-status-postgres-benchmark.json
          if-no-files-found: warn

      - name: Live PostgreSQL plugin settings tenant RLS and revision proof
        env:
          PGPASSWORD: postgres
          PLUGIN_SETTINGS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karen_plugin_settings_test
        run: |
          # Dedicated throwaway DB, never a production tenant or shared test DB.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE karen_plugin_settings_test'
          pytest tests/integration/test_plugin_settings_postgres.py -q --timeout=120 --tb=short

      - name: Live PostgreSQL global plugin lifecycle claim and rollback proof
        env:
          PGPASSWORD: postgres
          PLUGIN_LIFECYCLE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karen_plugin_lifecycle_test
        run: |
          # Dedicated isolated DB; verify cross-tenant CAS under restricted role.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE karen_plugin_lifecycle_test'
          pytest tests/integration/test_plugin_lifecycle_ledger_postgres.py -q --timeout=120 --tb=short

      - name: Live PostgreSQL Identity Vault plugin secret proof
        env:
          PGPASSWORD: postgres
          PLUGIN_VAULT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karen_plugin_vault_test
        run: |
          # Dedicated disposable test database. Never touch production secrets.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE karen_plugin_vault_test'
          pytest tests/integration/test_plugin_vault_postgres.py -q --timeout=120 --tb=short

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
            .coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: plugin-ecosystem
          name: codecov-umbrella
          fail_ci_if_error: false

  test-frontend:
    name: Test Plugin Frontend
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npx vitest run --passWithNoTests

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/ui_launchers/Karen-AI-Theme/coverage/

  security-report:
    name: Plugin Security Reports
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Trivy filesystem report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Generate dependency audit reports
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc --format json > pip-audit-requirements.json || true
          pip-audit -r requirements-database.txt --desc --format json > pip-audit-database.json || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-security-reports
          path: |
            trivy-results.sarif
            pip-audit-requirements.json
            pip-audit-database.json
