name: Plugin Ecosystem CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/ai_karen_engine/extensions/**'
      - 'tests/integration/**'
      - 'tests/architecture/test_plugin_container_contract.py'
      - 'docker/Dockerfile.plugins'
      - '.github/workflows/plugin-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/ai_karen_engine/extensions/**'
      - 'tests/integration/**'
      - 'tests/architecture/test_plugin_container_contract.py'
      - 'docker/Dockerfile.plugins'
      - '.github/workflows/plugin-ci.yml'
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Deployment environment (staging/production)'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  PLUGIN_IMAGE: ghcr.io/${{ github.repository_owner }}/plugin-ecosystem

jobs:
  lint:
    name: Lint Plugin Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit
          pip install -r requirements.txt
      
      - name: Run Ruff correctness baseline
        run: |
          ruff check --select E9,F63,F7,F82 src/ai_karen_engine/extensions/
      
      - name: Run MyPy type checker
        run: |
          mypy src/ai_karen_engine/extensions/ --ignore-missing-imports --no-error-summary || true
      
      - name: Run Bandit security linter
        run: |
          bandit -r src/ai_karen_engine/extensions/ -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  test-backend:
    name: Test Plugin Backend
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: karen_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karen_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout
      
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karen_test
          REDIS_URL: redis://localhost:6379/0
          PLUGIN_ENV: test
        run: |
          pytest \
            tests/extensions/ \
            tests/architecture/test_extension_lifecycle_authority.py \
            tests/architecture/test_extension_route_authority.py \
            tests/architecture/test_plugin_container_contract.py \
            -v \
            --cov=src/ai_karen_engine/extensions \
            --cov-report=xml \
            --cov-report=html \
            --timeout=300 \
            --tb=short
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
            .coverage
      
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: plugin-ecosystem
          name: codecov-umbrella
          fail_ci_if_error: false

  test-frontend:
    name: Test Plugin Frontend
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json
      
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      
      - name: Run TypeScript type checking
        run: npm run typecheck
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run frontend tests
        run: npx vitest run --passWithNoTests
      
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/ui_launchers/Karen-AI-Theme/coverage/

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc --format json || true
      
      - name: Run safety check
        run: |
          pip install safety
          safety check --json || true
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-results.sarif

  build-docker:
    name: Build Plugin Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-scan]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PLUGIN_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=${{ github.sha }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.plugins
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke loaded plugin image contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          image="${PLUGIN_IMAGE}:${GITHUB_SHA}"
          docker image inspect "${image}" >/dev/null
          docker run --rm "${image}" curl --version >/dev/null
          docker run --rm "${image}" python -c "from ai_karen_engine.app import create_app; app = create_app(); assert app is not None"
          contract="$(docker image inspect "${image}" --format '{{json .Config.Cmd}} {{json .Config.Healthcheck.Test}}')"
          grep -Fq 'ai_karen_engine.app:create_app' <<<"${contract}"
          grep -Fq '/health/live' <<<"${contract}"

      - name: Image digest
        run: echo "${{ steps.build.outputs.digest }}"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: https://staging.karen.ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
      
      - name: Update deployment
        run: |
          kubectl set image deployment/plugin-ecosystem \
            plugin-ecosystem="${PLUGIN_IMAGE}:${GITHUB_SHA}" \
            -n staging
      
      - name: Rollout restart
        run: |
          kubectl rollout restart deployment/plugin-ecosystem -n staging
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/plugin-ecosystem -n staging --timeout=5m

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'production'
    environment:
      name: production
      url: https://karen.ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
      
      - name: Run pre-deployment health check
        run: |
          echo "Checking production environment health..."
          kubectl get pods -n production
      
      - name: Update deployment
        run: |
          kubectl set image deployment/plugin-ecosystem \
            plugin-ecosystem="${PLUGIN_IMAGE}:${GITHUB_SHA}" \
            -n production
      
      - name: Blue-green deployment switch
        run: |
          kubectl rollout restart deployment/plugin-ecosystem -n production
          kubectl rollout status deployment/plugin-ecosystem -n production --timeout=10m
      
      - name: Post-deployment health check
        run: |
          echo "Waiting for production deployment to be ready..."
          sleep 30
          kubectl get pods -n production
          kubectl rollout status deployment/plugin-ecosystem -n production
      
      - name: Run smoke tests
        run: |
          curl -fsS https://karen.ai/health/live
          curl -fsS https://karen.ai/ready
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "Production deployment successful!"
          # Add webhook notification here
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          kubectl rollout undo deployment/plugin-ecosystem -n production

  migrate-plugins:
    name: Migrate Plugins to Production
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install requests pyyaml
          
      - name: Run plugin migration
        env:
          PRODUCTION_API_URL: https://karen.ai/api
          PRODUCTION_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
        run: |
          python scripts/migrate_plugins.py \
            --source development \
            --target production \
            --verify