name: Plugin Ecosystem CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/ai_karen_engine/extensions/**'
      - 'src/ai_karen_engine/api_routes/plugins/store.py'
      - 'src/ui_launchers/Karen-AI-Theme/src/lib/PluginStoreService.ts'
      - 'src/ui_launchers/Karen-AI-Theme/src/types/plugin.ts'
      - 'tests/extensions/**'
      - 'tests/architecture/test_extension_lifecycle_authority.py'
      - 'tests/architecture/test_extension_route_authority.py'
      - 'tests/architecture/test_plugin_runtime_authority.py'
      - 'docker/Dockerfile.plugins'
      - 'deploy/compose/docker-compose.plugins.yml'
      - '.github/workflows/plugin-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/ai_karen_engine/extensions/**'
      - 'src/ai_karen_engine/api_routes/plugins/store.py'
      - 'src/ui_launchers/Karen-AI-Theme/src/lib/PluginStoreService.ts'
      - 'src/ui_launchers/Karen-AI-Theme/src/types/plugin.ts'
      - 'tests/extensions/**'
      - 'tests/architecture/test_extension_lifecycle_authority.py'
      - 'tests/architecture/test_extension_route_authority.py'
      - 'tests/architecture/test_plugin_runtime_authority.py'
      - 'docker/Dockerfile.plugins'
      - 'deploy/compose/docker-compose.plugins.yml'
      - '.github/workflows/plugin-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint Plugin Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install static-analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit

      - name: Run Ruff correctness baseline
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/ai_karen_engine/extensions/ \
            src/ai_karen_engine/api_routes/plugins/store.py

      - name: Run MyPy type checker
        run: mypy src/ai_karen_engine/extensions/ --ignore-missing-imports --no-error-summary || true

      - name: Generate Bandit report
        run: bandit -r src/ai_karen_engine/extensions/ -f json -o bandit-report.json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  test-backend:
    name: Test Plugin Backend
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: karen_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karen_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout

      - name: Run plugin runtime contracts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karen_test
          REDIS_URL: redis://localhost:6379/0
          PLUGIN_ENV: test
        run: |
          pytest \
            tests/extensions/ \
            tests/architecture/test_extension_lifecycle_authority.py \
            tests/architecture/test_extension_route_authority.py \
            tests/architecture/test_plugin_runtime_authority.py \
            -v \
            --cov=src/ai_karen_engine/extensions \
            --cov-report=xml \
            --cov-report=html \
            --timeout=300 \
            --tb=short

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
            .coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: plugin-ecosystem
          name: codecov-umbrella
          fail_ci_if_error: false

  test-frontend:
    name: Test Plugin Frontend
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npx vitest run --passWithNoTests

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/ui_launchers/Karen-AI-Theme/coverage/

  security-report:
    name: Plugin Security Reports
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Trivy filesystem report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Generate dependency audit reports
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc --format json > pip-audit-requirements.json || true
          pip-audit -r requirements-database.txt --desc --format json > pip-audit-database.json || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-security-reports
          path: |
            trivy-results.sarif
            pip-audit-requirements.json
            pip-audit-database.json
