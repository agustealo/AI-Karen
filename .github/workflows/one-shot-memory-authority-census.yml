name: One-shot Memory Authority Census

on:
  push:
    branches:
      - context/converge-3-memory-budget-classification

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Census memory authority references
        shell: bash
        run: |
          set -euo pipefail
          echo '## WebUIMemoryService refs'
          grep -R --line-number --include='*.py' 'WebUIMemoryService' src tests || true
          echo '## memory_service imports'
          grep -R --line-number --include='*.py' 'core.memory.memory_service' src tests || true
          echo '## UnifiedMemoryService refs'
          grep -R --line-number --include='*.py' 'UnifiedMemoryService' src tests || true
          echo '## DefaultRecallService refs'
          grep -R --line-number --include='*.py' 'DefaultRecallService' src tests || true
          echo '## recall_context refs'
          grep -R --line-number --include='*.py' 'recall_context' src tests || true
          echo '## memory_service registry refs'
          grep -R --line-number --include='*.py' -E 'memory_service|MemoryRuntimeManager' src/ai_karen_engine/core/services src/ai_karen_engine/server src/ai_karen_engine/api_routes 2>/dev/null || true
          echo '## recall dirs/files'
          find src/ai_karen_engine/core -maxdepth 3 -iname '*recall*' -o -iname '*memory*' | sort
