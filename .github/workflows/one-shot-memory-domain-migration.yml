name: One-shot Memory Domain Migration

on:
  push:
    branches:
      - memory/migrate-remaining-consumers

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[memory-domain-migrated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory/migrate-remaining-consumers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair exact live transformer seam
        run: python scripts/dev/repair_memory_migration_transformer.py
      - name: Apply domain migration
        run: python scripts/dev/apply_memory_consumer_domain_migration.py
      - name: Compile migrated boundaries
        run: |
          python -m py_compile \
            src/ai_karen_engine/core/memory/service_factory.py \
            src/ai_karen_engine/core/memory/runtime_gateway.py \
            src/ai_karen_engine/core/runtime/lazy_loading.py \
            src/ai_karen_engine/core/services/dependencies.py \
            src/ai_karen_engine/api_routes/training/data.py \
            src/ai_karen_engine/api_routes/automation/scheduler.py \
            src/ai_karen_engine/services/scheduling/scheduler_manager.py \
            src/ai_karen_engine/learning/autonomous_learner.py \
            src/ai_karen_engine/utils/bootstrap.py \
            src/ai_karen_engine/api_routes/admin/admin.py \
            src/ai_karen_engine/agents/agent_registry.py \
            src/ai_karen_engine/agents/agent_orchestrator.py
      - name: Architecture reference audit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(grep -R --line-number --include='*.py' 'WebUIMemoryService' src/ai_karen_engine | grep -v 'core/memory/memory_service.py' || true)
          test -z "$refs" || { echo "$refs"; exit 1; }
          test "$(grep -R --include='*.py' -l 'create_unified_memory_service' src/ai_karen_engine | wc -l)" -ge 4
          ! grep -R --line-number --include='*.py' 'store_web_ui_memory' src/ai_karen_engine/services/scheduling
          ! grep -R --line-number --include='*.py' 'UnifiedMemoryService(' src/ai_karen_engine/agents
          grep -q 'tenant_id = getattr(request.state, "tenant_id", None)' src/ai_karen_engine/api_routes/admin/admin.py
      - name: Remove migration scaffolding and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/one-shot-memory-consumer-census.yml \
            .github/workflows/one-shot-memory-domain-migration.yml \
            scripts/dev/apply_memory_consumer_domain_migration.py \
            scripts/dev/repair_memory_migration_transformer.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(memory): migrate consumers by domain [memory-domain-migrated]'
          git push origin HEAD:memory/migrate-remaining-consumers
