name: One-time archive five closed-unmerged PR branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-archive-closed-pr-leftovers.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-archive-closed-pr-leftovers
  cancel-in-progress: false

jobs:
  archive-and-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Fetch live branch tips
        run: git -c protocol.version=2 fetch --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Recoverably archive then remove explicitly audited closed PR branches
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner, repo = context.repo.repo;
            const fullName = owner + '/' + repo;
            const tag = 'branch-archive/2026-11-14-closed-unmerged-final-five';
            const manifestPath = '.branch-archives/2026-11-14-closed-unmerged-final-five.json';
            const olderThan = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const targets = [
              { name:'docs/kcon-ledger-current-main-20261106', pr:676, sha:'7db15ce56f0c9ce7d834648352b123ea4259b604' },
              { name:'feat/kchat-governed-search-results-first-prompt-20261105', pr:659, sha:'98420ec4299c4cae0c0e4d0e533113218ac8553a' },
              { name:'fix/kchat-degraded-requires-recent-success-20261103', pr:630, sha:'80490f2742c6d0821892f670c3227b405cd2ad41' },
              { name:'fix/memory-goal-event-lifecycle', pr:133, sha:'c3739c1c87aaf8c637593bbfce03694a6c2bce85' },
              { name:'fix/weather-first-prompt-observation-projection-20261105', pr:657, sha:'20d83b79ef776d046bbcd8192e36e7c722f00bb1' }
            ];
            const git = (args, env) => execFileSync('git', args, {
              encoding:'utf8', maxBuffer:16*1024*1024,
              stdio:['ignore','pipe','pipe'], ...(env?{env}:{})
            }).trim();
            const mainName = (await github.rest.repos.get({owner,repo})).data.default_branch;
            const main = git(['rev-parse','refs/remotes/origin/'+mainName]);
            const selected=[], withheld=[], deleted=[], failed=[];
            const allPRs = await github.paginate(github.rest.pulls.list, {owner,repo,state:'all',per_page:100});
            for (const t of targets) {
              try {
                const current = (await github.rest.repos.getBranch({owner,repo,branch:t.name})).data;
                const pr = (await github.rest.pulls.get({owner,repo,pull_number:t.pr})).data;
                if(current.protected || current.commit.sha !== t.sha) {withheld.push({name:t.name,reason:'tip_changed_or_protected'});continue;}
                if(pr.state !== 'closed' || pr.merged_at || pr.head.repo?.full_name !== fullName ||
                   pr.head.ref !== t.name || pr.head.sha !== t.sha ||
                   !pr.closed_at || !pr.updated_at ||
                   new Date(pr.closed_at).getTime() > olderThan || new Date(pr.updated_at).getTime() > olderThan) {
                  withheld.push({name:t.name,reason:'pr_state_head_or_grace_check_failed'});continue;
                }
                if((pr.labels||[]).some(l=>/^(keep|hold|do-not-delete|wip|in-progress)$/i.test(l.name))) {
                  withheld.push({name:t.name,reason:'preservation_label'});continue;
                }
                if(allPRs.some(p=>p.state==='open' &&
                   (p.head?.repo?.full_name === fullName && p.head.ref === t.name ||
                   p.base?.repo?.full_name === fullName && p.base.ref === t.name))) {
                  withheld.push({name:t.name,reason:'open_pr_head_or_base'});continue;
                }
                git(['cat-file','-e',t.sha+'^{commit}']);
                const commitAt=git(['show','-s','--format=%cI',t.sha]);
                if(!commitAt || new Date(commitAt).getTime()>olderThan) {
                  withheld.push({name:t.name,reason:'recent_commit_tip'});continue;
                }
                const unique=Number(git(['rev-list','--count',main+'..'+t.sha]));
                if(!Number.isSafeInteger(unique)||unique<=0) {
                  withheld.push({name:t.name,reason:'unexpected_or_no_unique_commits'});continue;
                }
                selected.push({...t,pr_closed_at:pr.closed_at,pr_updated_at:pr.updated_at,tip_committed_at:commitAt,unique_commits_vs_main:unique});
              } catch(e) {
                withheld.push({name:t.name,reason:'preflight_error',message:e.message});
              }
            }
            let archive = null;
            if(selected.length) {
              try {
                try {
                  const old=await github.rest.git.getRef({owner,repo,ref:'tags/'+tag});
                  throw new Error('Archive tag already exists at '+old.data.object.sha);
                }catch(e) {if(e.status!==404) throw e;}
                const manifest={
                  repository:fullName,main_sha:main,main_branch:mainName,created_at:new Date().toISOString(),
                  tag,classification:'closed_unmerged_pr_with_unique_commits',
                  treatment:'Branch refs removed after durable tag + commit ancestry verified; unique history not asserted merged into main',
                  recovery:'git fetch origin tag '+tag+'; git show '+tag+':'+manifestPath+'; git branch RECOVERY_NAME SHA',
                  branches:selected
                };
                fs.mkdirSync(path.dirname(manifestPath),{recursive:true});
                fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
                git(['add','--',manifestPath]);
                const tree=git(['write-tree']);
                const env={...process.env,
                  GIT_AUTHOR_NAME:'AI-Karen Branch Archive',
                  GIT_AUTHOR_EMAIL:'actions@users.noreply.github.com',
                  GIT_COMMITTER_NAME:'AI-Karen Branch Archive',
                  GIT_COMMITTER_EMAIL:'actions@users.noreply.github.com'};
                const args=['commit-tree',tree,'-p',main,...selected.flatMap(t=>['-p',t.sha]),
                  '-m','Archive five closed unmerged PR branch tips without integrating their changes'];
                archive=git(args,env);
                for(const t of selected) git(['merge-base','--is-ancestor',t.sha,archive]);
                git(['push','origin',archive+':refs/tags/'+tag]);
                const ref=(await github.rest.git.getRef({owner,repo,ref:'tags/'+tag})).data;
                if(ref.object.sha !== archive) throw new Error('Archive tag SHA mismatch');
                const remote=(await github.rest.repos.getContent({owner,repo,path:manifestPath,ref:tag})).data;
                if(Array.isArray(remote)||remote.type!=='file') throw new Error('Remote manifest missing');
                const got=JSON.parse(Buffer.from(remote.content,'base64').toString('utf8'));
                if(got.branches.length!==selected.length ||
                   selected.some((t,i)=>got.branches[i].name!==t.name||got.branches[i].sha!==t.sha)) {
                  throw new Error('Remote archive manifest does not match expected refs');
                }
                core.info('Remote archive verified at '+archive+' containing '+selected.length+' tips');
              } catch(e) {failed.push({stage:'archive',message:e.message}); archive=null;}
            }
            if(archive && !failed.length) for(const t of selected) {
              try {
                const fresh=(await github.rest.repos.getBranch({owner,repo,branch:t.name})).data;
                if(fresh.protected||fresh.commit.sha!==t.sha){withheld.push({name:t.name,reason:'fresh_ref_changed'});continue;}
                const pending=await github.rest.pulls.list({owner,repo,state:'open',head:owner+':'+t.name,per_page:100});
                if(pending.data.length){withheld.push({name:t.name,reason:'new_open_pr'});continue;}
                git(['merge-base','--is-ancestor',t.sha,archive]);
                await github.rest.git.deleteRef({owner,repo,ref:'heads/'+t.name});
                deleted.push(t);
              }catch(e){failed.push({stage:'delete',name:t.name,status:e.status||null,message:e.message});}
            }
            const report={repository:fullName,main_sha_at_audit:main,archive_tag:archive?tag:null,
              archive_commit:archive,target_count:targets.length,selected:selected.length,
              deleted_count:deleted.length,withheld_count:withheld.length,failed_count:failed.length,
              deleted,withheld,failed};
            fs.writeFileSync('closed-unmerged-leftovers-audit.json',JSON.stringify(report,null,2));
            core.info(JSON.stringify({selected:report.selected,deleted:report.deleted_count,
              withheld:report.withheld_count,failed:report.failed_count,archive_tag:report.archive_tag}));
            await core.summary.addHeading('Closed unmerged PR branch archival').addTable([
              [{data:'Metric',header:true},{data:'Count',header:true}],
              ['Selected',String(selected.length)],['Archived and deleted',String(deleted.length)],
              ['Withheld',String(withheld.length)],['Failures',String(failed.length)]
            ]).write();
            if(failed.length) core.setFailed('Audit or deletion failure; see artifact.');

      - name: Upload archival evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-unmerged-leftovers-audit
          path: closed-unmerged-leftovers-audit.json
          if-no-files-found: warn
          retention-days: 60
