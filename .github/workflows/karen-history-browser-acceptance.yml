name: KAREN Browser Acceptance

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Browser acceptance scenario
        type: choice
        required: true
        default: history
        options:
          - history
          - search
          - docker-search
          - copilotkit-protocol
          - copilotkit-native
      target_sha:
        description: Exact reviewed 40-character main commit SHA for search acceptance
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: karen-history-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticated-history-restoration:
    if: inputs.scenario == 'history' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: karen-sanitized-browser-acceptance
    env:
      KAREN_BASE_URL: ${{ vars.KAREN_HISTORY_ACCEPTANCE_URL }}
      KAREN_HISTORY_CONVERSATION_ID: ${{ vars.KAREN_HISTORY_CONVERSATION_ID }}
      KAREN_HISTORY_ACCEPTANCE_REQUIRED: "true"
      KAREN_UX_IDENTITY_REPLAY: "true"
      KAREN_E2E_CAPTURE_VIDEO: "false"
      CI: "true"

    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate approved acceptance configuration
        shell: bash
        env:
          KAREN_UX_EMAIL: ${{ secrets.KAREN_UX_EMAIL }}
          KAREN_UX_PASSWORD: ${{ secrets.KAREN_UX_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$KAREN_BASE_URL" || { echo "::error::Missing approved deployment URL"; exit 1; }
          test -n "$KAREN_UX_EMAIL" || { echo "::error::Missing acceptance identity"; exit 1; }
          test -n "$KAREN_UX_PASSWORD" || { echo "::error::Missing acceptance credential"; exit 1; }
          test -n "$KAREN_HISTORY_CONVERSATION_ID" || { echo "::error::Missing persisted conversation ID"; exit 1; }
          case "$KAREN_BASE_URL" in
            https://*) ;;
            *) echo "::error::Acceptance URL must use HTTPS"; exit 1 ;;
          esac

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Prove live authenticated conversation restoration
        shell: bash
        env:
          KAREN_UX_EMAIL: ${{ secrets.KAREN_UX_EMAIL }}
          KAREN_UX_PASSWORD: ${{ secrets.KAREN_UX_PASSWORD }}
        run: |
          set -euo pipefail
          npx playwright test e2e/karen-durable-history-restoration.spec.ts \
            --config=e2e/playwright.config.ts \
            --project=chromium \
            --reporter=list \
            --retries=0

      # Intentionally no trace, video, screenshot, JSON/HTML artifact upload:
      # authenticated test credentials and user conversation content are sensitive.

  authenticated-search-replay:
    if: inputs.scenario == 'search' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: karen-sanitized-browser-acceptance
    env:
      KAREN_BASE_URL: ${{ vars.KAREN_SEARCH_ACCEPTANCE_URL }}
      KAREN_SEARCH_ACCEPTANCE_REQUIRED: "true"
      KAREN_E2E_CAPTURE_VIDEO: "false"
      CI: "true"

    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - name: Require pinned reviewed source revision
        working-directory: .
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Provide a reviewed 40-character commit SHA"; exit 1; }

      - name: Require the current reviewed main commit before checkout
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Protected browser acceptance only runs from main"
            exit 1
          }
          test "$TARGET_SHA" = "$GITHUB_SHA" || {
            echo "::error::Requested SHA differs from the dispatched main revision"
            exit 1
          }
          actual_sha="$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq '.commit.sha')"
          test "$TARGET_SHA" = "$actual_sha" || {
            echo "::error::Main moved before protected acceptance"
            exit 1
          }

      - name: Check out exact reviewed source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Validate approved search deployment
        shell: bash
        env:
          KAREN_UX_EMAIL: ${{ secrets.KAREN_UX_EMAIL }}
          KAREN_UX_PASSWORD: ${{ secrets.KAREN_UX_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
          test -n "$KAREN_BASE_URL" || { echo "::error::Missing approved search deployment URL"; exit 1; }
          test -n "$KAREN_UX_EMAIL" || { echo "::error::Missing acceptance identity"; exit 1; }
          test -n "$KAREN_UX_PASSWORD" || { echo "::error::Missing acceptance credential"; exit 1; }
          case "$KAREN_BASE_URL" in
            https://*) ;;
            *) echo "::error::Acceptance URL must use HTTPS"; exit 1 ;;
          esac

      - name: Verify deployed revision before browser acceptance
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          python ../../../scripts/ci/verify_deployment_revision.py

      - name: Verify independent Vercel deployment provenance before browser acceptance
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          PYTHONPATH: ${{ github.workspace }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python ../../../scripts/ci/verify_vercel_deployment.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Prove live authenticated grounded search and replay
        shell: bash
        env:
          KAREN_UX_EMAIL: ${{ secrets.KAREN_UX_EMAIL }}
          KAREN_UX_PASSWORD: ${{ secrets.KAREN_UX_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          npm run test:e2e:search-release -- --reporter=list --retries=0

      - name: Revalidate platform, running deployment and reviewed main head after browser acceptance
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python ../../../scripts/ci/verify_vercel_deployment.py
          python ../../../scripts/ci/verify_deployment_revision.py
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          actual_sha="$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq '.commit.sha')"
          test "$actual_sha" = "$TARGET_SHA" || {
            echo "::error::Reviewed main revision changed during browser acceptance"
            exit 1
          }

      # Never upload traces, videos, screenshots, or credential-bearing reports.


  # Read-only SDK-protocol proof only. Native CopilotKit UI parity still unverified.
  authenticated-copilotkit-protocol:
    if: (inputs.scenario == 'copilotkit-protocol' || inputs.scenario == 'copilotkit-native') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: karen-sanitized-browser-acceptance
    env:
      KAREN_BASE_URL: ${{ vars.KAREN_COPILOTKIT_ACCEPTANCE_URL }}
      KAREN_COPILOTKIT_ACCEPTANCE_REQUIRED: ${{ inputs.scenario == 'copilotkit-protocol' && 'true' || 'false' }}
      KAREN_COPILOTKIT_NATIVE_ACCEPTANCE_REQUIRED: ${{ inputs.scenario == 'copilotkit-native' && 'true' || 'false' }}
      KAREN_COPILOTKIT_PERSONA_MUTATION_REQUIRED: ${{ vars.KAREN_COPILOTKIT_PERSONA_MUTATION_REQUIRED }}
      KAREN_COPILOTKIT_LIVE_STOP_REQUIRED: ${{ vars.KAREN_COPILOTKIT_LIVE_STOP_REQUIRED }}
      KAREN_COPILOTKIT_LIVE_STOP_CONVERSATION_ID: ${{ vars.KAREN_COPILOTKIT_LIVE_STOP_CONVERSATION_ID }}
      KAREN_HISTORY_CONVERSATION_ID: ${{ vars.KAREN_COPILOTKIT_CONVERSATION_ID }}
      KAREN_COPILOTKIT_OBSERVED_RUN_ID: ${{ vars.KAREN_COPILOTKIT_OBSERVED_RUN_ID }}
      KAREN_E2E_CAPTURE_VIDEO: "false"
      CI: "true"

    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - name: Require pinned reviewed source revision
        working-directory: .
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Provide a reviewed 40-character commit SHA"; exit 1; }

      - name: Require the current reviewed main commit before checkout
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Protected browser acceptance only runs from main"
            exit 1
          }
          test "$TARGET_SHA" = "$GITHUB_SHA" || {
            echo "::error::Requested SHA differs from the dispatched main revision"
            exit 1
          }
          actual_sha="$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq '.commit.sha')"
          test "$TARGET_SHA" = "$actual_sha" || {
            echo "::error::Main moved before protected acceptance"
            exit 1
          }

      - name: Check out exact reviewed source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Validate approved CopilotKit protocol deployment
        shell: bash
        env:
          KAREN_UX_EMAIL: ${{ secrets.KAREN_UX_EMAIL }}
          KAREN_UX_PASSWORD: ${{ secrets.KAREN_UX_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
          test -n "$KAREN_BASE_URL" || { echo "::error::Missing approved CopilotKit protocol deployment URL"; exit 1; }
          test -n "$KAREN_UX_EMAIL" || { echo "::error::Missing acceptance identity"; exit 1; }
          test -n "$KAREN_UX_PASSWORD" || { echo "::error::Missing acceptance credential"; exit 1; }
          test -n "$KAREN_HISTORY_CONVERSATION_ID" || { echo "::error::Missing approved conversation"; exit 1; }
          if test "${{ inputs.scenario }}" = "copilotkit-protocol"; then
            test -n "$KAREN_COPILOTKIT_OBSERVED_RUN_ID" || { echo "::error::Missing observed run ID"; exit 1; }
          fi
          case "$KAREN_BASE_URL" in
            https://*) ;;
            *) echo "::error::Acceptance URL must use HTTPS"; exit 1 ;;
          esac

      - name: Verify deployed revision before browser acceptance
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          python ../../../scripts/ci/verify_deployment_revision.py

      - name: Verify independent Vercel deployment provenance before browser acceptance
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          PYTHONPATH: ${{ github.workspace }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python ../../../scripts/ci/verify_vercel_deployment.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Prove live authenticated CopilotKit protocol and observed replay
        if: inputs.scenario == 'copilotkit-protocol'
        shell: bash
        env:
          KAREN_UX_EMAIL: ${{ secrets.KAREN_UX_EMAIL }}
          KAREN_UX_PASSWORD: ${{ secrets.KAREN_UX_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          npx playwright test e2e/karen-copilotkit-protocol-acceptance.spec.ts \
            --config=e2e/playwright.config.ts --project=chromium \
            --reporter=list --retries=0

      - name: Prove isolated native CopilotKit UX and separately opted-in disposable live Stop
        if: inputs.scenario == 'copilotkit-native'
        shell: bash
        env:
          KAREN_UX_EMAIL: ${{ secrets.KAREN_UX_EMAIL }}
          KAREN_UX_PASSWORD: ${{ secrets.KAREN_UX_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          npx playwright test e2e/karen-copilotkit-native-acceptance.spec.ts \
            --config=e2e/playwright.config.ts --project=chromium \
            --reporter=list --retries=0

      - name: Revalidate platform, running deployment and reviewed main head after browser acceptance
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python ../../../scripts/ci/verify_vercel_deployment.py
          python ../../../scripts/ci/verify_deployment_revision.py
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          actual_sha="$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq '.commit.sha')"
          test "$actual_sha" = "$TARGET_SHA" || {
            echo "::error::Reviewed main revision changed during browser acceptance"
            exit 1
          }

      # Never upload traces, videos, screenshots, or credential-bearing reports.


  # Operator-controlled Docker host proof. NEVER npm install or type browser
  # credentials on this production-capable runner.
  docker-provenance-before:
    if: inputs.scenario == 'docker-search' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, karen-consumer-release]
    timeout-minutes: 20
    environment: karen-sanitized-browser-acceptance
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      KAREN_RELEASE_REPO_ROOT: ${{ vars.KAREN_DOCKER_RELEASE_REPO_ROOT }}
      KAREN_RELEASE_REPOSITORY: ${{ github.repository }}
      KAREN_BASE_URL: ${{ vars.KAREN_DOCKER_SEARCH_ACCEPTANCE_URL }}
      KAREN_SIGNED_API_IMAGE_REF: ${{ vars.KAREN_SIGNED_API_IMAGE_REF }}
      KAREN_SIGNED_WEB_IMAGE_REF: ${{ vars.KAREN_SIGNED_WEB_IMAGE_REF }}
      KAREN_EXPECTED_API_IMAGE_ID: ${{ vars.KAREN_EXPECTED_API_IMAGE_ID }}
      KAREN_EXPECTED_WEB_IMAGE_ID: ${{ vars.KAREN_EXPECTED_WEB_IMAGE_ID }}
    steps:
      - name: Require reviewed current main before Docker checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$current" = "$TARGET_SHA"

      - name: Check out reviewed main for read-only host verifier
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify signed Docker host and public HTTPS before browser
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verify_docker_browser_host.sh

  # Credentials and untrusted npm/Playwright setup are isolated on a GitHub-
  # hosted runner with no operator-host Docker socket or production env file.
  authenticated-docker-search-replay:
    if: inputs.scenario == 'docker-search' && github.ref == 'refs/heads/main'
    needs: docker-provenance-before
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: karen-sanitized-browser-acceptance
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      KAREN_BASE_URL: ${{ vars.KAREN_DOCKER_SEARCH_ACCEPTANCE_URL }}
      KAREN_SEARCH_ACCEPTANCE_REQUIRED: "true"
      KAREN_SEARCH_ACCEPTANCE_PLATFORM: docker
      KAREN_E2E_CAPTURE_VIDEO: "false"
      CI: "true"
    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme
    steps:
      - name: Require current reviewed main before Docker browser checkout
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$TARGET_SHA" = "$GITHUB_SHA"
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$current" = "$TARGET_SHA"

      - name: Check out exact reviewed Docker browser source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify public Docker revision and canonical backend before browser setup
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python scripts/ci/verify_deployment_revision.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install pinned Docker acceptance browser dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Docker acceptance
        run: npx playwright install --with-deps chromium

      - name: Prove real authenticated Docker search and replay
        shell: bash
        env:
          KAREN_UX_EMAIL: ${{ secrets.KAREN_UX_EMAIL }}
          KAREN_UX_PASSWORD: ${{ secrets.KAREN_UX_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KAREN_UX_EMAIL"
          test -n "$KAREN_UX_PASSWORD"
          npm run test:e2e:search-release -- --reporter=list --retries=0

      - name: Recheck public Docker revision and main after browser replay
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci/verify_deployment_revision.py
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$current" = "$TARGET_SHA"

      # No trace/video/screenshot or credential-bearing report upload.

  # Recheck the exact Docker signatures and running images only after the
  # credentialed browser has demonstrated durable citations and replay.
  docker-provenance-after:
    if: inputs.scenario == 'docker-search' && github.ref == 'refs/heads/main'
    needs: authenticated-docker-search-replay
    runs-on: [self-hosted, Linux, X64, karen-consumer-release]
    timeout-minutes: 20
    environment: karen-sanitized-browser-acceptance
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      KAREN_RELEASE_REPO_ROOT: ${{ vars.KAREN_DOCKER_RELEASE_REPO_ROOT }}
      KAREN_RELEASE_REPOSITORY: ${{ github.repository }}
      KAREN_BASE_URL: ${{ vars.KAREN_DOCKER_SEARCH_ACCEPTANCE_URL }}
      KAREN_SIGNED_API_IMAGE_REF: ${{ vars.KAREN_SIGNED_API_IMAGE_REF }}
      KAREN_SIGNED_WEB_IMAGE_REF: ${{ vars.KAREN_SIGNED_WEB_IMAGE_REF }}
      KAREN_EXPECTED_API_IMAGE_ID: ${{ vars.KAREN_EXPECTED_API_IMAGE_ID }}
      KAREN_EXPECTED_WEB_IMAGE_ID: ${{ vars.KAREN_EXPECTED_WEB_IMAGE_ID }}
    steps:
      - name: Require same reviewed main before Docker post-checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$current" = "$TARGET_SHA"

      - name: Check out reviewed main for final Docker host verification
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Reverify signed Docker containers and public HTTPS after browser
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verify_docker_browser_host.sh
