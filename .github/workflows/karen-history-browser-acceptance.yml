name: KAREN Browser Acceptance

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Browser acceptance scenario
        type: choice
        required: true
        default: history
        options:
          - history
          - search
          - copilotkit
      target_sha:
        description: Exact reviewed 40-character PR commit SHA for search or CopilotKit acceptance
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: karen-history-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticated-history-restoration:
    if: inputs.scenario == 'history'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: karen-sanitized-browser-acceptance
    env:
      KAREN_BASE_URL: ${{ vars.KAREN_HISTORY_ACCEPTANCE_URL }}
      KAREN_UX_EMAIL: ${{ secrets.KAREN_UX_EMAIL }}
      KAREN_UX_PASSWORD: ${{ secrets.KAREN_UX_PASSWORD }}
      KAREN_HISTORY_CONVERSATION_ID: ${{ vars.KAREN_HISTORY_CONVERSATION_ID }}
      KAREN_HISTORY_ACCEPTANCE_REQUIRED: "true"
      KAREN_UX_IDENTITY_REPLAY: "true"
      KAREN_E2E_CAPTURE_VIDEO: "false"
      CI: "true"

    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate approved acceptance configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$KAREN_BASE_URL" || { echo "::error::Missing approved deployment URL"; exit 1; }
          test -n "$KAREN_UX_EMAIL" || { echo "::error::Missing acceptance identity"; exit 1; }
          test -n "$KAREN_UX_PASSWORD" || { echo "::error::Missing acceptance credential"; exit 1; }
          test -n "$KAREN_HISTORY_CONVERSATION_ID" || { echo "::error::Missing persisted conversation ID"; exit 1; }
          case "$KAREN_BASE_URL" in
            https://*) ;;
            *) echo "::error::Acceptance URL must use HTTPS"; exit 1 ;;
          esac

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Prove live authenticated conversation restoration
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test e2e/karen-durable-history-restoration.spec.ts \
            --config=e2e/playwright.config.ts \
            --project=chromium \
            --reporter=list \
            --retries=0

      # Intentionally no trace, video, screenshot, JSON/HTML artifact upload:
      # authenticated test credentials and user conversation content are sensitive.

  authenticated-search-replay:
    if: inputs.scenario == 'search'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: karen-sanitized-browser-acceptance
    env:
      KAREN_BASE_URL: ${{ vars.KAREN_SEARCH_ACCEPTANCE_URL }}
      KAREN_UX_EMAIL: ${{ secrets.KAREN_UX_EMAIL }}
      KAREN_UX_PASSWORD: ${{ secrets.KAREN_UX_PASSWORD }}
      KAREN_SEARCH_ACCEPTANCE_REQUIRED: "true"
      KAREN_E2E_CAPTURE_VIDEO: "false"
      CI: "true"

    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - name: Require pinned reviewed source revision
        working-directory: .
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Provide a reviewed 40-character commit SHA"; exit 1; }

      - name: Verify reviewed SHA is the current consumer release PR head
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(gh api repos/${GITHUB_REPOSITORY}/pulls/550 --jq '.head.sha')"
          test "$TARGET_SHA" = "$actual_sha" || {
            echo "::error::Requested revision does not match current PR #550 head"
            exit 1
          }

      - name: Check out exact reviewed source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Validate approved search deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
          test -n "$KAREN_BASE_URL" || { echo "::error::Missing approved search deployment URL"; exit 1; }
          test -n "$KAREN_UX_EMAIL" || { echo "::error::Missing acceptance identity"; exit 1; }
          test -n "$KAREN_UX_PASSWORD" || { echo "::error::Missing acceptance credential"; exit 1; }
          case "$KAREN_BASE_URL" in
            https://*) ;;
            *) echo "::error::Acceptance URL must use HTTPS"; exit 1 ;;
          esac

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Prove live authenticated grounded search and replay
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e:search-release -- --reporter=list --retries=0

      # Never upload traces, videos, screenshots, or credential-bearing reports.

  authenticated-copilotkit-replay:
    if: inputs.scenario == 'copilotkit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: karen-sanitized-browser-acceptance
    env:
      KAREN_BASE_URL: ${{ vars.KAREN_HISTORY_ACCEPTANCE_URL }}
      KAREN_UX_EMAIL: ${{ secrets.KAREN_UX_EMAIL }}
      KAREN_UX_PASSWORD: ${{ secrets.KAREN_UX_PASSWORD }}
      KAREN_HISTORY_CONVERSATION_ID: ${{ vars.KAREN_HISTORY_CONVERSATION_ID }}
      KAREN_COPILOTKIT_OBSERVED_RUN_ID: ${{ vars.KAREN_COPILOTKIT_OBSERVED_RUN_ID }}
      KAREN_COPILOTKIT_ACCEPTANCE_REQUIRED: "true"
      KAREN_UX_IDENTITY_REPLAY: "true"
      KAREN_E2E_CAPTURE_VIDEO: "false"
      CI: "true"

    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - name: Require exact reviewed CopilotKit PR revision
        working-directory: .
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Provide the reviewed 40-character PR SHA"
            exit 1
          }
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/556" --jq '.head.sha')"
          test "$TARGET_SHA" = "$current_sha" || {
            echo "::error::Requested revision is not current PR #556 head"
            exit 1
          }

      - name: Check out exact CopilotKit PR revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Validate sanitized acceptance deployment and fixture
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -n "$KAREN_BASE_URL" || { echo "::error::Missing deployment URL"; exit 1; }
          test -n "$KAREN_UX_EMAIL" || { echo "::error::Missing sanitized identity"; exit 1; }
          test -n "$KAREN_UX_PASSWORD" || { echo "::error::Missing acceptance credential"; exit 1; }
          [[ "$KAREN_HISTORY_CONVERSATION_ID" =~ ^[a-fA-F0-9-]{36}$ ]] || {
            echo "::error::Missing real approved conversation UUID"
            exit 1
          }
          [[ "$KAREN_COPILOTKIT_OBSERVED_RUN_ID" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || {
            echo "::error::Missing real observed event-journal run ID"
            exit 1
          }
          case "$KAREN_BASE_URL" in
            https://*) ;;
            *) echo "::error::Acceptance deployment must use HTTPS"; exit 1 ;;
          esac

      - name: Verify running deployment revision matches reviewed SHA
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          # Canonical read-only revision endpoint is owned by PR #550.
          curl --fail --silent --show-error --max-time 20 --max-redirs 0 \
            --header 'Accept: application/json' \
            --header 'Cache-Control: no-cache' \
            "${KAREN_BASE_URL%/}/api/deployment-revision" | \
            python -c 'import json,os,sys; data=json.load(sys.stdin); assert data.get("status")=="ok" and data.get("revision")==os.environ["TARGET_SHA"], "Stale or unverified deployment revision"'

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Prove owned CopilotKit protocol and observed-run continuity
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test e2e/karen-copilotkit-protocol-acceptance.spec.ts \
            --config=e2e/playwright.config.ts \
            --project=chromium \
            --reporter=list \
            --retries=0

      # Never upload traces, browser state, videos, credentials, or saved text.
