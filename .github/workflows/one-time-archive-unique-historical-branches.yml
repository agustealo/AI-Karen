name: One-time archive and prune old unique branch refs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-archive-unique-historical-branches.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-archive-unique-historical-branches
  cancel-in-progress: false

jobs:
  archive-and-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Fetch current refs
        run: git -c protocol.version=2 fetch --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Archive and verify history before pruning
        uses: actions/github-script@v7
        with:
          script: |
            
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const owner=context.repo.owner, repo=context.repo.repo, fullName=context.repo.owner+'/'+context.repo.repo;
            const tag='branch-archive/2026-11-14-final-historical-unique-tips';
            const manifestPath='.branch-archives/2026-11-14-final-historical-unique-tips.json';
            const minDays=7, cutoff=Date.now() - minDays*86400000;
            const targets=[{"name":"feat/kchat-governed-search-results-20261105","sha":"f9c153d611d7b36e3738f4785d2dde302cc3162f"},{"name":"feat/kchat-native-expression-agui-stream-20261104","sha":"88fa1395d7810936cd5a009eb49dd9197e498222"},{"name":"feat/search-to-assistant-composer-20261024","sha":"f7c6190695350c78f75cb20dfbcc9ef9dbcd34d2"},{"name":"fix/kchat-p0-chat-recovery","sha":"b65c8e3f0b87b6242e199e117d33bb53c5c7d720"},{"name":"fix/redis-rate-limit-fail-closed-20261028","sha":"a4398ed6027ec197339575a1ffdbb24ccdf6755c"}];
            const git=(args,env)=>execFileSync('git',args,{
             encoding:'utf8',maxBuffer:16*1024*1024,stdio:['ignore','pipe','pipe'],...(env?{env}:{})
            }).trim();
            const repoData=(await github.rest.repos.get({owner,repo})).data;
            const mainName=repoData.default_branch, mainSha=git(['rev-parse','refs/remotes/origin/'+mainName]);
            const prs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'all',per_page:100});
            const eligible=[],withheld=[],deleted=[],failed=[];
            for(const t of targets){
             try{
              if(t.name===mainName || t.name.startsWith('release/')) {withheld.push({name:t.name,reason:'protected_name'});continue;}
              const br=(await github.rest.repos.getBranch({owner,repo,branch:t.name})).data;
              if(br.protected || br.commit.sha!==t.sha) {withheld.push({name:t.name,reason:'protected_or_head_moved'});continue;}
              const linked=prs.filter(p=>p.head?.repo?.full_name===fullName && p.head.ref===t.name);
              if(prs.some(p=>p.state==='open' && (p.head?.repo?.full_name===fullName && p.head.ref===t.name || p.base?.repo?.full_name===fullName && p.base.ref===t.name))){
               withheld.push({name:t.name,reason:'active_open_pr'});continue;
              }
              if(linked.some(p=>p.state!=='closed' || !p.updated_at || new Date(p.updated_at).getTime()>cutoff)){
               withheld.push({name:t.name,reason:'recent_or_unresolved_pr_activity'});continue;
              }
              if(linked.some(p=>(p.labels||[]).some(l=>/^(keep|hold|do-not-delete|in-progress|wip)$/i.test(l.name)))){
               withheld.push({name:t.name,reason:'retention_label'});continue;
              }
              const committedAt=git(['show','-s','--format=%cI',t.sha]);
              if(!committedAt || new Date(committedAt).getTime()>cutoff){
               withheld.push({name:t.name,reason:'young_or_unverifiable_tip',committed_at:committedAt});continue;
              }
              let referenced=false;
              try{referenced=Boolean(git(['grep','-F','-l','-e',t.name,'--','.github']));}
              catch(error){if(error.status!==1)throw error;}
              if(referenced){withheld.push({name:t.name,reason:'referenced_in_active_ci_config'});continue;}
              git(['cat-file','-e',t.sha+'^{commit}']);
              const ancestor=git(['merge-base',mainSha,t.sha]);
              const unique=Number(git(['rev-list','--count',mainSha+'..'+t.sha]));
              if(!Number.isInteger(unique)||unique<=0){withheld.push({name:t.name,reason:'no_unique_history'});continue;}
              const filesRaw=git(['diff','--name-only',ancestor,t.sha]);
              const touchedFiles=filesRaw?filesRaw.split('\n').filter(Boolean):[];
              if(touchedFiles.length>200){withheld.push({name:t.name,reason:'large_unreviewed_file_surface',count:touchedFiles.length});continue;}
              eligible.push({
               ...t, classification:'unique_history_archived_not_integrated_into_main',
               committed_at:committedAt,unique_commits_vs_main:unique,merge_base:ancestor,
               touched_paths:touchedFiles,
               prs:linked.map(p=>({number:p.number,state:p.state,merged_at:p.merged_at,pr_head_sha:p.head.sha}))
              });
             }catch(e){failed.push({name:t.name,stage:'preflight',status:e.status??null,message:e.message});}
            }
            let archive=null;
            if(failed.length===0 && withheld.length===0 && eligible.length===targets.length) {
             try {
              try {
               const existing=await github.rest.git.getRef({owner,repo,ref:'tags/'+tag});
               throw new Error('Archive tag already exists: '+existing.data.object.sha);
              }catch(e){if(e.status!==404)throw e;}
              const manifest={
               repository:fullName,main_branch:mainName,main_at_audit:mainSha,
               created_at:new Date().toISOString(), archive_tag:tag,
               statement:'The archived histories are NOT asserted to be merged into main. Their original commit objects are preserved as archive commit parents.',
               recovery:'git fetch origin tag '+tag+'; git show '+tag+':'+manifestPath+'; git branch RECOVERY_NAME ORIGINAL_SHA',
               branches:eligible
              };
              fs.mkdirSync(path.dirname(manifestPath),{recursive:true});
              fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
              git(['add','--',manifestPath]);
              const tree=git(['write-tree']);
              const env={...process.env,
               GIT_AUTHOR_NAME:'AI-Karen Branch Archive',GIT_AUTHOR_EMAIL:'actions@users.noreply.github.com',
               GIT_COMMITTER_NAME:'AI-Karen Branch Archive',GIT_COMMITTER_EMAIL:'actions@users.noreply.github.com'};
              archive=git(['commit-tree',tree,'-p',mainSha,...eligible.flatMap(e=>['-p',e.sha]),
               '-m','Archive five historical unmerged branch tips without integrating code'],env);
              for(const e of eligible)git(['merge-base','--is-ancestor',e.sha,archive]);
              git(['push','origin',archive+':refs/tags/'+tag]);
              const verified=(await github.rest.git.getRef({owner,repo,ref:'tags/'+tag})).data;
              if(verified.object.sha!==archive)throw new Error('Archive SHA mismatch');
              const remote=(await github.rest.repos.getContent({owner,repo,path:manifestPath,ref:tag})).data;
              if(Array.isArray(remote)||remote.type!=='file')throw new Error('Missing remote manifest');
              const observed=JSON.parse(Buffer.from(remote.content,'base64').toString('utf8'));
              if(observed.branches.length!==eligible.length ||
               eligible.some((e,i)=>observed.branches[i].name!==e.name||observed.branches[i].sha!==e.sha)){
                throw new Error('Archive manifest mismatch');
              }
              core.info('Archive verified: '+tag+', commit '+archive+', tips='+eligible.length);
             }catch(e){failed.push({stage:'archive',message:e.message});archive=null;}
            }
            if(archive && failed.length===0){
             for(const e of eligible){
              try{
               const branch=(await github.rest.repos.getBranch({owner,repo,branch:e.name})).data;
               if(branch.protected||branch.commit.sha!==e.sha){withheld.push({name:e.name,reason:'head_moved_before_deletion'});continue;}
               const open=await github.rest.pulls.list({owner,repo,state:'open',head:owner+':'+e.name,per_page:100});
               if(open.data.length){withheld.push({name:e.name,reason:'new_open_pr'});continue;}
               git(['merge-base','--is-ancestor',e.sha,archive]);
               await github.rest.git.deleteRef({owner,repo,ref:'heads/'+e.name});
               deleted.push(e);
              }catch(e2){failed.push({name:e.name,stage:'delete',status:e2.status??null,message:e2.message});}
             }
            }
            const report={repository:fullName,main_sha_at_audit:mainSha,planned:targets.length,
             eligible_count:eligible.length,archive_tag:archive?tag:null,archive_commit:archive,
             deleted_count:deleted.length,withheld_count:withheld.length,failed_count:failed.length,
             deleted,withheld,failed};
            fs.writeFileSync('historical-unique-branch-audit.json',JSON.stringify(report,null,2));
            core.info(JSON.stringify({eligible:eligible.length,deleted:deleted.length,withheld:withheld.length,failed:failed.length,tag:report.archive_tag}));
            await core.summary.addHeading('Historic unique branch archive and prune').addTable([
             [{data:'Metric',header:true},{data:'Count',header:true}],
             ['Planned',String(targets.length)],['Deleted with recovered history',String(deleted.length)],
             ['Withheld',String(withheld.length)],['Failed',String(failed.length)]
            ]).write();
            if(failed.length)core.setFailed('Archive or deletion failed: see audit artifact.');

      - name: Upload verified audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-unique-branch-audit
          path: historical-unique-branch-audit.json
          if-no-files-found: warn
          retention-days: 60
