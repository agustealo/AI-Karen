name: Render Beta Service Reconcile

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed 40-character main SHA
        type: string
        required: true
      mode:
        description: Inspect only, or apply reviewed Git branch, manual deploy policy and HTTP liveness path to the existing service
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - apply
          - inspect-env
          - inspect-consumer

      service_id:
        description: Existing Render web service ID; fallback only when RENDER_BETA_SERVICE_ID is unset
        type: string
        required: false
      workspace_id:
        description: Existing Render workspace ID; fallback only when RENDER_BETA_WORKSPACE_ID is unset
        type: string
        required: false
      postgres_id:
        description: Existing Render PostgreSQL ID for environment inspections only
        type: string
        required: false
      key_value_id:
        description: Existing Render Key Value ID for environment inspections only
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: render-beta-service-reconcile
  cancel-in-progress: false

jobs:
  reconcile-existing-beta-api:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: beta-release
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      MODE: ${{ inputs.mode }}
      # Reviewed repository/environment selectors are authoritative. Explicit
      # dispatch inputs are a recovery-only fallback when those vars are absent.
      RENDER_BETA_SERVICE_ID: ${{ vars.RENDER_BETA_SERVICE_ID || inputs.service_id }}
      RENDER_BETA_WORKSPACE_ID: ${{ vars.RENDER_BETA_WORKSPACE_ID || inputs.workspace_id }}
      RENDER_BETA_POSTGRES_ID: ${{ vars.RENDER_BETA_POSTGRES_ID || inputs.postgres_id }}
      RENDER_BETA_KEY_VALUE_ID: ${{ vars.RENDER_BETA_KEY_VALUE_ID || inputs.key_value_id }}
      RENDER_CONFIG_SERVICE_ID: ${{ vars.RENDER_BETA_SERVICE_ID }}
      RENDER_CONFIG_WORKSPACE_ID: ${{ vars.RENDER_BETA_WORKSPACE_ID }}
      RENDER_CONFIG_POSTGRES_ID: ${{ vars.RENDER_BETA_POSTGRES_ID }}
      RENDER_CONFIG_KEY_VALUE_ID: ${{ vars.RENDER_BETA_KEY_VALUE_ID }}
      RENDER_INPUT_SERVICE_ID: ${{ inputs.service_id }}
      RENDER_INPUT_WORKSPACE_ID: ${{ inputs.workspace_id }}
      RENDER_INPUT_POSTGRES_ID: ${{ inputs.postgres_id }}
      RENDER_INPUT_KEY_VALUE_ID: ${{ inputs.key_value_id }}

    steps:
      - name: Check out reviewed main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require approved main identity and existing service selectors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Expected full reviewed main SHA"; exit 1; }
          test "$TARGET_SHA" = "$GITHUB_SHA" || { echo "::error::Dispatched SHA does not match source checkout"; exit 1; }
          test "$TARGET_SHA" = "$(git rev-parse HEAD)" || { echo "::error::Checkout SHA mismatch"; exit 1; }
          ACTUAL_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$TARGET_SHA" = "$ACTUAL_MAIN" || { echo "::error::Main moved after workflow dispatch"; exit 1; }
          # Environment-owned selectors may never be overridden through a
          # manual dispatch. Check before Render secrets or network calls.
          for kind in SERVICE WORKSPACE POSTGRES KEY_VALUE; do
            config_var="RENDER_CONFIG_${kind}_ID"
            input_var="RENDER_INPUT_${kind}_ID"
            if [[ -n "${!config_var}" && -n "${!input_var}" && "${!config_var}" != "${!input_var}" ]]; then
              echo "::error::Explicit Render resource selector conflicts with reviewed environment configuration"
              exit 1
            fi
          done
          [[ "$RENDER_BETA_SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]] || {
            echo "::error::Existing Render beta service ID is missing or malformed"; exit 1;
          }
          [[ "$RENDER_BETA_WORKSPACE_ID" =~ ^tea-[a-z0-9]+$ ]] || {
            echo "::error::Existing Render workspace ID is missing or malformed"; exit 1;
          }
          if [[ "$MODE" == "inspect-env" || "$MODE" == "inspect-consumer" ]]; then
            [[ "$RENDER_BETA_POSTGRES_ID" =~ ^dpg-[a-z0-9-]+$ ]] || {
              echo "::error::Existing PostgreSQL ID is missing or malformed"; exit 1;
            }
            [[ "$RENDER_BETA_KEY_VALUE_ID" =~ ^red-[a-z0-9-]+$ ]] || {
              echo "::error::Existing Key Value ID is missing or malformed"; exit 1;
            }
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconcile only existing Render service Git source
        if: env.MODE != 'inspect-env' && env.MODE != 'inspect-consumer'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          # The initial checkout check is not enough: main can advance
          # during setup. Recheck directly at each protected network boundary.
          LIVE_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$TARGET_SHA" = "$GITHUB_SHA" || { echo "::error::Reviewed dispatch SHA changed"; exit 1; }
          test "$TARGET_SHA" = "$LIVE_MAIN" || { echo "::error::Main advanced before Render inspection or apply"; exit 1; }
          test -n "$RENDER_API_KEY" || { echo "::error::Protected Render API credential is missing"; exit 1; }
          python scripts/deploy/reconcile_render_beta_service.py \
            --service-id "$RENDER_BETA_SERVICE_ID" \
            --workspace-id "$RENDER_BETA_WORKSPACE_ID" \
            --manifest deploy/render/render.yaml \
            --mode "$MODE"

      - name: Inspect the existing beta environment and private datastore links
        if: env.MODE == 'inspect-env' || env.MODE == 'inspect-consumer'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          # The initial checkout check is not enough: main can advance
          # during setup. Recheck directly at each protected network boundary.
          LIVE_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$TARGET_SHA" = "$GITHUB_SHA" || { echo "::error::Reviewed dispatch SHA changed"; exit 1; }
          test "$TARGET_SHA" = "$LIVE_MAIN" || { echo "::error::Main advanced before Render inspection or apply"; exit 1; }
          test -n "$RENDER_API_KEY" || { echo "::error::Protected Render API credential is missing"; exit 1; }
          test -n "$RENDER_BETA_POSTGRES_ID" || { echo "::error::Existing Postgres ID is missing"; exit 1; }
          test -n "$RENDER_BETA_KEY_VALUE_ID" || { echo "::error::Existing Key Value ID is missing"; exit 1; }
          extra_args=()
          if [[ "$MODE" == "inspect-consumer" ]]; then
            extra_args+=(--require-governed-history --expected-deployed-sha "$TARGET_SHA")
          fi
          python scripts/deploy/inspect_render_beta_environment.py \
            --service-id "$RENDER_BETA_SERVICE_ID" \
            --workspace-id "$RENDER_BETA_WORKSPACE_ID" \
            --postgres-id "$RENDER_BETA_POSTGRES_ID" \
            --key-value-id "$RENDER_BETA_KEY_VALUE_ID" \
            --manifest deploy/render/render.yaml "${extra_args[@]}"

      # This workflow deliberately never deploys or modifies a database,
      # Redis service, credentials, env vars, or frontend routing.
