name: Beta Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "beta-*"
      - "v*-beta*"

permissions:
  contents: read

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Attest exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'release_sha=%s\n' "$actual_sha" | tee beta-release-sha.txt

      - name: Install focused release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest pytest-asyncio sqlalchemy asyncpg psycopg psycopg2-binary \
            PyJWT bcrypt argon2-cffi structlog cryptography PyYAML \
            pydantic pydantic-settings python-dotenv prometheus_client \
            fastapi httpx requests tenacity redis fakeredis

      - name: Compile source tree
        run: python -m compileall -q src server scripts

      - name: Prove provider and Core authority
        run: |
          pytest tests/architecture/test_core_ai_machine_isolation.py -q
          pytest tests/architecture/test_provider_chat_authority.py -q
          pytest tests/beta/test_real_model_wiring.py -q

      - name: Prove memory ownership
        run: pytest tests/architecture/test_memory_consumer_domain_migration.py -q

      - name: Prove production auth and tenant security
        run: |
          pytest tests/architecture/test_auth_production_security_contract.py -q
          pytest tests/architecture/test_auth_session_security_contract.py -q
          pytest tests/architecture/test_auth_session_validation_contract.py -q
          pytest tests/security/test_tenant_isolation_gauntlet.py -q

      - name: Prove production database and recovery contracts
        run: |
          pytest tests/architecture/test_production_database_baseline_contract.py -q
          pytest tests/architecture/test_production_data_recovery_contract.py -q
          bash -n scripts/deploy/database-backup.sh
          bash -n scripts/deploy/database-restore.sh
          bash -n scripts/deploy/migrate-production-database.sh

      - name: Prove canonical production deployment contract
        run: |
          pytest tests/architecture/test_production_deployment_contract.py -q
          pytest tests/architecture/test_operational_health_authority.py -q
          cp .env.production.example .env.production
          docker compose \
            --env-file .env.production \
            -f docker-compose.yml \
            -f deploy/compose/docker-compose.prod.yml \
            config > /tmp/ai-karen-production-compose.yml
          test -s /tmp/ai-karen-production-compose.yml
          grep -q 'AUTH_DEV_MODE: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'KARI_AUTH_BYPASS: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'AUTH_ALLOW_DEV_LOGIN: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'EXTENSION_DEV_BYPASS_ENABLED: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'KARI_DEFER_ROUTER_WIRING: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'AUTH_ENABLE_SESSION_VALIDATION: "true"' /tmp/ai-karen-production-compose.yml
          grep -q 'KAREN_BUILTIN_VLLM_ENABLED: "false"' /tmp/ai-karen-production-compose.yml
          grep -q 'http://localhost:8000/health/live' /tmp/ai-karen-production-compose.yml
          grep -q 'NODE_ENV: production' /tmp/ai-karen-production-compose.yml
          ! grep -q 'npm run dev' /tmp/ai-karen-production-compose.yml
          ! grep -q 'source: .*/AI-Karen' /tmp/ai-karen-production-compose.yml
          ! grep -q 'target: /app$' /tmp/ai-karen-production-compose.yml

      - name: Reject retired authorities
        shell: bash
        run: |
          set -euo pipefail
          test ! -e server/health_endpoints.py
          test ! -e src/ai_karen_engine/core/expression/engines/builtin_provider_engine.py
          test ! -e src/ai_karen_engine/core/model_runtime/providers/vllm_runtime.py
          refs=$(grep -R --line-number --include='*.py' \
            -E 'preferred_provider=["'"']builtin_vllm["'"']|provider_id=["'"']builtin_vllm["'"']|from .*vllm_runtime import VLLMRuntime|import .*vllm_runtime' \
            tests src/ai_karen_engine/core/expression || true)
          test -z "$refs" || { echo "$refs"; exit 1; }

      - name: Upload exact-SHA attestation
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-sha
          path: beta-release-sha.txt
          if-no-files-found: error
          retention-days: 30

  frontend-production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/ui_launchers/Karen-AI-Theme

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/ui_launchers/Karen-AI-Theme/package-lock.json

      - name: Attest exact release SHA
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install frontend dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Reject production mocks
        run: npm run ci:forbid-mocks

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npx vitest run --passWithNoTests

      - name: Install Chromium for first-run proof
        run: npx playwright install --with-deps chromium

      - name: Prove first-run browser journey
        env:
          CI: "true"
        run: npx playwright test e2e/test_first_run_setup.spec.ts --project=chromium

      - name: Build production frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          KAREN_BACKEND_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Build production web image
        working-directory: .
        run: docker build -f src/ui_launchers/Karen-AI-Theme/Dockerfile.production src/ui_launchers/Karen-AI-Theme

  auth-postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karen_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d karen_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Attest exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install auth integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest pytest-asyncio sqlalchemy asyncpg PyJWT bcrypt structlog \
            cryptography PyYAML pydantic pydantic-settings python-dotenv \
            prometheus_client

      - name: Prove real PostgreSQL auth concurrency
        env:
          PYTHONPATH: src
          AUTH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/karen_auth_test
        run: |
          pytest tests/integration/test_first_admin_concurrency_postgres.py -q
          pytest tests/integration/test_auth_refresh_concurrency_postgres.py -q

  live-model-proof:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - karen-beta-model
    timeout-minutes: 5
    environment: beta-release
    env:
      BETA_MODEL_BASE_URL: ${{ vars.BETA_MODEL_BASE_URL }}
      BETA_MODEL_API_KEY: ${{ secrets.BETA_MODEL_API_KEY }}
      BETA_MODEL_NAME: ${{ vars.BETA_MODEL_NAME }}
      BETA_MODEL_TIMEOUT_SECONDS: "90"

    steps:
      - uses: actions/checkout@v4

      - name: Attest exact release SHA
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Runner checkout $actual does not match expected $env:GITHUB_SHA"
          }
          Write-Host "beta_live_model_sha=$actual"

      - name: Compile live-model smoke harness
        run: python -m py_compile scripts/beta_live_model_smoke.py

      - name: Prove genuine local model inference
        run: python scripts/beta_live_model_smoke.py

  beta-release-approved:
    runs-on: ubuntu-latest
    needs:
      - release-contracts
      - frontend-production-contract
      - auth-postgres-concurrency
      - live-model-proof
    steps:
      - name: Publish release decision
        run: |
          echo "BETA RELEASE GATE PASSED"
          echo "release_sha=$GITHUB_SHA"
